<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeloitteLand Hub - Action Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Urbanist', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        deloitte: {
                            green: '#86BC25',
                            dark: '#000000',
                            panel: '#0F172A',
                            border: '#1E293B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #020617; 
            color: #F8FAFC;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        .cyber-grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .cyber-glow {
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(134, 188, 37, 0.08) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(134, 188, 37, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(134, 188, 37, 0.6); }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="cyber-glow"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // DATA REQUIRED FOR ACTION PLAN
        const orgData = [
            { id: "#004", name: "Victoria Vance", role: "Chief Executive Officer", pronouns: "She/Her", traits: ["Strategic Visionary", "Women in STEM Mentor", "Neurodiversity Advocate"], ip: "10.45.99.201", img: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=200&h=200", status: "Active" },
            { id: "#007", name: "Aisha Johnson", role: "Chief Operating Officer", pronouns: "She/They", traits: ["Operational Excellence", "Accessibility Champion", "BIPOC Leadership Sponsor"], ip: "10.45.99.202", img: "https://images.unsplash.com/photo-1531123897727-8f129e1bf98c?auto=format&fit=crop&q=80&w=200&h=200", status: "Active" },
            { id: "#012", name: "Marcus Chen", role: "Chief Financial Officer", pronouns: "He/Him", traits: ["Risk Mitigation", "First-Gen Corporate Sponsor", "Working Parents Network"], ip: "10.45.99.203", img: "https://images.unsplash.com/photo-1506277886164-e25aa3f4ef7f?auto=format&fit=crop&q=80&w=200&h=200", status: "Active" },
            { id: "#002", name: "Dr. Alex Thorne", role: "Chief Technology Officer", pronouns: "He/Him", traits: ["AI Architect", "Mental Health Advocate", "Ethical Tech Lead"], ip: "10.45.99.204", img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&q=80&w=200&h=200", status: "Leave of Absence" },
            { id: "#045", name: "Elena Rodriguez", role: "Chief People Officer", pronouns: "She/Her", traits: ["Cultural Transformation", "LGBTQ+ Ally", "Pay Equity Taskforce"], ip: "10.45.99.205", img: "https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&q=80&w=200&h=200", status: "Active" },
            { id: "#088", name: "David Kim", role: "VP of Engineering", pronouns: "He/Him", traits: ["Agile Coach", "Veteran Sponsor", "Inclusive Hiring Chair"], ip: "10.45.99.210", img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=200&h=200", status: "Active" }
        ];

        const logsData = [
            { time: "01:15:22", ip: "10.45.99.203", event: "ROUTINE_BACKUP_INIT", status: "SUCCESS" },
            { time: "01:45:10", ip: "10.45.99.210", event: "API_GATEWAY_SYNC", status: "SUCCESS" },
            { time: "02:30:05", ip: "10.45.99.204", event: "FAILED_LOGIN_ATTEMPT", status: "WARNING" },
            { time: "03:00:12", ip: "10.45.99.201", event: "UNAUTHORIZED_LEDGER_ACCESS", status: "CRITICAL" },
            { time: "03:01:45", ip: "10.45.99.201", event: "DATA_SCRUB_EXECUTED", status: "CRITICAL" },
            { time: "03:02:10", ip: "10.45.99.201", event: "AUDIT_TRAIL_DELETED", status: "CRITICAL" },
            { time: "04:15:00", ip: "SYSTEM", event: "AUTO_REBOOT_TRIGGERED", status: "INFO" }
        ];

        const ledgerData = [
            { id: "TXN-8821", date: "08/10", vendor: "AWS Cloud Services", amount: "$145,000", status: "CLEARED" },
            { id: "TXN-8822", date: "08/12", vendor: "WeWork Real Estate", amount: "$85,000", status: "CLEARED" },
            { id: "TXN-8823", date: "08/13", vendor: "Global Legal Partners", amount: "$400,000", status: "CLEARED" },
            { id: "TXN-8824", date: "08/14", vendor: "APEX Shell Logistics", amount: "$22,000,000", status: "PENDING_WIRE" },
            { id: "TXN-8825", date: "08/15", vendor: "Salesforce CRM", amount: "$120,000", status: "CLEARED" }
        ];

        // ACTION PLAN COMPONENTS
        function QuestNavBtn({ icon, label, isActive, onClick, locked = false, className = "", disabled = false }) {
            return (
                <button onClick={disabled ? undefined : onClick} className={`flex items-center justify-between w-full p-3 rounded-lg text-sm font-medium transition-all duration-200 ${isActive ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30 shadow-inner' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200 border border-transparent'} ${className}`}>
                    <div className="flex items-center gap-3"><i className={`fa-solid ${icon} w-5 text-center`}></i> {label}</div>
                    {locked && <i className="fa-solid fa-lock text-slate-600 text-xs"></i>}
                </button>
            );
        }

        function QuestView() {
            const [activeTab, setActiveTab] = useState('org');
            const [unlockedNodes, setUnlockedNodes] = useState({ logs: false, ledger: false, banking: false });
            const [solvedPuzzles, setSolvedPuzzles] = useState({ puzzle1: false, puzzle2: false, puzzle3: false });
            
            // Sub-States for Org Chart Search
            const [search, setSearch] = useState('');
            const isHacked = search === '#004' || search === '004';
            
            // Sub-States for Unlocks
            const [unlockInput, setUnlockInput] = useState('');
            const [unlockError, setUnlockError] = useState(false);

            const allNodesUnlocked = unlockedNodes.logs && unlockedNodes.ledger && unlockedNodes.banking;
            const allPuzzlesSolved = solvedPuzzles.puzzle1 && solvedPuzzles.puzzle2 && solvedPuzzles.puzzle3;

            const handleUnlock = (e, nodeKey, expected) => {
                e.preventDefault();
                const cleanInput = unlockInput.trim().toUpperCase().replace(/,/g, '');
                if (expected.some(ans => cleanInput === ans.toUpperCase())) {
                    setUnlockError(false); setUnlockInput('');
                    setUnlockedNodes(prev => ({ ...prev, [nodeKey]: true }));
                } else {
                    setUnlockError(true);
                    setTimeout(() => setUnlockError(false), 2000);
                }
            };

            const renderUnlock = (title, hint, nodeKey, expected) => (
                <div className="flex flex-col items-center justify-center h-full fade-in">
                    <div className="max-w-lg w-full p-8 glass-panel border border-slate-700 rounded-xl shadow-2xl text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-500"></div>
                        <i className="fa-solid fa-lock text-5xl mb-6 text-slate-500"></i>
                        <h2 className="text-2xl font-bold mb-2 tracking-widest text-white uppercase">{title}</h2>
                        <p className="text-slate-400 mb-8 text-sm px-4 leading-relaxed">{hint}</p>
                        <form onSubmit={(e) => handleUnlock(e, nodeKey, expected)}>
                            <input type="text" value={unlockInput} onChange={(e) => setUnlockInput(e.target.value)} className={`w-full bg-slate-950 border ${unlockError ? 'border-red-500 text-red-400' : 'border-slate-700 text-amber-400'} rounded p-4 text-center text-lg tracking-widest outline-none transition-all mb-6 uppercase`} placeholder="ENTER KEY" autoFocus />
                            <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-3 px-4 rounded transition-colors uppercase tracking-wider flex items-center justify-center gap-2"><i className="fa-solid fa-key"></i> Decrypt Node</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="h-screen w-screen flex flex-col md:flex-row p-4 gap-4 box-border max-w-[1600px] mx-auto fade-in">
                    <nav className="w-full md:w-64 glass-panel border border-slate-700 p-4 rounded-xl flex flex-col gap-2 shrink-0 z-10 overflow-y-auto custom-scrollbar">
                        <div className="mb-4 pb-4 border-b border-slate-800">
                            <h1 className="text-xl font-bold text-amber-400 tracking-wider flex items-center gap-2 uppercase"><i className="fa-solid fa-fingerprint text-2xl"></i> Action Plan</h1>
                        </div>
                        <div className="text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-1 mt-1">Investigation Hub</div>
                        <QuestNavBtn icon="fa-users" label="Corporate Directory" isActive={activeTab === 'org'} onClick={() => {setActiveTab('org'); setUnlockInput('');}} />
                        <div className="text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-1 mt-4">Encrypted Nodes</div>
                        <QuestNavBtn icon="fa-terminal" label="Node 1: Logs" isActive={activeTab === 'logs'} onClick={() => {setActiveTab('logs'); setUnlockInput('');}} locked={!unlockedNodes.logs} />
                        <QuestNavBtn icon="fa-database" label="Node 2: Ledger" isActive={activeTab === 'ledger'} onClick={() => {setActiveTab('ledger'); setUnlockInput('');}} locked={!unlockedNodes.ledger} />
                        <QuestNavBtn icon="fa-file-lines" label="Node 3: Protocol" isActive={activeTab === 'banking'} onClick={() => {setActiveTab('banking'); setUnlockInput('');}} locked={!unlockedNodes.banking} />
                        <div className="flex-grow"></div>
                        <QuestNavBtn icon="fa-shield-halved" label="Halt Transaction" isActive={activeTab === 'mystery'} onClick={() => {setActiveTab('mystery'); setUnlockInput('');}} className={`border mt-4 ${allNodesUnlocked ? 'text-red-400 border-red-500/50 bg-red-500/10' : 'opacity-50'}`} disabled={!allNodesUnlocked} />
                    </nav>

                    <main className="flex-grow h-full overflow-hidden relative z-10 flex flex-col min-w-0">
                        <div className="flex flex-wrap items-center gap-4 mb-4 glass-panel p-3 border border-slate-700 rounded-lg shrink-0">
                            <span className="text-xs text-slate-500 uppercase font-bold"><i className="fa-solid fa-chart-line text-amber-500"></i> Decryption Status:</span>
                            <div className="flex gap-2">
                                {['Logs', 'Ledger', 'Protocol'].map((l, i) => {
                                    const isActive = Object.values(unlockedNodes)[i];
                                    return <div key={l} className={`px-2 py-1 border text-[10px] rounded uppercase font-bold flex items-center gap-1 ${isActive ? 'bg-amber-950/40 border-amber-500/50 text-amber-400' : 'bg-slate-950 border-slate-800 text-slate-600'}`}><i className={`fa-solid ${isActive ? 'fa-lock-open' : 'fa-lock'}`}></i> N{i+1}</div>
                                })}
                            </div>
                        </div>

                        <div className="flex-grow overflow-y-auto custom-scrollbar relative">
                            {/* ORG CHART */}
                            {activeTab === 'org' && (
                                <div className="fade-in pb-12">
                                    <div className="flex justify-between items-end mb-6">
                                        <h2 className="text-2xl font-bold text-white">Corporate Directory</h2>
                                        <div className="relative w-64">
                                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                                            <input type="text" placeholder="Search (e.g. #012)" value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-full py-1.5 pl-9 pr-4 text-sm text-white focus:outline-none focus:border-amber-500" />
                                        </div>
                                    </div>
                                    {isHacked && <div className="mb-4 bg-red-950/40 border border-red-500/50 rounded-lg p-3 flex items-center gap-3"><i className="fa-solid fa-triangle-exclamation text-red-500 text-2xl"></i><div><h3 className="text-red-400 font-bold uppercase text-sm">Target Match Acquired</h3><p className="text-red-300/80 text-xs">Employee ID #004 located.</p></div></div>}
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                        {orgData.filter(m => m.name.toLowerCase().includes(search.toLowerCase()) || m.id.includes(search)).map(member => (
                                            <div key={member.id} className={`glass-panel border rounded-xl p-5 ${isHacked && member.id === '#004' ? 'border-red-500 bg-red-950/20' : 'border-slate-800'}`}>
                                                <div className="flex items-center gap-4 mb-3">
                                                    <img src={member.img} className="w-12 h-12 rounded-full object-cover border-2 border-slate-700" />
                                                    <div><h3 className="text-lg font-bold text-white">{member.name}</h3><p className="text-amber-400 text-xs">{member.role}</p></div>
                                                </div>
                                                <div className="flex justify-between text-xs border-b border-slate-800 pb-1 mb-1"><span className="text-slate-400">ID</span><span className="font-mono text-slate-200">{member.id}</span></div>
                                                <div className="flex justify-between text-xs border-b border-slate-800 pb-1 mb-2"><span className="text-slate-400">IP</span><span className="font-mono text-slate-200">{member.ip}</span></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* LOGS */}
                            {activeTab === 'logs' && (!unlockedNodes.logs ? renderUnlock("Node 1: Server Logs", "Enter the 4-digit Whistleblower Protocol PIN from Station 1.", "logs", ["0814"]) : (
                                <div className="fade-in">
                                    <h3 className="text-amber-400 font-bold uppercase mb-4"><i className="fa-solid fa-server"></i> Node 1: Security Logs</h3>
                                    <div className="bg-black/90 border border-slate-800 rounded-lg p-4 font-mono text-sm overflow-x-auto">
                                        <table className="w-full text-left min-w-[500px]"><thead className="text-slate-500 border-b border-slate-800"><tr><th className="pb-2">Time</th><th>Origin IP</th><th>Event</th><th>Status</th></tr></thead>
                                        <tbody className="text-slate-300">{logsData.map((l,i)=><tr key={i} className="hover:bg-slate-900"><td className="py-2 text-slate-500">{l.time}</td><td>{l.ip}</td><td>{l.event}</td><td className="text-xs">[{l.status}]</td></tr>)}</tbody></table>
                                    </div>
                                </div>
                            ))}

                            {/* LEDGER */}
                            {activeTab === 'ledger' && (!unlockedNodes.ledger ? renderUnlock("Node 2: Offshore Ledger", "Enter the exact missing capital amount flagged in Station 3.", "ledger", ["22000000"]) : (
                                <div className="fade-in">
                                    <h3 className="text-amber-400 font-bold uppercase mb-4"><i className="fa-solid fa-database"></i> Node 2: Offshore Ledger</h3>
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg overflow-x-auto">
                                        <table className="w-full text-left text-sm min-w-[600px]"><thead className="bg-slate-950 text-slate-400 border-b border-slate-800"><tr><th className="p-3">TXN ID</th><th className="p-3">Vendor</th><th className="p-3 text-right">Amount</th></tr></thead>
                                        <tbody className="divide-y divide-slate-800">{ledgerData.map((r,i)=><tr key={i} className="hover:bg-slate-800/50"><td className="p-3 font-mono text-slate-500">{r.id}</td><td className="p-3 text-slate-200">{r.vendor}</td><td className="p-3 text-right font-mono">{r.amount}</td></tr>)}</tbody></table>
                                    </div>
                                </div>
                            ))}

                            {/* PROTOCOL */}
                            {activeTab === 'banking' && (!unlockedNodes.banking ? renderUnlock("Node 3: Protocol", "Identify the high-risk offshore jurisdiction flagged in Station 2.", "banking", ["BRITISH VIRGIN ISLANDS", "BVI"]) : (
                                <div className="fade-in">
                                    <h3 className="text-amber-400 font-bold uppercase mb-4"><i className="fa-solid fa-file-lines"></i> Node 3: Banking Protocol</h3>
                                    <div className="bg-slate-100 text-slate-900 p-8 rounded-lg font-serif max-w-2xl">
                                        <h2 className="text-xl font-bold mb-4 font-sans border-b pb-2">Emergency Wire Interception</h2>
                                        <p className="mb-4">To initiate an immediate system-wide lockdown of moving capital, operators must utilize standard terminal syntax. The primary action code to void the transaction is:</p>
                                        <div className="text-2xl font-mono font-bold bg-slate-200 p-3 inline-block rounded border border-slate-300">VOID-WIRE</div>
                                    </div>
                                </div>
                            ))}

                            {/* FINAL MYSTERY */}
                            {activeTab === 'mystery' && (allNodesUnlocked ? (allPuzzlesSolved ? (
                                <div className="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center z-50 p-8 text-center fade-in">
                                    <i className="fa-solid fa-shield-halved text-7xl text-amber-500 mb-6"></i>
                                    <h1 className="text-5xl font-bold text-white tracking-widest mb-4 uppercase">Transaction <span className="text-amber-500">Halted</span></h1>
                                    <p className="text-slate-300 max-w-xl mb-6">Mission Accomplished. Victoria Vance has been identified. The $22M transfer to APEX Shell Logistics is frozen. Summit & Co. is protected.</p>
                                    <div className="bg-amber-500/10 text-amber-400 px-6 py-2 rounded-full text-xl font-bold tracking-widest shadow-[0_0_20px_rgba(245,158,11,0.2)]">+50 D.POINTS AWARDED</div>
                                </div>
                            ) : (
                                <div className="fade-in">
                                    <h2 className="text-2xl font-bold text-red-400 mb-2 uppercase"><i className="fa-solid fa-triangle-exclamation"></i> System Override Terminal</h2>
                                    <p className="text-slate-400 text-sm mb-6 max-w-2xl">Scrutinize the decrypted nodes. Identify the rogue identity, flag the illegal transaction, and execute the action code to halt the transfer.</p>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {[
                                            { k: 'puzzle1', t: "Identity Match", p: "Employee ID (e.g. #004)", e: ["#004", "004"] },
                                            { k: 'puzzle2', t: "Audit Flag", p: "Suspicious TXN ID", e: ["TXN-8824"] },
                                            { k: 'puzzle3', t: "Execute Action", p: "Halt Action Code", e: ["VOID-WIRE", "VOID WIRE"] }
                                        ].map(puz => {
                                            const isSolved = solvedPuzzles[puz.k];
                                            return (
                                                <div key={puz.k} className={`glass-panel border p-4 rounded-xl flex flex-col h-48 ${isSolved ? 'border-lime-500 bg-lime-950/20' : 'border-slate-700'}`}>
                                                    <h3 className="font-bold uppercase text-sm mb-2 text-white">{puz.t}</h3>
                                                    <p className="text-xs text-slate-400 mb-auto">{puz.p}</p>
                                                    {isSolved ? (
                                                        <div className="text-lime-500 font-bold text-center mt-2 tracking-widest border border-lime-900 py-1 bg-slate-950 rounded">VERIFIED</div>
                                                    ) : (
                                                        <input type="text" placeholder="ENTER" className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-center text-sm uppercase text-white focus:outline-none focus:border-red-400 mt-2" onKeyDown={(e) => {
                                                            if(e.key === 'Enter') {
                                                                const v = e.target.value.trim().toUpperCase();
                                                                if(puz.e.includes(v)) { setSolvedPuzzles(prev => ({...prev, [puz.k]: true})); }
                                                                else { e.target.style.borderColor = 'red'; setTimeout(()=>e.target.style.borderColor='', 1000); }
                                                            }
                                                        }} />
                                                    )}
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            )) : null)}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuestView />);
    </script>
</body>
</html>
