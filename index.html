<style>
/* Layout: role chooser -> (participant hub | staff sign-in -> role launcher) -> full-bleed module stage with a slim command bar. */
:root {
  --green: #86BC25;
  --green-dk: #568819;
  --teal: #004F59;
  --navy: #002776;
  --ink: #080b11;
  --panel: #121620;
  --panel-2: #181d29;
  --line: rgba(255,255,255,.08);
  --line-2: rgba(255,255,255,.14);
  --fg: #F3F5F7;
  --fg-2: #A9B1BC;
  --fg-3: #6B7480;
  --danger: #F43F5E;
  --warn: #F59E0B;
  --pioneer: #00A3E0;
  --driver: #86BC25;
  --integrator: #14B8A6;
  --guardian: #A855F7;
  --sans: Aptos, "Aptos Display", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bar-h: 52px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--fg); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font-family: var(--sans); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
html[lang^="zh"] body { line-height: 1.6; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
[hidden] { display: none !important; }
::selection { background: rgba(134,188,37,.35); color: #fff; }

/* ---------- Pages (chooser, sign-in, staff launcher, switches) ---------- */
.page {
  min-height: 100%;
  padding-top: max(20px, var(--safe-t)); padding-bottom: max(28px, var(--safe-b));
  padding-left: max(16px, var(--safe-l)); padding-right: max(16px, var(--safe-r));
  background:
    radial-gradient(900px 420px at 85% -10%, rgba(0,79,89,.55), transparent 60%),
    radial-gradient(700px 360px at -10% 0%, rgba(0,39,118,.35), transparent 60%),
    var(--ink);
}
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.wrap.narrow { max-width: 760px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 2px; font-weight: 800; font-size: 20px; letter-spacing: -.01em; text-decoration: none; }
.brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: inline-block; margin-left: 2px; transform: translateY(-1px); }
.brand small { font-weight: 600; font-size: 12px; color: var(--fg-3); margin-left: 10px; letter-spacing: .08em; text-transform: uppercase; }
.lang-seg { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); flex: none; }
.lang-seg button { all: unset; box-sizing: border-box; cursor: pointer; min-width: 34px; height: 30px; padding: 0 9px; border-radius: 999px; display: inline-grid; place-items: center; font-size: 13px; font-weight: 800; color: #9aa4b2; }
@media (max-width: 560px) { .bar-lang button { min-width: 28px; padding: 0 6px; height: 26px; font-size: 12px; } }
.lang-seg button:hover { color: #fff; }
.lang-seg button[aria-pressed="true"] { background: #86BC25; color: #071008; }
.lang-seg button:focus-visible { outline: 2px solid #62B5E5; outline-offset: 2px; }
.pill-btn {
  height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2);
  background: rgba(255,255,255,.04); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
}
.pill-btn:hover { border-color: rgba(134,188,37,.5); }
.hero { display: grid; gap: 10px; max-width: 760px; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--green); letter-spacing: .12em; text-transform: uppercase; }
html[lang^="zh"] .eyebrow { letter-spacing: .06em; }
.hero h1 { margin: 0; font-size: clamp(30px, 5.2vw, 52px); line-height: 1.08; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--green); }
.hero p { margin: 0; color: var(--fg-2); font-size: 16px; max-width: 62ch; }

.start { min-height: 100%; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto 1.2fr; gap: 0; }
.start .top { grid-row: 1; }
.start-h { grid-row: 3; margin: 0 0 clamp(20px, 4vh, 36px); font-size: clamp(36px, 7vw, 64px); line-height: 1.05; font-weight: 800; letter-spacing: -.025em; text-wrap: balance; }
.start-h em { font-style: normal; color: var(--green); }
.start-doors { grid-row: 4; align-self: start; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; max-width: 760px; }
.start-door { --c: var(--green); display: flex; align-items: center; gap: 16px; min-width: 0; padding: 20px 22px; border-radius: 20px; text-decoration: none;
  border: 1px solid var(--line-2); background: linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.01) 60%), var(--panel);
  transition: border-color .18s ease, transform .18s ease, background-color .18s ease; }
.start-door .ic { width: 48px; height: 48px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 20px; color: var(--c); background: rgba(255,255,255,.05); border: 1px solid var(--line-2); }
.start-door .tx { flex: 1; min-width: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.start-door .go { color: var(--c); font-size: 16px; transition: transform .18s ease; }
@media (hover: hover) { .start-door:hover { border-color: var(--c); } .start-door:hover .go { transform: translateX(4px); } }
.start-door:active { transform: scale(.99); }
.start-door:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
@media (max-width: 640px) { .start-doors { grid-template-columns: minmax(0, 1fr); } .start-door { padding: 18px; } }

.card { background: rgba(18,22,32,.86); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-width: 0; }

/* sign-in */
.auth { max-width: 420px; width: 100%; margin: 0 auto; display: grid; gap: 18px; }
.auth h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
.auth p.sub { margin: 4px 0 0; color: var(--fg-2); font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 700; color: var(--fg-2); }
.input {
  height: 46px; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(0,0,0,.45); padding: 0 14px;
  font-size: 16px; outline: none; width: 100%; -webkit-appearance: none; appearance: none;
}
.input:focus { border-color: var(--green); }
.pw { position: relative; }
.pw .input { padding-right: 46px; }
.pw button { position: absolute; right: 4px; top: 4px; width: 38px; height: 38px; border: 0; background: transparent; color: var(--fg-3); border-radius: 10px; }
.primary {
  height: 48px; border-radius: 12px; border: 0; background: var(--green); color: #0b0f06; font-weight: 800; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
}
.primary:disabled { opacity: .55; cursor: progress; }
.msg { font-size: 13px; padding: 10px 12px; border-radius: 10px; }
.msg.err { color: #FECDD3; background: rgba(244,63,94,.12); border: 1px solid rgba(244,63,94,.35); }
.msg.ok { color: #D9F99D; background: rgba(134,188,37,.12); border: 1px solid rgba(134,188,37,.35); }
.roles { display: grid; gap: 8px; }
.role-row { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; color: var(--fg-2); }
.role-row i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.role-row b { display: block; color: var(--fg); font-size: 14px; }
.back { color: var(--fg-2); text-decoration: none; font-size: 13px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
.back:hover { color: var(--fg); }

/* staff launcher */
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; border: 1px solid; letter-spacing: .04em; }
.badge.super { color: var(--green); border-color: rgba(134,188,37,.45); background: rgba(134,188,37,.12); }
.badge.host { color: #FCD34D; border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.12); }
.who .email { color: var(--fg-2); font-size: 13px; overflow-wrap: anywhere; }
.group { display: grid; gap: 12px; }
.group-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.group-h h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.group-h .chip { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.group-h p { margin: 0; color: var(--fg-3); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.tile {
  position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; align-items: start;
  text-align: left; text-decoration: none; color: inherit; padding: 14px; border-radius: 16px; border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)), var(--panel);
  transition: border-color .18s ease, transform .18s ease; min-width: 0;
}
@media (hover: hover) { .tile:hover { border-color: var(--c); transform: translateY(-2px); } }
.tile:active { transform: scale(.985); }
.tile .ic { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; color: var(--c); background: rgba(255,255,255,.04); border: 1px solid var(--line-2); }
.tile .t { font-weight: 800; font-size: 15px; line-height: 1.3; min-width: 0; }
.tile .t small { display: block; font-weight: 600; font-size: 11.5px; color: var(--fg-3); letter-spacing: .02em; }
.tile .d { grid-column: 2; color: var(--fg-2); font-size: 13px; line-height: 1.45; }
.tile .r { grid-column: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.tile .route { font-family: var(--mono); font-size: 11px; color: var(--fg-3); }
.copy { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg-3); display: grid; place-items: center; font-size: 12px; }
.copy:hover { color: var(--fg); border-color: var(--line-2); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; color: var(--fg-3); font-size: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.foot a { color: var(--fg-2); text-decoration: none; }
.foot a:hover { color: var(--green); }

/* participant switches */
.sw-list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--panel); }
.sw-sec { padding: 10px 16px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); background: rgba(255,255,255,.02); border-bottom: 1px solid var(--line); }
html[lang^="zh"] .sw-sec { letter-spacing: .04em; }
.sw { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sw:last-child { border-bottom: 0; }
.sw .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: var(--c, var(--green)); background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.sw .tx b { display: block; font-size: 15px; }
.sw .tx span { display: block; font-size: 12.5px; color: var(--fg-3); }
.toggle { position: relative; width: 52px; height: 30px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255,255,255,.08); transition: background-color .18s ease, border-color .18s ease; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #C9CFD6; transition: transform .18s ease, background-color .18s ease; }
.toggle[aria-checked="true"] { background: var(--green); border-color: var(--green); }
.toggle[aria-checked="true"]::after { transform: translateX(22px); background: #0b0f06; }
.toggle:disabled { opacity: .5; cursor: progress; }
.sw-state { font-family: var(--mono); font-size: 11px; font-weight: 700; margin-right: 10px; color: var(--fg-3); }
.sw-right { display: flex; align-items: center; }
.save-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--fg-2); }
.note { font-size: 13px; color: var(--fg-3); }
.lk-form { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
.lk-row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.lk-form .primary { width: auto; padding: 0 20px; justify-self: start; }
.lk-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.lk-item:last-child { border-bottom: 0; }
.lk-item.off .lk-main { opacity: .5; }
.lk-main { min-width: 0; }
.lk-main b { display: block; font-size: 15px; overflow-wrap: anywhere; }
.lk-main small { display: block; font-size: 12.5px; color: var(--fg-3); }
.lk-main a { display: block; font-family: var(--mono); font-size: 12px; color: #7DD3FC; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lk-main a:hover { text-decoration: underline; }
.lk-meta { font-size: 11.5px; color: var(--fg-3); font-family: var(--mono); }
.lk-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.mini-btn { height: 32px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line-2); background: rgba(255,255,255,.04); font-size: 12px; font-weight: 700; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.mini-btn:hover { color: var(--fg); border-color: rgba(255,255,255,.28); }
.mini-btn.danger { color: #FDA4AF; }
.mini-btn.danger.armed { background: rgba(244,63,94,.18); border-color: rgba(244,63,94,.6); color: #FFE4E6; }
.mini-btn:disabled { opacity: .5; cursor: progress; }
.empty { padding: 22px 16px; color: var(--fg-3); font-size: 13.5px; text-align: center; }
@media (max-width: 560px) { .lk-row2 { grid-template-columns: minmax(0, 1fr); } .lk-item { grid-template-columns: minmax(0, 1fr); } .lk-acts { justify-content: flex-start; } }

/* ---------- Stage ---------- */
.stage { position: fixed; inset: 0; display: flex; flex-direction: column; background: #000; }
.bar {
  flex: none; display: flex; align-items: center; gap: 8px;
  height: calc(var(--bar-h) + var(--safe-t)); padding-top: var(--safe-t);
  padding-left: max(10px, var(--safe-l)); padding-right: max(10px, var(--safe-r));
  background: rgba(8,11,17,.97); border-bottom: 1px solid var(--line);
}
.bar .home-btn { height: 36px; padding: 0 12px 0 10px; border-radius: 11px; border: 1px solid var(--line-2); background: rgba(255,255,255,.05); display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.bar .home-btn i { color: var(--green); }
.bar .title { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.bar .title .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--c); background: rgba(255,255,255,.05); font-size: 13px; flex: none; }
.bar .title .tx { min-width: 0; line-height: 1.15; }
.bar .title b { display: block; font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title small { display: block; font-size: 11px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 36px; height: 36px; flex: none; border-radius: 11px; border: 1px solid var(--line); background: rgba(255,255,255,.03); display: grid; place-items: center; color: var(--fg-2); font-size: 13px; }
.icon-btn:hover { color: var(--fg); border-color: var(--line-2); }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: rgba(255,255,255,.05); border: 1px solid var(--line); flex: none; }
.seg button { height: 28px; min-width: 38px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; font-family: var(--mono); font-weight: 700; font-size: 12px; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--green); color: #0b0f06; }
.frames { position: relative; flex: 1; min-height: 0; background: var(--ink); }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--ink); visibility: hidden; }
.frames iframe.on { visibility: visible; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--fg-3); font-size: 13px; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--green); animation: spin .8s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.stage.bare .bar { display: none; }
.restore {
  position: fixed; z-index: 5; top: calc(10px + var(--safe-t)); left: calc(10px + var(--safe-l));
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(8,11,17,.72);
  color: var(--fg-2); display: grid; place-items: center; font-size: 12px; opacity: .55; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.restore:hover { opacity: 1; }
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%); z-index: 20; background: var(--panel-2); border: 1px solid var(--line-2); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); }

@media (max-width: 760px) {
  .bar .title small { display: none; }
  .bar .home-btn span { display: none; }
  .bar .home-btn { padding: 0 11px; }
  .hide-sm { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>
<script>(function () {
  // One language setting for the whole site: 'en', 'zh-Hans' or 'zh-Hant' (Hong Kong).
  // First visit follows the browser; a choice made anywhere is remembered and passed to every page.
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function fromBrowser() {
    var list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || navigator.userLanguage || 'en']);
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i] || '').toLowerCase();
      if (l.indexOf('zh') === 0) return /hant|-tw|-hk|-mo/.test(l) ? 'zh-Hant' : 'zh-Hans';
      if (l.indexOf('en') === 0) return 'en';
    }
    return 'en';
  }
  var saved = store('dl_lang');

    var email = $('loginEmail').value.trim().toLowerCase(), pw = $('loginPw').value;
    var msg = $('loginMsg'), btn = $('loginBtn');
    msg.hidden = true;
    if (!email || !pw) { msg.textContent = t('errEmpty'); msg.hidden = false; return; }
    if (!sb) { msg.textContent = t('errLib'); msg.hidden = false; return; }
    btn.disabled = true; btn.querySelector('span').textContent = t('signingIn');
    sb.auth.signInWithPassword({ email: email, password: pw }).then(function (res) {
      btn.disabled = false; btn.querySelector('span').textContent = t('signIn');
      if (res.error || !res.data || !res.data.session) {
        var m = String(res.error && (res.error.message || res.error.name) || '');
        msg.textContent = /fetch|network|Failed/i.test(m) && !/Invalid/i.test(m) ? t('errNet') : t('errCreds');
        msg.hidden = false; return;
      }
      var fresh = res.data.session;
      btn.disabled = true;
      return fetchRole(fresh).then(function (role) {
        btn.disabled = false;
        if (!role) { setRole(null); msg.textContent = t('errNoRole'); msg.hidden = false; sb.auth.signOut(); return; }
        session = fresh; $('loginPw').value = '';
        dropAllFrames();
        var next = pendingNext; pendingNext = null;
        navigate(next && (canOpen(next) || next === 'visibility' || next === 'links') ? next : 'staff');
      }, function () { btn.disabled = false; setRole(null); msg.textContent = t('errNet'); msg.hidden = false; sb.auth.signOut(); });
    }, function () { btn.disabled = false; btn.querySelector('span').textContent = t('signIn'); msg.textContent = t('errNet'); msg.hidden = false; });
  });
  $('signOutBtn').addEventListener('click', function () {
    var done = function () { session = null; setRole(null); dropAllFrames(); navigate('start'); };
    if (sb) sb.auth.signOut().then(done, done); else done();
  });
  $('homeBtn').addEventListener('click', function () { navigate(staffRole() ? 'staff' : 'start'); });
  $('reloadBtn').addEventListener('click', function () {
    var id = ALIAS[route] || route === 'fastpass' ? 'fastpass' + cohort() : route;
    var f = frames[id]; if (!f) return;
    try { f.contentWindow.location.reload(); } catch (e) { if (SRCDOC) f.srcdoc = source(id); else f.src = moduleUrl(id); }
  });
  $('newTabBtn').addEventListener('click', function () { window.open(window.DL.link(ALIAS[route] ? 'fastpass' + cohort() : route), '_blank', 'noopener'); });
  $('focusBtn').addEventListener('click', function () { focus = true; store('dl_suite_focus', '1'); syncBar(); });
  $('restoreBtn').addEventListener('click', function () { focus = false; store('dl_suite_focus', '0'); syncBar(); });
  $('cohortSeg').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button[data-c]') : null; if (!b) return;
    store('dl_suite_cohort', b.getAttribute('data-c'));
    navigate('fastpass' + b.getAttribute('data-c'));
  });

  // ---------- language changes ----------
  // Leaving Traditional: reload (converted text can't be turned back). Otherwise re-render the shell and
  // rebuild the other open pages so they start in the new language; the page that switched keeps itself.
  if (window.DLLang) DLLang.on(function (l, prev, src) {
    if (prev === 'zh-Hant') { location.reload(); return; }
    lang = l === 'en' ? 'en' : 'zh';
    if (l === 'zh-Hant' && shellHant) shellHant.start();
    Object.keys(frames).forEach(function (id) { var f = frames[id]; if (!src || !f || f.contentWindow !== src) dropFrame(id); });
    apply();
  }, window);

  // Website version: fetch the portal page in the background once the opening page is idle.
  function prefetch(ids) {
    var go = function () { ids.forEach(function (id) { var u = splitUrl(id); if (!u) return; var l = document.createElement('link'); l.rel = 'prefetch'; l.href = u; document.head.appendChild(l); }); };
    if (window.requestIdleCallback) requestIdleCallback(go, { timeout: 4000 }); else setTimeout(go, 2500);
  }

  // ---------- boot ----------
  function boot() {
    if (route === 'start' || !route) prefetch(['hub']);
    if (window.DLHantDOM && window.DLHant) { shellHant = DLHantDOM(DLHant.convert); if (hantOn()) shellHant.start(); }
    // A stored session for an account that isn't on the staff lists counts as signed out.
    if (session && !staffRole()) { session = null; try { sb.auth.signOut(); } catch (e) {} }
    apply();
    refreshStatus();
    setInterval(function () { if (!document.hidden) refreshStatus(); }, 15000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - pulse.at > 8000) refreshStatus(); });
    if (sb) {
      try {
        sb.channel('dl-suite-vis').on('postgres_changes', { event: '*', schema: 'public', table: 'portal_visibility' }, function (p) {
          if (p && p.new && p.new.settings) setVis(p.new.settings, p.new.updated_at);
        }).subscribe();
        sb.channel('dl-suite-links').on('postgres_changes', { event: '*', schema: 'public', table: 'portal_links' }, function () {
          loadLinks(); if (route === 'links') loadAllLinks();
        }).subscribe();
      } catch (e) {}
      sb.auth.onAuthStateChange(function (evt, s) {
        var had = !!session; session = s && roleOf(s.user && s.user.email) ? s : null;
        if (had && !session) { dropAllFrames(); if (route !== 'start' && route !== 'hub') navigate('start'); }
        else if (route === 'start') renderStart();
      });
    }
  }
  if (sb) {
    sb.auth.getSession().then(function (res) {
      session = res && res.data && res.data.session || null;
      if (!session) { setRole(null); boot(); return; }
      // Re-check the stored session with the database; offline, the remembered answer for this email stands.
      fetchRole(session).then(function () { boot(); }, function () { boot(); });
    }, function () { boot(); });
  } else boot();
})();
</script>
</body>
</html>
