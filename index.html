            const [snake, setSnake] = useState([[10, 10]]);

            const [gameOver, setGameOver] = useState(false);

                if (gameOver) return;
                const moveSnake = () => {
                    setSnake(prev => {
                        const head = prev[0];
                        const newHead = [head[0] + dir[0], head[1] + dir[1]];
                        
                        if (newHead[0] < 0 || newHead[0] >= 20 || newHead[1] < 0 || newHead[1] >= 20) {
                            setGameOver(true); return prev;
                        }
                        if (prev.some(segment => segment[0] === newHead[0] && segment[1] === newHead[1])) {
                            setGameOver(true); return prev;
                        }

                        const newSnake = [newHead, ...prev];
                        if (newHead[0] === food[0] && newHead[1] === food[1]) {
                            setScore(s => s + 10);
                            setFood([Math.floor(Math.random() * 20), Math.floor(Math.random() * 20)]);
                        } else {
                            newSnake.pop();
                        }
                        return newSnake;
                    });
                };
                const interval = setInterval(moveSnake, 120);
                return () => clearInterval(interval);
            }, [dir, food, gameOver]);

                const handleKeyDown = (e) => {
                    switch (e.key) {

                        case 'ArrowDown': if (dir[1] !== -1) setDir([0, 1]); break;
                        case 'ArrowLeft': if (dir[0] !== 1) setDir([-1, 0]); break;
                        case 'ArrowRight': if (dir[0] !== -1) setDir([1, 0]); break;

                                        <ul className="list-disc pl-5 text-xs md:text-sm text-slate-400 space-y-2 mb-4 md:mb-6">
                                            <li><strong className="text-slate-200">{t.dbExport}</strong> {t.dbExportDesc}</li>
                                            <li><strong className="text-slate-200">{t.privEsc}</strong> {t.privEscDesc}</li>
                                            <li><strong className="text-slate-200">{t.custData}</strong> {t.custDataDesc}</li>
                                            <li><strong className="text-slate-200">{t.dataScrub}</strong> {t.dataScrubDesc}</li>
                                            <li><strong className="text-slate-200">{t.auditLogMod}</strong> {t.auditLogModDesc}</li>
                                        </ul>
                                    </div>

                                    <div className="glass-panel p-4 md:p-6 border border-slate-700 rounded-xl">
                                        <h3 className="text-base md:text-lg font-bold text-amber-400 border-b border-slate-800 pb-2 mb-4">{t.infraMap}</h3>
                                        <p className="text-xs md:text-sm text-slate-300 mb-4">{t.infraDesc}</p>
                                        <div className="overflow-x-auto custom-scrollbar">
                                            <table className="w-full text-left text-xs md:text-sm min-w-[500px]"><thead className="bg-slate-900 text-slate-400 border-b border-slate-800"><tr><th className="p-2">{t.employee}</th><th className="p-2">{t.system}</th><th className="p-2">{t.accessLevel}</th></tr></thead>
                                            <tbody className="divide-y divide-slate-800 text-slate-300">
                                                <tr><td className="p-2">Marcus Bergstrom (EMP004)</td><td className="p-2">FTV-PROD-01</td><td className="p-2">Administrator</td></tr>
                                                <tr><td className="p-2">Marcus Bergstrom (EMP004)</td><td className="p-2">Model Training DB</td><td className="p-2">Administrator</td></tr>
                                                <tr><td className="p-2">Marcus Bergstrom (EMP004)</td><td className="p-2">Customer Data Warehouse</td><td className="p-2">Administrator</td></tr>
                                                <tr><td className="p-2">Daniel Reyes (EMP002)</td><td className="p-2">FTV-PROD-01</td><td className="p-2">Standard User</td></tr>
                                                <tr><td className="p-2">Priya Castillo (EMP009)</td><td className="p-2">Model Training DB</td><td className="p-2">Standard User</td></tr>
                                                <tr><td className="p-2">Karim Castillo (EMP042)</td><td className="p-2">FTV-PROD-01</td><td className="p-2">Administrator</td></tr>
                                                <tr><td className="p-2">Elena Petrov (VP, Finance)</td><td className="p-2">Model Training DB</td><td className="p-2">Administrator</td></tr>
                                            </tbody></table>
                                        </div>
                                        <p className="text-[10px] md:text-xs text-slate-500 mt-4 border-t border-slate-800 pt-3"><i className="fa-solid fa-circle-exclamation text-amber-500"></i> {t.infraNote}</p>
                                    </div>
                                </div>
                            )}

                            {/* PROCUREMENT POLICY */}
                            {activeTab === 'vendor' && (
                                <div className="fade-in pb-12 flex flex-col gap-4 md:gap-6">
                                    <h2 className="text-xl md:text-2xl font-bold text-white mb-2"><i className="fa-solid fa-file-invoice-dollar text-amber-500"></i> {t.vendors}</h2>
                                    
                                    <div className="glass-panel p-4 md:p-6 border border-slate-700 rounded-xl">
                                        <h3 className="text-base md:text-lg font-bold text-amber-400 border-b border-slate-800 pb-2 mb-4">{t.compWatchlist}</h3>
                                        <p className="text-xs md:text-sm text-slate-300 mb-4">{t.compDesc}</p>
                                        <div className="flex flex-wrap gap-2">
                                            {['British Virgin Islands', 'Cayman Islands', 'Cyprus', 'Isle of Man', 'Malta', 'Panama', 'United Arab Emirates'].map(j => (
                                                <span key={j} className="bg-red-950/40 border border-red-500/50 text-red-400 text-[10px] md:text-xs px-3 py-1 rounded-full font-bold">{j}</span>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="glass-panel p-4 md:p-6 border border-slate-700 rounded-xl">
                                        <div className="flex flex-col md:flex-row md:justify-between items-start md:items-end border-b border-slate-800 pb-2 mb-4 gap-3">
                                            <h3 className="text-base md:text-lg font-bold text-amber-400">{t.poTitle}</h3>
                                            <input type="text" placeholder={t.searchPO} value={poSearch} onChange={(e) => setPoSearch(e.target.value)} className="bg-slate-900 border border-slate-700 rounded py-1 px-3 text-sm text-white focus:outline-none focus:border-amber-500 w-full md:w-48" />
                                        </div>
                                        <p className="text-[10px] md:text-sm text-slate-400 mb-4 bg-slate-900/50 p-3 rounded border border-slate-800"><i className="fa-solid fa-circle-info text-amber-500"></i> {t.poDesc}</p>
                                        <div className="overflow-x-auto custom-scrollbar">
                                            <div className="max-h-64 overflow-y-auto custom-scrollbar">
                                                <table className="w-full text-left text-xs md:text-sm min-w-[600px]"><thead className="bg-slate-900 text-slate-400 sticky top-0 shadow-lg"><tr><th className="p-2">{t.poNum}</th><th className="p-2">{t.vendorName}</th><th className="p-2">{t.project}</th><th className="p-2">{t.approver}</th></tr></thead>
                                                <tbody className="divide-y divide-slate-800 text-slate-300">
                                                    {parsedPO.filter(p => p.vendor.toLowerCase().includes(poSearch.toLowerCase()) || p.po.toLowerCase().includes(poSearch.toLowerCase())).map(p => (
                                                        <tr key={p.po} className="hover:bg-slate-800/50"><td className="p-2 font-mono text-slate-400">{p.po}</td><td className="p-2 text-slate-200">{p.vendor}</td><td className="p-2 text-[10px] md:text-xs">{p.project}</td><td className="p-2 text-[10px] md:text-xs">{p.approver}</td></tr>
                                                    ))}
                                                </tbody></table>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="glass-panel p-4 md:p-6 border border-slate-700 rounded-xl">
                                        <div className="flex flex-col md:flex-row md:justify-between items-start md:items-end border-b border-slate-800 pb-2 mb-4 gap-3">
                                            <h3 className="text-base md:text-lg font-bold text-amber-400">{t.vmTitle}</h3>
                                            <input type="text" placeholder={t.searchVendor} value={vendorSearch} onChange={(e) => setVendorSearch(e.target.value)} className="bg-slate-900 border border-slate-700 rounded py-1 px-3 text-sm text-white focus:outline-none focus:border-amber-500 w-full md:w-48" />
                                        </div>
                                        <div className="overflow-x-auto custom-scrollbar">
                                            <div className="max-h-64 overflow-y-auto custom-scrollbar">
                                                <table className="w-full text-left text-xs md:text-sm min-w-[500px]"><thead className="bg-slate-900 text-slate-400 sticky top-0 shadow-lg"><tr><th className="p-2">{t.id}</th><th className="p-2">{t.legalName}</th><th className="p-2">{t.country}</th><th className="p-2">{t.risk}</th></tr></thead>
                                                <tbody className="divide-y divide-slate-800 text-slate-300">
                                                    {parsedVM.filter(v => v.name.toLowerCase().includes(vendorSearch.toLowerCase()) || v.id.toLowerCase().includes(vendorSearch.toLowerCase())).map(v => (
                                                        <tr key={v.id} className="hover:bg-slate-800/50"><td className="p-2 font-mono text-slate-400">{v.id}</td><td className="p-2 text-slate-200">{v.name}</td><td className="p-2 text-[10px] md:text-xs">{v.country}</td><td className="p-2 text-[10px] md:text-xs font-bold text-slate-400">{v.risk}</td></tr>
                                                    ))}
                                                </tbody></table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ORG CHART */}
                            {activeTab === 'org' && (
                                <div className="fade-in pb-12">
                                    <div className="flex flex-col md:flex-row md:justify-between items-start md:items-end mb-6 gap-3">
                                        <h2 className="text-xl md:text-2xl font-bold text-white">{t.directory}</h2>
                                        <div className="relative w-full md:w-64">
                                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                                            <input type="text" placeholder={t.searchPlaceholderOrg} value={search} onChange={(e) => setSearch(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-full py-1.5 pl-9 pr-4 text-sm text-white focus:outline-none focus:border-amber-500" />
                                        </div>
                                    </div>
                                    {isHacked && <div className="mb-4 bg-red-950/40 border border-red-500/50 rounded-lg p-3 flex items-center gap-3"><i className="fa-solid fa-triangle-exclamation text-red-500 text-xl md:text-2xl"></i><div><h3 className="text-red-400 font-bold uppercase text-xs md:text-sm">{t.targetAcquired}</h3><p className="text-red-300/80 text-[10px] md:text-xs">{t.targetLocated}</p></div></div>}
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                        {orgData.filter(m => m.name.toLowerCase().includes(search.toLowerCase()) || m.id.toLowerCase().includes(search.toLowerCase())).map(member => (
                                            <div key={member.id} className="glass-panel border rounded-xl p-4 md:p-5 border-slate-800">
                                                <div className="flex items-center gap-4 mb-3">
                                                    <img src={member.img} className="w-10 h-10 md:w-12 md:h-12 rounded-full object-cover border-2 border-slate-700" />
                                                    <div><h3 className="text-base md:text-lg font-bold text-white">{member.name}</h3><p className="text-amber-400 text-[10px] md:text-xs">{member.role}</p></div>
                                                </div>
                                                <div className="flex justify-between text-[10px] md:text-xs border-b border-slate-800 pb-1 mb-1"><span className="text-slate-400">{t.id}</span><span className="font-mono text-slate-200">{member.id}</span></div>
                                                <div className="flex justify-between text-[10px] md:text-xs border-b border-slate-800 pb-1 mb-1"><span className="text-slate-400">{t.dept}</span><span className="text-slate-200">{member.dept}</span></div>
                                                <div className="flex justify-between text-[10px] md:text-xs border-b border-slate-800 pb-1 mb-1"><span className="text-slate-400">{t.ext}</span><span className="font-mono text-slate-200">{member.ext}</span></div>
                                                <div className="flex justify-between text-[10px] md:text-xs border-b border-slate-800 pb-1 mb-2"><span className="text-slate-400">{t.ip}</span><span className="font-mono text-slate-200">{member.ip}</span></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* LOGS */}
                            {activeTab === 'logs' && (!unlockedNodes.logs ? renderUnlock(t.n1Title, t.n1Hint, "logs", ["0814"]) : (
                                <div className="fade-in h-full flex flex-col pb-4">
                                    <h3 className="text-amber-400 font-bold uppercase mb-4 text-sm md:text-base"><i className="fa-solid fa-server"></i> {t.n1Title}</h3>
                                    <div className="bg-black/90 border border-slate-800 rounded-lg p-0 font-mono text-xs md:text-sm overflow-auto custom-scrollbar flex-grow">
                                        <table className="w-full text-left min-w-[500px]"><thead className="bg-slate-900 text-slate-400 sticky top-0 shadow-lg border-b border-slate-800"><tr><th className="p-3">{t.time}</th><th className="p-3">{t.user}</th><th className="p-3">{t.event}</th><th className="p-3">{t.status}</th><th className="p-3">{t.ticket}</th></tr></thead>
                                        <tbody className="divide-y divide-slate-800 text-slate-300">{parsedLogs.map((l,i)=><tr key={i} className="hover:bg-slate-800/50"><td className="p-3 text-slate-500">{l.time}</td><td className="p-3">{l.user}</td><td className="p-3">{l.event}</td><td className="p-3 text-[10px] md:text-xs text-slate-400">[{l.status}]</td><td className="p-3 text-slate-500 text-[10px] md:text-xs">{l.ticket}</td></tr>)}</tbody></table>
                                    </div>
                                </div>
                            ))}

                            {/* LEDGER */}
                            {activeTab === 'ledger' && (!unlockedNodes.ledger ? renderUnlock(t.n2Title, t.n2Hint, "ledger", ["22000000"]) : (
                                <div className="fade-in h-full flex flex-col pb-4">
                                    <h3 className="text-amber-400 font-bold uppercase mb-4 text-sm md:text-base"><i className="fa-solid fa-database"></i> {t.n2Title}</h3>
                                    <div className="bg-slate-900 border border-slate-800 rounded-lg overflow-auto custom-scrollbar flex-grow">
                                        <table className="w-full text-left text-xs md:text-sm min-w-[600px] md:min-w-[800px]">
                                            <thead className="bg-slate-950 text-slate-400 sticky top-0 shadow-lg border-b border-slate-800">
                                                <tr>
                                                    <th className="p-3">{t.time}</th>
                                                    <th className="p-3">{t.txnId}</th>
                                                    <th className="p-3">{t.vendorName}</th>
                                                    <th className="p-3">{t.approvedBy}</th>
                                                    <th className="p-3 text-right">{t.amount}</th>
                                                    <th className="p-3 text-right">{t.status}</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800">
                                                {parsedLedger.map((r,i) => (
                                                    <tr key={i} className="hover:bg-slate-800/50 transition-colors">
                                                        <td className="p-3 text-slate-500">{r.time}</td>
                                                        <td className="p-3 font-mono text-slate-500">{r.id}</td>
                                                        <td className="p-3 text-slate-200">{r.vendor}</td>
                                                        <td className="p-3 text-slate-400">{r.approved}</td>
                                                        <td className="p-3 text-right font-mono text-slate-300">{r.amount}</td>
                                                        <td className="p-3 text-right text-[10px] md:text-xs">
                                                            <span className="px-2 py-1 rounded tracking-wider bg-slate-800 text-slate-300">{r.status}</span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            ))}

                            {/* PROTOCOL */}
                            {activeTab === 'banking' && (!unlockedNodes.banking ? renderUnlock(t.n3Title, t.n3Hint, "banking", ["BRITISH VIRGIN ISLANDS", "BVI", "英属维尔京群岛", "英屬維爾京群島"]) : (
                                <div className="fade-in pb-12 flex flex-col gap-4 md:gap-6">
                                    <h2 className="text-xl md:text-2xl font-bold text-white mb-2"><i className="fa-solid fa-file-lines text-amber-500"></i> {t.n3Title}</h2>
                                    
                                    <div className="glass-panel p-4 md:p-6 border border-slate-700 rounded-xl">
                                        <p className="text-xs md:text-sm text-slate-300 mb-6">{t.emergencyDesc}</p>
                                        
                                        <div className="overflow-x-auto custom-scrollbar">
                                            <table className="w-full text-left text-xs md:text-sm min-w-[600px]">
                                                <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                                                    <tr>
                                                        <th className="p-2 md:p-3">{t.riskTier}</th>
                                                        <th className="p-2 md:p-3">{t.capThreshold}</th>
                                                        <th className="p-2 md:p-3">{t.jurisdiction}</th>
                                                        <th className="p-2 md:p-3">{t.anomalyFlag}</th>
                                                        <th className="p-2 md:p-3 text-right">{t.actionCode}</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800 text-slate-300">
                                                    {protocolData.map((row, i) => (
                                                        <tr key={i} className="hover:bg-slate-800/50">
                                                            <td className="p-2 md:p-3 font-bold text-slate-300">{row.tier}</td>
                                                            <td className="p-2 md:p-3">{row.cap}</td>
                                                            <td className="p-2 md:p-3">{row.jur}</td>
                                                            <td className="p-2 md:p-3">{row.anomaly}</td>
                                                            <td className="p-2 md:p-3 text-right">
                                                                <span className="font-mono bg-slate-950 border border-slate-700 text-slate-300 px-2 py-1 md:px-3 rounded text-[10px] md:text-xs">
                                                                    {row.code}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            ))}

                            {/* FINAL MYSTERY */}
                            {activeTab === 'mystery' && (allNodesUnlocked ? (allPuzzlesSolved ? (
                                <div className="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center z-50 p-6 md:p-8 text-center fade-in">
                                    <i className="fa-solid fa-shield-halved text-6xl md:text-7xl text-amber-500 mb-6"></i>
                                    <h1 className="text-3xl md:text-5xl font-bold text-white tracking-widest mb-4 uppercase">{t.haltTxn}</h1>
                                    <p className="text-sm md:text-base text-slate-300 max-w-xl mb-6">{t.missionAccomplished}</p>
                                    <div className="bg-amber-500/10 text-amber-400 px-4 md:px-6 py-2 rounded-full text-base md:text-xl font-bold tracking-widest shadow-[0_0_20px_rgba(245,158,11,0.2)]">{t.ptsAwarded}</div>
                                </div>
                            ) : (
                                <div className="fade-in">
                                    <h2 className="text-xl md:text-2xl font-bold text-red-400 mb-2 uppercase"><i className="fa-solid fa-triangle-exclamation"></i> {t.sysOverride}</h2>
                                    <p className="text-xs md:text-sm text-slate-400 mb-6 max-w-2xl">{t.sysOverrideDesc}</p>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {[
                                            { k: 'puzzle1', t: t.identityMatch, p: t.empIdHint, e: ["EMP004", "004"] },
                                            { k: 'puzzle2', t: t.auditFlag, p: t.suspiciousTxn, e: ["TXN-8824", "TXN8824"] },
                                            { k: 'puzzle3', t: t.executeAction, p: t.haltActionCode, e: ["VOID-WIRE", "VOID WIRE"] }
                                        ].map(puz => {
                                            const isSolved = solvedPuzzles[puz.k];
                                            return (
                                                <div key={puz.k} className={`glass-panel border p-4 rounded-xl flex flex-col h-40 md:h-48 ${isSolved ? 'border-lime-500 bg-lime-950/20' : 'border-slate-700'}`}>
                                                    <h3 className="font-bold uppercase text-xs md:text-sm mb-2 text-white">{puz.t}</h3>
                                                    <p className="text-[10px] md:text-xs text-slate-400 mb-auto">{puz.p}</p>
                                                    {isSolved ? (
                                                        <div className="text-lime-500 font-bold text-center mt-2 tracking-widest border border-lime-900 py-1 bg-slate-950 rounded text-xs md:text-sm">{t.verified}</div>
                                                    ) : (
                                                        <input type="text" placeholder={t.enter} className="w-full bg-slate-900 border border-slate-600 rounded p-2 text-center text-xs md:text-sm uppercase text-white focus:outline-none focus:border-red-400 mt-2" onKeyDown={(e) => {
                                                            if(e.key === 'Enter') {
                                                                const v = e.target.value.trim().toUpperCase();
                                                                if(puz.e.includes(v)) { setSolvedPuzzles(prev => ({...prev, [puz.k]: true})); }
                                                                else { e.target.style.borderColor = 'red'; setTimeout(()=>e.target.style.borderColor='', 1000); }
                                                            }
                                                        }} />
                                                    )}
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            )) : null)}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuestView />);
    </script>
</body>
</html>
