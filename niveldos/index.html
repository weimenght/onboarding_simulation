<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Sunrise - Node 1 Clue</title>
    
    <!-- Core Styling & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    
    <!-- React, ReactDOM & Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <script>
        if (window.tailwind) {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Urbanist', 'sans-serif'],
                            mono: ['JetBrains Mono', 'monospace'],
                            typewriter: ['Special Elite', 'cursive'],
                        },
                        colors: {
                            deloitte: {
                                green: '#86BC25',
                                dark: '#000000',
                                panel: '#0F172A',
                                border: '#1E293B'
                            }
                        }
                    }
                }
            };
        }
    </script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #020617;
            color: #F8FAFC;
            font-family: 'Urbanist', sans-serif;
            overflow-x: hidden;
        }
        
        .cyber-grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .cyber-glow {
            position: fixed;
            width: 800px;
            height: 800px;
            max-width: 100vw;
            background: radial-gradient(circle, rgba(134, 188, 37, 0.08) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-[100dvh] p-4">
    <div class="cyber-grid"></div>
    <div class="cyber-glow"></div>
    <div id="root" class="w-full max-w-lg"></div>

    <script type="text/babel">
        const { useState } = React;

        const dict = {
            en: {
                projectTitle: "Project Sunrise",
                station: "STATION_01",
                instruction: "Here are the instructions for the first node.",
                nodeTitle: "Node 1: Server Logs",
                secretTitle: "Key",
                secretText: "Enter the 4-digit Whistleblower Protocol PIN",
                taskTitle: "Task",
                taskText: "Find the name of the employee who committed the violation",
                awaiting: "Awaiting input at main terminal..."
            },
            zh: {
                projectTitle: "旭日计划",
                station: "站点_01",
                instruction: "这里是第一关的指示",
                nodeTitle: "节点 1：服务器日志",
                secretTitle: "密码",
                secretText: "输入 4 位举报人协议 PIN 码",
                taskTitle: "任务",
                taskText: "找出违规操作的员工的姓名",
                awaiting: "等待主终端输入..."
            }
        };

        function ClueApp() {
            const [lang, setLang] = useState('zh');
            const t = dict[lang];

            return (
                <div className="w-full glass-panel border border-slate-700 rounded-xl shadow-2xl p-6 md:p-10 fade-in relative overflow-hidden">
                    {/* Top accent line */}
                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-500"></div>
                    
                    {/* Header */}
                    <div className="flex items-center justify-between mb-8 border-b border-slate-800 pb-4">
                        <h1 className="text-lg md:text-xl font-bold text-amber-400 tracking-wider flex items-center gap-2 uppercase">
                            <i className="fa-solid fa-fingerprint text-2xl"></i> {t.projectTitle}
                        </h1>
                        <div className="flex items-center gap-3">
                            <span className="text-[10px] md:text-xs font-mono text-slate-500 bg-slate-900 px-2 py-1 rounded border border-slate-800">{t.station}</span>
                            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="bg-slate-800 hover:bg-slate-700 text-white text-[10px] px-2 py-1 rounded border border-slate-600 font-bold transition-colors cursor-pointer">
                                {lang === 'en' ? '中文' : 'EN'}
                            </button>
                        </div>
                    </div>

                    {/* Main Icon & Title */}
                    <div className="text-center mb-8">
                        <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-900 border border-slate-700 mb-4 shadow-inner">
                            <i className="fa-solid fa-terminal text-2xl text-slate-400"></i>
                        </div>
                        <h2 className="text-xl md:text-2xl font-bold text-white mb-2 tracking-widest">{t.instruction}</h2>
                        <p className="text-slate-400 text-xs md:text-sm uppercase tracking-widest">{t.nodeTitle}</p>
                    </div>

                    <div className="space-y-4">
                        {/* Secret Card */}
                        <div className="bg-slate-900/80 border border-amber-500/30 rounded-lg p-4 md:p-5 border-l-4 border-l-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.1)] transition-all hover:bg-slate-800">
                            <h3 className="text-amber-500 font-bold text-[10px] md:text-xs uppercase tracking-widest mb-2 flex items-center gap-2">
                                <i className="fa-solid fa-key"></i> {t.secretTitle}
                            </h3>
                            <p className="text-slate-200 font-mono text-xs md:text-sm leading-relaxed">
                                {t.secretText}
                            </p>
                        </div>

                        {/* Task Card */}
                        <div className="bg-red-950/20 border border-red-500/30 rounded-lg p-4 md:p-5 border-l-4 border-l-red-500 shadow-[0_0_15px_rgba(239,68,68,0.1)] transition-all hover:bg-red-950/40">
                            <h3 className="text-red-400 font-bold text-[10px] md:text-xs uppercase tracking-widest mb-2 flex items-center gap-2">
                                <i className="fa-solid fa-crosshairs"></i> {t.taskTitle}
                            </h3>
                            <p className="text-slate-200 text-sm md:text-base font-medium leading-relaxed">
                                {t.taskText}
                            </p>
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="mt-10 text-center border-t border-slate-800 pt-4">
                        <p className="text-[10px] text-slate-500 font-mono uppercase tracking-widest flex items-center justify-center gap-2">
                            <i className="fa-solid fa-circle-notch fa-spin text-amber-500"></i> {t.awaiting}
                        </p>
                    </div>
                </div>
            );
        }

        const rootContainer = document.getElementById('root');
        const root = ReactDOM.createRoot(rootContainer);
        root.render(<ClueApp />);
    </script>
</body>
</html>
