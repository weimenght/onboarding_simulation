<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05080F">
    <title>PROJECT SUNRISE // LIVE LEADERBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        if (window.tailwind) tailwind.config = { theme: { extend: {
            fontFamily: {
                sans: ['Space Grotesk', 'system-ui', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', 'sans-serif'],
                mono: ['JetBrains Mono', 'ui-monospace', 'Menlo', 'PingFang SC', 'Microsoft YaHei', 'monospace']
            },
            colors: { brand: '#86BC25' }
        } } };
    </script>
    <style>
        html, body { margin: 0; min-height: 100%; background: #05080F; color: #F1F5F9; font-family: 'Space Grotesk', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-image: radial-gradient(rgba(134,188,37,.08) 1px, transparent 1px); background-size: 28px 28px; }
        .panel { background: rgba(11,17,30,.92); border: 1px solid rgba(148,163,184,.14); }
        .caps { text-transform: uppercase; letter-spacing: .1em; }
        html[lang^="zh"] .caps { letter-spacing: .03em; }
        .flash { animation: flash 1.6s ease-out; }
        @keyframes flash { 0% { background: rgba(134,188,37,.35); } 100% { background: transparent; } }
        .slide-in { animation: slideIn .45s cubic-bezier(.16,1,.3,1) both; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
        .wrap { padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
        @media (prefers-reduced-motion: reduce) { .flash, .slide-in { animation: none; } }
    </style>
</head>
<body>
<div class="wrap mx-auto flex min-h-screen max-w-[1800px] flex-col gap-4 lg:h-screen">
    <header class="panel flex flex-wrap items-center justify-between gap-4 rounded-2xl px-5 py-4">
        <div class="flex items-center gap-3">
            <div class="flex h-11 w-11 items-center justify-center rounded-xl border border-brand/50 bg-brand/15 text-brand"><i class="fa-solid fa-trophy text-lg"></i></div>
            <div>
                <h1 class="caps text-lg font-bold leading-tight text-white md:text-2xl" data-i18n="title"></h1>
                <p class="font-mono text-xs text-slate-400"><span data-i18n="session"></span>: <span id="session">—</span> · <span id="status" class="text-slate-500"></span></p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="clockBox" class="flex items-center gap-3 rounded-xl border border-slate-800 bg-slate-950 px-4 py-2">
                <span id="clockLabel" class="caps font-mono text-xs text-slate-400"></span>
                <span id="clock" class="font-mono text-3xl font-bold tabular-nums text-brand md:text-4xl">--:--</span>
            </div>
            <button id="langBtn" class="h-11 rounded-xl border border-slate-700 bg-slate-900 px-4 font-mono text-sm font-bold">中文</button>
            <button id="fsBtn" class="hidden h-11 w-11 rounded-xl border border-slate-700 bg-slate-900 md:block" aria-label="Fullscreen"><i class="fa-solid fa-expand"></i></button>
        </div>
    </header>

    <div class="grid min-h-0 flex-1 grid-cols-1 gap-4 lg:grid-cols-3">
        <section class="panel flex min-h-0 flex-col rounded-2xl p-4 lg:col-span-2">
            <div class="mb-3 grid grid-cols-[3rem_1fr_9rem_5rem_6rem] items-center gap-3 px-3 font-mono text-[11px] text-slate-500 md:grid-cols-[3.5rem_1fr_12rem_7rem_7rem] md:text-xs">
                <span class="caps">#</span>
                <span class="caps" data-i18n="colGroup"></span>
                <span class="caps" data-i18n="colProgress"></span>
                <span class="caps text-right" data-i18n="colSecrets"></span>
                <span class="caps text-right" data-i18n="colTime"></span>
            </div>
            <ol id="board" class="min-h-0 flex-1 space-y-2 overflow-y-auto"></ol>
            <p id="empty" class="hidden py-16 text-center text-slate-500" data-i18n="empty"></p>
        </section>

        <section class="panel flex min-h-0 flex-col rounded-2xl p-4">
            <h2 class="caps mb-3 flex items-center gap-2 font-mono text-sm font-bold text-brand"><span class="h-2 w-2 animate-pulse rounded-full bg-red-500"></span><span data-i18n="feed"></span></h2>
            <ul id="feed" class="min-h-0 flex-1 space-y-2 overflow-y-auto"></ul>
        </section>
    </div>
</div>

<script>
(() => {
    const SECRET_TOTAL = 7;
    const I18N = {
        en: {
            title: 'Project Sunrise · Live Leaderboard', session: 'Session', colGroup: 'Group', colProgress: 'Progress',
            colSecrets: 'Secrets', colTime: 'Time', feed: 'Live Feed', empty: 'Waiting for the first team to join…',
            clockSettles: 'Wire settles in', clockOvertime: 'Settled · overtime', clockNow: 'Local time',
            connected: 'Live', polling: 'Updating every 10s', noSupabase: 'Supabase not configured in info.txt', loadFail: 'Could not load info.txt',
            halted: 'HALTED', join: (g, r) => `${g} joined${r ? ' · ' + r : ''}`,
            node: (g, n) => `${g} just decrypted Node ${n}`, puzzle: (g, n) => `${g} cracked override ${n}/3`,
            secret: (g, c) => `${g} found a secret (${c}/${SECRET_TOTAL})`, finish: (g, tm) => `${g} HALTED THE WIRE in ${tm}!`,
            hint: (g, c) => `${g} bought a hint (+${c})`, strike: (g, c) => `${g} entered a wrong override (+${c})`, penalty: (c) => `incl. +${c}`,
            roles: { it: 'Forensic IT', finance: 'Finance', compliance: 'Compliance' }, ago: (s) => s < 60 ? `${s}s ago` : `${Math.floor(s / 60)}m ago`
        },
        zh: {
            title: '日出计划 · 实时排行榜', session: '场次', colGroup: '小组', colProgress: '进度',
            colSecrets: '彩蛋', colTime: '用时', feed: '实时动态', empty: '等待第一支队伍加入…',
            clockSettles: '汇款到账倒计时', clockOvertime: '已到账 · 超时', clockNow: '当前时间',
            connected: '实时', polling: '每 10 秒更新', noSupabase: 'info.txt 中未配置 Supabase', loadFail: '无法读取 info.txt',
            halted: '已拦截', join: (g, r) => `${g} 已加入${r ? ' · ' + r : ''}`,
            node: (g, n) => `${g} 刚刚解密了节点 ${n}`, puzzle: (g, n) => `${g} 破解了覆盖代码 ${n}/3`,
            secret: (g, c) => `${g} 发现了一个彩蛋（${c}/${SECRET_TOTAL}）`, finish: (g, tm) => `${g} 拦截成功！用时 ${tm}`,
            hint: (g, c) => `${g} 使用了提示（+${c}）`, strike: (g, c) => `${g} 输错了覆盖代码（+${c}）`, penalty: (c) => `含 +${c}`,
            roles: { it: '取证 IT', finance: '财务', compliance: '合规' }, ago: (s) => s < 60 ? `${s} 秒前` : `${Math.floor(s / 60)} 分钟前`
        }
    };
    const NODE_NUM = { logs: 1, ledger: 2, banking: 3 };
    const PUZZLE_NUM = { puzzle1: 1, puzzle2: 2, puzzle3: 3 };

    let lang = (new URLSearchParams(location.search).get('lang') || 'en').startsWith('zh') ? 'zh' : 'en';
    let config = { session: 'default', startMs: null, limitSec: 7200, strikeSec: 60, hintSec: [60, 120, 180] };
    let events = [];
    const seen = new Set();
    let prevRanks = {};
    let statusKey = '';

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmtClock = (sec) => { const s = Math.max(0, Math.floor(Math.abs(sec))); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
    const T = () => I18N[lang];

    function parseConfig(text) {
        const out = {}; let section = '';
        text.split(/\r?\n/).forEach((raw) => {
            const line = raw.trim();
            if (!line || line.startsWith('#')) return;
            if (line.startsWith('[') && line.endsWith(']')) { section = line.slice(1, -1).toUpperCase(); return; }
            if ((section === 'SUPABASE' || section === 'GAME') && line.includes('=')) {
                const i = line.indexOf('='); out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
            }
        });
        return out;
    }

    // Pure aggregation (also unit-tested): events must be in chronological order
    function aggregate(evts, cfg) {
        const strikeSec = cfg && Number.isFinite(cfg.strikeSec) ? cfg.strikeSec : 60;
        const hintSec = cfg && cfg.hintSec && cfg.hintSec.length === 3 ? cfg.hintSec : [60, 120, 180];
        const groups = {};
        const feed = [];
        for (const e of evts) {
            const name = e.group_name;
            if (!name) continue;
            const g = groups[name] || (groups[name] = { name, nodes: new Set(), puzzles: new Set(), secrets: new Set(), roles: new Set(), finish: null, penalty: 0, lastProgressAt: 0, lastAt: 0 });
            const at = Date.parse(e.created_at) || 0;
            g.lastAt = Math.max(g.lastAt, at);
            if (e.role) g.roles.add(e.role);
            let item = null;
            if (e.event_type === 'join') item = { kind: 'join', role: e.role };
            else if (e.event_type === 'node' && NODE_NUM[e.detail] && !g.nodes.has(e.detail)) { g.nodes.add(e.detail); g.lastProgressAt = at; item = { kind: 'node', n: NODE_NUM[e.detail] }; }
            else if (e.event_type === 'puzzle' && PUZZLE_NUM[e.detail] && !g.puzzles.has(e.detail)) { g.puzzles.add(e.detail); g.lastProgressAt = at; item = { kind: 'puzzle', n: g.puzzles.size }; }
            else if (e.event_type === 'secret' && e.detail && !g.secrets.has(e.detail)) { g.secrets.add(e.detail); item = { kind: 'secret', n: g.secrets.size }; }
            else if (e.event_type === 'strike') { g.penalty += strikeSec; item = { kind: 'strike', cost: strikeSec }; }
            else if (e.event_type === 'hint') {
                const lvl = parseInt(String(e.detail || '').split(':')[1], 10);
                if (lvl >= 1 && lvl <= 3) { g.penalty += hintSec[lvl - 1]; item = { kind: 'hint', cost: hintSec[lvl - 1] }; }
            }
            else if (e.event_type === 'finish' && (g.finish === null || (e.elapsed_seconds ?? Infinity) < g.finish)) {
                const first = g.finish === null;
                g.finish = Number.isFinite(e.elapsed_seconds) ? e.elapsed_seconds : 0;
                g.lastProgressAt = at;
                if (first) item = { kind: 'finish', elapsed: g.finish, groupRef: g };
            }
            if (item) feed.push({ ...item, id: e.id, group: name, at });
        }
        const rows = Object.values(groups).map((g) => ({ ...g, stage: g.nodes.size + g.puzzles.size, total: g.finish === null ? null : g.finish + g.penalty }));
        rows.sort((a, b) => {
            const af = a.finish !== null, bf = b.finish !== null;
            if (af !== bf) return af ? -1 : 1;
            if (af && bf && a.total !== b.total) return a.total - b.total;
            if (!af && a.stage !== b.stage) return b.stage - a.stage;
            if (a.secrets.size !== b.secrets.size) return b.secrets.size - a.secrets.size;
            if (!af && a.penalty !== b.penalty) return a.penalty - b.penalty;
            return (a.lastProgressAt || Infinity) - (b.lastProgressAt || Infinity);
        });
        feed.forEach((f) => { if (f.kind === 'finish') { f.elapsed = f.elapsed + f.groupRef.penalty; delete f.groupRef; } });
        return { rows, feed: feed.reverse() };
    }
    window.__sunriseAggregate = aggregate;

    function feedText(f) {
        const t = T(); const g = `<strong class="text-white">${esc(f.group)}</strong>`;
        if (f.kind === 'join') return { icon: 'fa-user-plus text-slate-400', html: t.join(g, esc(t.roles[f.role] || '')) };
        if (f.kind === 'node') return { icon: 'fa-unlock-keyhole text-brand', html: t.node(g, f.n) };
        if (f.kind === 'puzzle') return { icon: 'fa-crosshairs text-red-400', html: t.puzzle(g, f.n) };
        if (f.kind === 'secret') return { icon: 'fa-star text-amber-300', html: t.secret(g, f.n) };
        if (f.kind === 'hint') return { icon: 'fa-lightbulb text-amber-400', html: t.hint(g, fmtClock(f.cost)) };
        if (f.kind === 'strike') return { icon: 'fa-xmark text-red-400', html: t.strike(g, fmtClock(f.cost)) };
        return { icon: 'fa-shield-halved text-brand', html: `<span class="text-brand">${t.finish(g, fmtClock(f.elapsed))}</span>` };
    }

    function render() {
        const t = T();
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('[data-i18n]').forEach((el) => { const v = t[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
        $('langBtn').textContent = lang === 'en' ? '中文' : 'EN';
        $('status').textContent = statusKey ? t[statusKey] : '';

        const { rows, feed } = aggregate(events, config);
        $('empty').classList.toggle('hidden', rows.length > 0);

        const now = Date.now();
        $('board').innerHTML = rows.map((r, i) => {
            const rank = i + 1;
            const moved = prevRanks[r.name] !== undefined && prevRanks[r.name] !== rank;
            const medal = rank === 1 ? 'border-amber-400 bg-amber-400 text-slate-950' : rank === 2 ? 'border-slate-300 bg-slate-300 text-slate-950' : rank === 3 ? 'border-orange-400 bg-orange-500 text-slate-950' : 'border-slate-700 text-slate-300';
            const dots = ['logs', 'ledger', 'banking'].map((k) => `<span class="h-3 w-3 rounded-full md:h-3.5 md:w-3.5 ${r.nodes.has(k) ? 'bg-brand' : 'border border-slate-700'}"></span>`).join('')
                + '<span class="mx-1 h-4 w-px bg-slate-700"></span>'
                + ['puzzle1', 'puzzle2', 'puzzle3'].map((k) => `<span class="h-3 w-3 rotate-45 md:h-3.5 md:w-3.5 ${r.puzzles.has(k) ? 'bg-red-500' : 'border border-slate-700'}"></span>`).join('');
            const pen = r.penalty > 0 ? `<span class="block font-mono text-[11px] text-amber-300/90">${t.penalty(fmtClock(r.penalty))}</span>` : '';
            const time = r.finish !== null
                ? `<span class="font-bold text-brand">${fmtClock(r.total)}</span>${pen}`
                : `<span class="text-slate-500">${t.ago(Math.max(0, Math.floor((now - r.lastAt) / 1000)))}</span>${pen}`;
            return `<li class="${moved ? 'flash ' : ''}grid grid-cols-[3rem_1fr_9rem_5rem_6rem] items-center gap-3 rounded-xl border ${r.finish !== null ? 'border-brand/40 bg-brand/5' : 'border-slate-800 bg-slate-950/50'} px-3 py-3 md:grid-cols-[3.5rem_1fr_12rem_7rem_7rem] md:py-4">
                <span class="flex h-9 w-9 items-center justify-center rounded-full border font-mono text-base font-bold md:h-11 md:w-11 md:text-lg ${medal}">${rank}</span>
                <span class="min-w-0"><span class="block truncate text-lg font-bold text-white md:text-2xl">${esc(r.name)}</span>
                    ${r.finish !== null ? `<span class="caps font-mono text-[11px] text-brand"><i class="fa-solid fa-shield-halved mr-1"></i>${t.halted}</span>` : ''}</span>
                <span class="flex items-center gap-1.5">${dots}</span>
                <span class="text-right font-mono text-base font-bold text-amber-300 md:text-xl"><i class="fa-solid fa-star mr-1 text-xs"></i>${r.secrets.size}</span>
                <span class="text-right font-mono text-base tabular-nums md:text-xl">${time}</span>
            </li>`;
        }).join('');
        prevRanks = Object.fromEntries(rows.map((r, i) => [r.name, i + 1]));

        $('feed').innerHTML = feed.slice(0, 40).map((f, i) => {
            const { icon, html } = feedText(f);
            return `<li class="${i === 0 ? 'slide-in ' : ''}flex items-start gap-3 rounded-xl border border-slate-800 bg-slate-950/50 px-3 py-2.5">
                <i class="fa-solid ${icon} mt-1 w-4 text-center"></i>
                <div class="min-w-0 flex-1"><p class="text-sm leading-snug text-slate-300 md:text-base">${html}</p>
                <p class="mt-0.5 font-mono text-[11px] text-slate-500">${t.ago(Math.max(0, Math.floor((now - f.at) / 1000)))}</p></div></li>`;
        }).join('');
    }

    function tickClock() {
        const t = T();
        const box = $('clockBox'), clock = $('clock'), label = $('clockLabel');
        if (config.startMs) {
            const remaining = config.limitSec - Math.max(0, Math.floor((Date.now() - config.startMs) / 1000));
            const over = remaining <= 0;
            label.textContent = over ? t.clockOvertime : t.clockSettles;
            clock.textContent = over ? `+${fmtClock(-remaining)}` : fmtClock(remaining);
            clock.className = `font-mono text-3xl font-bold tabular-nums md:text-4xl ${over || remaining <= 600 ? 'text-red-400' : remaining <= 1800 ? 'text-amber-300' : 'text-brand'}`;
            box.className = `flex items-center gap-3 rounded-xl border px-4 py-2 ${over || remaining <= 600 ? 'border-red-500 bg-red-950/60' : 'border-slate-800 bg-slate-950'}`;
        } else {
            label.textContent = t.clockNow;
            clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }
    }

    function addEvents(list) {
        let added = false;
        for (const e of list) { if (e && e.id != null && !seen.has(e.id)) { seen.add(e.id); events.push(e); added = true; } }
        if (added) { events.sort((a, b) => (Date.parse(a.created_at) - Date.parse(b.created_at)) || (a.id - b.id)); render(); }
    }

    async function boot() {
        let cfg;
        try {
            const res = await fetch(`./info.txt?v=${Date.now()}`, { cache: 'no-store' });
            if (!res.ok) throw new Error('info.txt');
            cfg = parseConfig(await res.text());
        } catch (e) { statusKey = 'loadFail'; render(); return; }

        const start = cfg.GAME_START ? Date.parse(cfg.GAME_START) : NaN;
        const minutes = parseInt(cfg.SETTLEMENT_MINUTES, 10);
        const strikeSec = parseInt(cfg.STRIKE_PENALTY_SECONDS, 10);
        const hintSec = String(cfg.HINT_PENALTIES || '').split(',').map((x) => parseInt(x, 10)).filter((x) => Number.isFinite(x) && x >= 0);
        config = {
            session: (cfg.GAME_SESSION || 'default').slice(0, 40), startMs: Number.isFinite(start) ? start : null, limitSec: (minutes > 0 ? minutes : 120) * 60,
            strikeSec: Number.isFinite(strikeSec) && strikeSec >= 0 ? strikeSec : 60, hintSec: hintSec.length === 3 ? hintSec : [60, 120, 180]
        };
        $('session').textContent = config.session;

        if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase) { statusKey = 'noSupabase'; render(); return; }
        const client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

        const fetchAll = async () => {
            const { data, error } = await client.from('sunrise_events').select('*').eq('session', config.session).order('created_at', { ascending: true }).limit(5000);
            if (!error && data) addEvents(data);
        };
        await fetchAll();
        statusKey = 'polling'; render();

        client.channel('sunrise-feed')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sunrise_events', filter: `session=eq.${config.session}` }, (payload) => addEvents([payload.new]))
            .subscribe((status) => { statusKey = status === 'SUBSCRIBED' ? 'connected' : 'polling'; render(); });

        setInterval(fetchAll, 10000); // safety net if realtime drops
    }

    $('langBtn').addEventListener('click', () => { lang = lang === 'en' ? 'zh' : 'en'; render(); tickClock(); });
    $('fsBtn').addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); });
    setInterval(tickClock, 1000);
    setInterval(render, 15000); // refresh "x min ago"
    render(); tickClock(); boot();
})();
</script>
</body>
</html>
