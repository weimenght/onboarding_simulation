        // FOOLPROOF PARSER FOR info.txt
        function parseInfoTxt(text) {
            const result = {
                supabase: {},
                directory: [],
                securityInfra: [],
                eddWatchlist: [],
                purchaseOrders: [],
                vendors: [],
                logs: [],
                ledger: [],
                protocol: [],
                overrideAnswers: {}
            };

            let currentSection = '';
            const lines = (text || '').split(/\r?\n/);

            for (let rawLine of lines) {
                const line = rawLine.trim();
                if (!line || line.startsWith('#')) continue;

                if (line.startsWith('[') && line.endsWith(']')) {
                    currentSection = line.slice(1, -1).trim().toUpperCase();
                    continue;
                }

                const parts = line.split('|').map(p => p.trim());

                switch (currentSection) {
                    case 'SUPABASE': {
                        const eqIdx = line.indexOf('=');
                        if (eqIdx !== -1) {
                            const k = line.slice(0, eqIdx).trim();
                            const v = line.slice(eqIdx + 1).trim();
                            result.supabase[k] = v;
                        }
                        break;
                    }
                    case 'DIRECTORY':
                        if (parts.length >= 6) {
                            result.directory.push({
                                id: parts[0], name: parts[1], dept: parts[2],
                                role: parts[3], ext: parts[4], ip: parts[5]
                            });
                        }
                        break;
                    case 'SECURITY_INFRA':
                        if (parts.length >= 3) {
                            result.securityInfra.push({
                                emp: parts[0], sys: parts[1], level: parts[2],
                                highlight: (parts[3] || '').toLowerCase() === 'true'
                            });
                        }
                        break;
                    case 'EDD_WATCHLIST':
                        result.eddWatchlist.push(line);
                        break;
                    case 'PURCHASE_ORDERS':
                        if (parts.length >= 4) {
                            result.purchaseOrders.push({
                                po: parts[0], vendor: parts[1], project: parts[2], approver: parts[3]
                            });
                        }
                        break;
                    case 'VENDORS':
                        if (parts.length >= 7) {
                            result.vendors.push({
                                id: parts[0], name: parts[1], country: parts[2],
                                status: parts[3], risk: parts[4], bank: parts[5], currency: parts[6]
                            });
                        }
                        break;
                    case 'LOGS':
                        if (parts.length >= 5) {
                            result.logs.push({
                                date: '2026-06-15', time: parts[0], event: parts[1],
                                user: parts[2], status: parts[3], ticket: parts[4]
                            });
                        }
                        break;
                    case 'LEDGER':
                        if (parts.length >= 8) {
                            result.ledger.push({
                                id: parts[0], date: parts[1], time: parts[2],
                                vendor: parts[3], vendor_id: parts[4], amount: parts[5],
                                approved: parts[6], status: parts[7]
                            });
                        }
                        break;
                    case 'PROTOCOL':
                        if (parts.length >= 8) {
                            result.protocol.push({
                                tierKey: parts[0], cap: parts[1], jurKey: parts[2],
                                channel: parts[3], anomalyKey: parts[4], code: parts[5],
                                gateway: parts[6], hash: parts[7]
                            });
                        }
                        break;
                    case 'OVERRIDE_ANSWERS':
                        if (parts.length >= 2) {
                            const puzzleKey = parts[0];
                            result.overrideAnswers[puzzleKey] = parts.slice(1);
                        }
                        break;
                }
            }

            result.logs.sort((a, b) => (`${a.date} ${a.time}`).localeCompare(`${b.date} ${b.time}`));
            result.ledger.sort((a, b) => (`${a.date} ${a.time} ${a.id}`).localeCompare(`${b.date} ${b.time} ${b.id}`));
            return result;
        }

        function formatUTC8Time(date = new Date()) {
            try {
                const d = new Date(date);
                const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
                const nd = new Date(utc + (3600000 * 8));
                const pad = (n) => String(n).padStart(2, '0');
                return `${nd.getFullYear()}-${pad(nd.getMonth() + 1)}-${pad(nd.getDate())} ${pad(nd.getHours())}:${pad(nd.getMinutes())}:${pad(nd.getSeconds())} (UTC+8)`;
            } catch(e) {
                return new Date().toISOString().replace('T', ' ').substring(0, 19) + ' (UTC+8)';
            }
        }

        function generateSecurityToken(group, timeStr) {
            const raw = `${group || 'UNKNOWN'}_${timeStr}_SUNRISE_VOIDWIRE_2026`;
            let hash = 0;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                hash |= 0;
            }
            const hex = Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
            return `SEC-${hex}-DU26`;
        }

        function SnakeGame({ onClose }) {
            const [snake, setSnake] = useState([[10, 10]]);
            const [food, setFood] = useState([15, 15]);
            const [dir, setDir] = useState([0, -1]);
            const [gameOver, setGameOver] = useState(false);
            const [score, setScore] = useState(0);

            useEffect(() => {
                if (gameOver) return;
                const moveSnake = () => {
                    setSnake(prev => {
                        const head = prev[0];
                        const newHead = [head[0] + dir[0], head[1] + dir[1]];
                        if (newHead[0] < 0 || newHead[0] >= 20 || newHead[1] < 0 || newHead[1] >= 20) {
                            setGameOver(true); return prev;
                        }
                        if (prev.some(segment => segment[0] === newHead[0] && segment[1] === newHead[1])) {
                            setGameOver(true); return prev;
                        }
                        const newSnake = [newHead, ...prev];
                        if (newHead[0] === food[0] && newHead[1] === food[1]) {
                            setScore(s => s + 10);
                            setFood([Math.floor(Math.random() * 20), Math.floor(Math.random() * 20)]);
                        } else {
                            newSnake.pop();
                        }
                        return newSnake;
                    });
                };
                const interval = setInterval(moveSnake, 120);
                return () => clearInterval(interval);
            }, [dir, food, gameOver]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    switch (e.key) {
                        case 'ArrowUp': if (dir[1] !== 1) setDir([0, -1]); break;
                        case 'ArrowDown': if (dir[1] !== -1) setDir([0, 1]); break;
                        case 'ArrowLeft': if (dir[0] !== 1) setDir([-1, 0]); break;
                        case 'ArrowRight': if (dir[0] !== -1) setDir([1, 0]); break;
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [dir]);

                            <i className="fa-solid fa-mug-hot mr-2"></i> {t.n3DefconBtn}
                        </button>
                    </div>
                </div>
            );
        }

        // Sleek 5-Item Mobile Bottom Dock + Desktop Sidebar Item
        function QuestNavBtn({ icon, label, mobileLabel, isActive, onClick, locked = false, isLockedCritical = false, isCritical = false }) {
            const base = "group relative flex flex-col md:flex-row items-center justify-center md:justify-between flex-1 md:flex-initial md:w-full px-1 py-2 md:px-3.5 md:py-3 rounded-xl text-[10px] md:text-xs font-medium transition-all duration-150 cursor-pointer select-none min-w-0";
            
            let stateStyle = isActive
                ? "bg-deloitte-green/15 text-deloitte-green border border-deloitte-green/40 shadow-[0_0_15px_rgba(134,188,37,0.12)]"
                : "text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 border border-transparent";

            if (isCritical) {
                stateStyle = isLockedCritical
                    ? (isActive 
                        ? "bg-red-950/80 text-red-300 border border-red-500/60 shadow-[0_0_12px_rgba(239,68,68,0.25)]" 
                        : "bg-slate-900/80 text-red-400/70 border border-red-900/50 hover:border-red-500/50")
                    : (isActive
                        ? "bg-red-600 text-white border border-red-400 shadow-[0_0_20px_rgba(220,38,38,0.5)]"
                        : "bg-red-950/70 text-red-400 border border-red-500 hover:bg-red-600 hover:text-white animate-pulse shadow-[0_0_12px_rgba(239,68,68,0.3)]");
            }

            return (
                <button type="button" onClick={onClick} className={`${base} ${stateStyle}`}>
                    <div className="flex flex-col md:flex-row items-center gap-1 md:gap-3 min-w-0 w-full md:w-auto">
                        <div className="relative flex items-center justify-center w-5 h-5 shrink-0">
                            <i className={`fa-solid ${icon} text-xs md:text-sm`}></i>
                            {(locked || isLockedCritical) && (
                                <span className={`md:hidden w-1.5 h-1.5 rounded-full ${isCritical ? 'bg-red-500' : 'bg-amber-400'} absolute -top-0.5 -right-0.5`}></span>
                            )}
                        </div>
                        <span className={`md:hidden ${isCritical ? 'font-mono font-bold uppercase' : 'font-medium'} leading-none truncate w-full text-center text-[10px]`}>
                            {mobileLabel || label}
                        </span>
                        <span className={`hidden md:inline-block ${isCritical ? 'font-mono font-bold tracking-wider uppercase' : 'tracking-tight'} leading-none truncate`}>
                            {label}
                        </span>
                    </div>
                    {(locked || isLockedCritical) && <i className="hidden md:inline-block fa-solid fa-lock text-slate-500 text-[10px] shrink-0"></i>}
                    {!locked && !isCritical && isActive && <span className="hidden md:inline-block w-1.5 h-1.5 rounded-full bg-deloitte-green shadow-[0_0_6px_#86BC25] shrink-0"></span>}
                </button>
            );
        }

        function loadSavedState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function QuestView() {
            const saved = loadSavedState();

            // Dynamic Data & Supabase State
            const [appData, setAppData] = useState(null);
            const [loadingInfo, setLoadingInfo] = useState(true);
            const [sbClient, setSbClient] = useState(null);
            const [sbConnected, setSbConnected] = useState(false);
            const [nodePasswords, setNodePasswords] = useState({ logs: [], ledger: [], banking: [] });
            const [overrideCodes, setOverrideCodes] = useState({ puzzle1: [], puzzle2: [], puzzle3: [], puzzle4: [] });
            const [verifyingPuzzleKey, setVerifyingPuzzleKey] = useState(null);

            const initialRawTab = (saved && saved.activeTab) || 'hub';
            const isLegacyHubTab = ['org', 'security', 'vendor'].includes(initialRawTab);

            const [activeTab, setActiveTab] = useState(() => isLegacyHubTab ? 'hub' : initialRawTab);
            const [hubSubTab, setHubSubTab] = useState(() => {
                if (saved && saved.hubSubTab) return saved.hubSubTab;
                if (isLegacyHubTab) return initialRawTab;
                return 'org';
            });

            const [unlockedNodes, setUnlockedNodes] = useState(() => (saved && saved.unlockedNodes) || { logs: false, ledger: false, banking: false });
            const [solvedPuzzles, setSolvedPuzzles] = useState(() => (saved && saved.solvedPuzzles) || { puzzle1: false, puzzle2: false, puzzle3: false, puzzle4: false });
            const [puzzleInputs, setPuzzleInputs] = useState(() => (saved && saved.puzzleInputs) || { puzzle1: '', puzzle2: '', puzzle3: '', puzzle4: '' });
            const [puzzleErrors, setPuzzleErrors] = useState({ puzzle1: false, puzzle2: false, puzzle3: false, puzzle4: false });
            const [lang, setLang] = useState(() => (saved && saved.lang) || 'en');

            // Persistent Lockouts
            const [nodeStrikeCount, setNodeStrikeCount] = useState(() => (saved && typeof saved.nodeStrikeCount === 'number') ? saved.nodeStrikeCount : 0);
            const [nodeLockoutUntil, setNodeLockoutUntil] = useState(() => (saved && typeof saved.nodeLockoutUntil === 'number') ? saved.nodeLockoutUntil : 0);
            const [nodeLockoutTimer, setNodeLockoutTimer] = useState(() => Math.max(0, Math.ceil((((saved && saved.nodeLockoutUntil) || 0) - Date.now()) / 1000)));

            const [haltStrikes, setHaltStrikes] = useState(() => (saved && typeof saved.haltStrikes === 'number') ? saved.haltStrikes : 0);
            const [haltLockoutUntil, setHaltLockoutUntil] = useState(() => (saved && typeof saved.haltLockoutUntil === 'number') ? saved.haltLockoutUntil : 0);
            const [haltLockoutTimer, setHaltLockoutTimer] = useState(() => Math.max(0, Math.ceil((((saved && saved.haltLockoutUntil) || 0) - Date.now()) / 1000)));

            const [warningToast, setWarningToast] = useState('');
            const [easterEggToast, setEasterEggToast] = useState('');

            // Easter Egg States
            const [showMinigame, setShowMinigame] = useState(false);
            const [clickCount, setClickCount] = useState(0);
            const [showMemo, setShowMemo] = useState(false);
            const [rowClickCount, setRowClickCount] = useState(0);
            const [rootLogClickCount, setRootLogClickCount] = useState(0);
            const [showRootModal, setShowRootModal] = useState(false);
            const [n3TitleClicks, setN3TitleClicks] = useState(0);
            const [showSecretProtocol, setShowSecretProtocol] = useState(false);
            const [showDefconModal, setShowDefconModal] = useState(false);
            const [shieldClicks, setShieldClicks] = useState(0);
            const [showVictoryBlessing, setShowVictoryBlessing] = useState(false);

            const [completionTime, setCompletionTime] = useState(() => (saved && saved.completionTime) || '');
            const [groupNumber, setGroupNumber] = useState(() => (saved && saved.groupNumber) || '');
            const [groupError, setGroupError] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [exportSuccessMsg, setExportSuccessMsg] = useState(false);

            const [search, setSearch] = useState('');
            const [poSearch, setPoSearch] = useState('');
            const [vendorSearch, setVendorSearch] = useState('');
            const [logSearch, setLogSearch] = useState('');
            const [ledgerSearch, setLedgerSearch] = useState('');

            const [unlockInput, setUnlockInput] = useState('');
            const [unlockError, setUnlockError] = useState(false);
            const [verifyingNode, setVerifyingNode] = useState(false);

            const t = dict[lang] || dict.en;
            const isGhost = ['404', '999', 'GHOST', 'EMP404'].includes((search || '').trim().toUpperCase());
            const isCoffeeLogSearch = ['COFFEE', 'ESPRESSO', 'COOKIE', '418', 'TEA', 'SNACK', '咖啡', '饼干'].includes((logSearch || '').trim().toUpperCase());
            const isPizzaLedgerSearch = ['PIZZA', 'COFFEE', 'STARBUCKS', 'COOKIE', 'SNACK', 'LUNCH', '披萨', '咖啡', '饼干'].includes((ledgerSearch || '').trim().toUpperCase());

            const allNodesUnlocked = unlockedNodes.logs && unlockedNodes.ledger && unlockedNodes.banking;
            const allPuzzlesSolved = solvedPuzzles.puzzle1 && solvedPuzzles.puzzle2 && solvedPuzzles.puzzle3 && solvedPuzzles.puzzle4;

            // Load info.txt and initialize Supabase for both Node Passwords & Halt TXN Override Codes
            useEffect(() => {
                async function bootSystem() {
                    try {
                        const res = await fetch(`./info.txt?v=${Date.now()}`);
                        if (!res.ok) throw new Error('Could not load info.txt');
                        const text = await res.text();
                        const parsed = parseInfoTxt(text);
                        setAppData(parsed);

                        // Optional fallback if present in info.txt
                        const fb1 = parsed.supabase.FALLBACK_NODE1_KEY || '';
                        const fb2 = parsed.supabase.FALLBACK_NODE2_KEY || '';
                        const fb3 = parsed.supabase.FALLBACK_NODE3_KEY || '';
                        setNodePasswords({
                            logs: fb1 ? [fb1] : [],
                            ledger: fb2 ? [fb2] : [],
                            banking: fb3 ? [fb3, fb3.replace(/\s+/g, '')] : []
                        });

                        if (parsed.overrideAnswers && Object.keys(parsed.overrideAnswers).length > 0) {
                            setOverrideCodes(prev => ({ ...prev, ...parsed.overrideAnswers }));
                        }

                        // Initialize Supabase client from info.txt
                        const sbUrl = parsed.supabase.SUPABASE_URL;
                        const sbKey = parsed.supabase.SUPABASE_ANON_KEY;
                        if (sbUrl && sbKey && !sbUrl.includes('your-project-id') && window.supabase) {
                            const client = window.supabase.createClient(sbUrl, sbKey);
                            setSbClient(client);

                            // 1. Fetch 3 Node Passwords from Supabase 'sunrise_nodes'
                            const { data: nodeData, error: nodeErr } = await client
                                .from('sunrise_nodes')
                                .select('node_key, password');
                            if (!nodeErr && nodeData && nodeData.length > 0) {
                                const supaNodes = {};
                                nodeData.forEach(row => {
                                    if (row.node_key && row.password) {
                                        supaNodes[row.node_key] = [row.password, row.password.replace(/\s+/g, '')];
                                    }
                                });
                                setNodePasswords(prev => ({ ...prev, ...supaNodes }));
                                setSbConnected(true);
                            }

                            // 2. Fetch 4 Halt TXN Override Codes from Supabase 'sunrise_override_codes'
                            const { data: haltData, error: haltErr } = await client
                                .from('sunrise_override_codes')
                                .select('puzzle_key, accepted_answers');
                            if (!haltErr && haltData && haltData.length > 0) {
                                const supaHalt = {};
                                haltData.forEach(row => {
                                    if (row.puzzle_key && row.accepted_answers) {
                                        supaHalt[row.puzzle_key] = row.accepted_answers.split('|').map(s => s.trim()).filter(Boolean);
                                    }
                                });
                                setOverrideCodes(prev => ({ ...prev, ...supaHalt }));
                                setSbConnected(true);
                            }
                        }
                    } catch (err) {
                        console.error("Error loading info.txt or Supabase:", err);
                    } finally {
                        setLoadingInfo(false);
                    }
                }
                bootSystem();
            }, []);

            // Persist user progress in localStorage
            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        activeTab, hubSubTab, unlockedNodes, solvedPuzzles, puzzleInputs, lang,
                        nodeStrikeCount, nodeLockoutUntil, haltStrikes, haltLockoutUntil,
                        completionTime, groupNumber
                    }));
                } catch (e) {}
            }, [activeTab, hubSubTab, unlockedNodes, solvedPuzzles, puzzleInputs, lang, nodeStrikeCount, nodeLockoutUntil, haltStrikes, haltLockoutUntil, completionTime, groupNumber]);

            // Countdown Timers
            useEffect(() => {
                const interval = setInterval(() => {
                    const now = Date.now();
                    setNodeLockoutTimer(nodeLockoutUntil > now ? Math.ceil((nodeLockoutUntil - now) / 1000) : 0);
                    setHaltLockoutTimer(haltLockoutUntil > now ? Math.ceil((haltLockoutUntil - now) / 1000) : 0);
                }, 250);
                return () => clearInterval(interval);
            }, [nodeLockoutUntil, haltLockoutUntil]);

            useEffect(() => {
                if (allPuzzlesSolved && !completionTime) {
                    setCompletionTime(formatUTC8Time(new Date()));
                }
            }, [allPuzzlesSolved, completionTime]);

            const getNextFreezeThreshold = (strikes) => {
                if (strikes < 5) return 5;
                if (strikes < 8) return 8;
                if (strikes < 10) return 10;
                if (strikes < 15) return 15;
                return Math.ceil((strikes + 1) / 5) * 5;
            };

            const applyHaltStrike = () => {
                const newStrikes = haltStrikes + 1;
                setHaltStrikes(newStrikes);
                let freezeSecs = 0;
                if (newStrikes === 5) freezeSecs = 30;
                else if (newStrikes === 8) freezeSecs = 60;
                else if (newStrikes === 10) freezeSecs = 120;
                else if (newStrikes === 15 || (newStrikes > 15 && newStrikes % 5 === 0)) freezeSecs = 300;

                if (freezeSecs > 0) {
                    const until = Date.now() + freezeSecs * 1000;
                    setHaltLockoutUntil(until);
                    setHaltLockoutTimer(freezeSecs);
                }
            };

            // Easter Egg Click Handlers
            const handleSecretClick = () => setClickCount(prev => (prev + 1 >= 5 ? (setShowMinigame(true), 0) : prev + 1));
            const handleDummyRowClick = () => setRowClickCount(prev => (prev + 1 >= 3 ? (setShowMemo(true), 0) : prev + 1));
            const handleRootLogClick = () => setRootLogClickCount(prev => (prev + 1 >= 3 ? (setShowRootModal(true), 0) : prev + 1));
            const handleN3TitleClick = () => setN3TitleClicks(prev => (prev + 1 >= 3 ? (setShowSecretProtocol(s => !s), 0) : prev + 1));
            const handleShieldClick = () => setShieldClicks(prev => (prev + 1 >= 5 ? (setShowVictoryBlessing(true), 0) : prev + 1));

            // Verify 3 Node Passwords against Supabase
            const handleUnlock = async (e, nodeKey) => {
                e.preventDefault();
                if (nodeLockoutTimer > 0 || verifyingNode) return;

                setVerifyingNode(true);
                let expectedList = nodePasswords[nodeKey] || [];

                if (sbClient) {
                    try {
                        const { data, error } = await sbClient
                            .from('sunrise_nodes')
                            .select('password')
                            .eq('node_key', nodeKey)
                            .maybeSingle();
                        if (!error && data && data.password) {
                            expectedList = [data.password, data.password.replace(/\s+/g, '')];
                            setSbConnected(true);
                        }
                    } catch (err) {}
                }
                setVerifyingNode(false);

                const cleanInput = (unlockInput || '').trim().toUpperCase().replace(/,/g, '');
                const noSpaceInput = cleanInput.replace(/\s+/g, '');
                const isMatch = expectedList.some(ans => {
                    const cleanAns = ans.toUpperCase().trim().replace(/,/g, '');
                    return cleanInput === cleanAns || noSpaceInput === cleanAns.replace(/\s+/g, '');
                });

                if (isMatch) {
                    setUnlockError(false);
                    setUnlockInput('');
                    setUnlockedNodes(prev => ({ ...prev, [nodeKey]: true }));
                } else {
                    setUnlockError(true);
                    setTimeout(() => setUnlockError(false), 2000);
                    const newStrikes = nodeStrikeCount + 1;
                    if (newStrikes >= 3) {
                        const until = Date.now() + 20 * 1000;
                        setNodeLockoutUntil(until);
                        setNodeLockoutTimer(20);
                        setNodeStrikeCount(0);
                    } else {
                        setNodeStrikeCount(newStrikes);
                    }
                }
            };

            const triggerEasterEggToast = (msg) => {
                setEasterEggToast(msg);
                setTimeout(() => setEasterEggToast(''), 6500);
            };

            // Verify Halt TXN Override Code directly against Supabase 'sunrise_override_codes'
            const handleVerifyPuzzle = async (key) => {
                if (haltLockoutTimer > 0 || verifyingPuzzleKey) return;

                const rawVal = (puzzleInputs[key] || '').trim();
                const userVal = rawVal.toUpperCase().replace(/[#\-_/]/g, '').replace(/\s+/g, '');

                // Joke Answer Easter Eggs (Zero Strike Penalty!)
                if (key === 'puzzle1' && ['VICTORIAVANCE', 'VVANCE', 'VICTORIA'].includes(userVal)) {
                    triggerEasterEggToast(t.haltJokeVance); return;
                }
                if (['PARTNER', 'MANAGER', 'INTERN', 'DELOITTE', 'AUDITOR', 'ARTHURPENDELTON'].includes(userVal)) {
                    triggerEasterEggToast(t.haltJokePartner); return;
                }
                if (['PLEASE', 'PLSFIX', 'PLZFIX', 'PLZFIXTHX', 'PLSFIXTHX', 'HELP', 'SOS'].includes(userVal)) {
                    triggerEasterEggToast(t.haltJokePlsFix); return;
                }
                if (['PASSWORD', '123456', 'ADMIN', '888888', 'QWERTY', 'LETMEIN'].includes(userVal)) {
                    triggerEasterEggToast(t.haltJokePassword); return;
                }
                if (['COFFEE', 'COOKIE', 'COOKIES', 'PIZZA', 'ESPRESSO', 'STARBUCKS', 'DEPLOYEMERGENCYPIZZA', 'GWBARNESPRESSO'].includes(userVal)) {
                    triggerEasterEggToast(t.haltJokeCoffee); return;
                }

                // Anti-Badge Enumeration Check
                if (key === 'puzzle1' && (userVal.includes('EMP') || /^\d+$/.test(userVal))) {
                    setWarningToast(t.badgeEnumWarning);
                    setTimeout(() => setWarningToast(''), 4500);
                    setPuzzleErrors(prev => ({ ...prev, [key]: true }));
                    setTimeout(() => setPuzzleErrors(prev => ({ ...prev, [key]: false })), 1500);
                    applyHaltStrike();
                    return;
                }

                setVerifyingPuzzleKey(key);
                let acceptedAnswers = overrideCodes[key] || [];

                // Live query to Supabase 'sunrise_override_codes' table
                if (sbClient) {
                    try {
                        const { data, error } = await sbClient
                            .from('sunrise_override_codes')
                            .select('accepted_answers')
                            .eq('puzzle_key', key)
                            .maybeSingle();
                        if (!error && data && data.accepted_answers) {
                            acceptedAnswers = data.accepted_answers.split('|').map(s => s.trim()).filter(Boolean);
                            setOverrideCodes(prev => ({ ...prev, [key]: acceptedAnswers }));
                            setSbConnected(true);
                        }
                    } catch (err) {}
                }
                setVerifyingPuzzleKey(null);

                const isMatch = (acceptedAnswers || []).some(ans => {
                    const cleanAns = ans.toUpperCase().trim().replace(/[#\-_/]/g, '').replace(/\s+/g, '');
                    return userVal === cleanAns;
                });

                if (isMatch) {
                    setSolvedPuzzles(prev => ({ ...prev, [key]: true }));
                    setPuzzleErrors(prev => ({ ...prev, [key]: false }));
                } else {
                    setPuzzleErrors(prev => ({ ...prev, [key]: true }));
                    setTimeout(() => setPuzzleErrors(prev => ({ ...prev, [key]: false })), 1500);
                    applyHaltStrike();
                }
            };

            const downloadProofJPEG = () => {
                const cleanGroup = (groupNumber || '').trim();
                if (!cleanGroup) {
                    setGroupError(true);
                    setTimeout(() => setGroupError(false), 3500);
                    return;
                }
                setGroupError(false);
                setIsExporting(true);

                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1400;
                    canvas.height = 960;
                    const ctx = canvas.getContext('2d');
                    const timeToPrint = completionTime || formatUTC8Time(new Date());

                    const bgGrad = ctx.createLinearGradient(0, 0, 1400, 960);
                    bgGrad.addColorStop(0, '#020617');
                    bgGrad.addColorStop(0.5, '#091124');
                    bgGrad.addColorStop(1, '#020617');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, 1400, 960);

                    ctx.strokeStyle = 'rgba(6, 182, 212, 0.08)';
                    ctx.lineWidth = 1;
                    for (let x = 0; x < 1400; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 960); ctx.stroke(); }
                    for (let y = 0; y < 960; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1400, y); ctx.stroke(); }

                    ctx.save();
                    ctx.translate(700, 480);
                    ctx.rotate(-22 * Math.PI / 180);
                    ctx.translate(-700, -480);
                    ctx.font = "bold 15px 'JetBrains Mono', monospace";
                    ctx.fillStyle = "rgba(134, 188, 37, 0.09)";
                    const wmPhrase = "PROJECT SUNRISE // OFFICIAL AUDIT CLEARANCE // JUDGES RANKING METRIC // DO NOT ALTER // EVIDENCE CERTIFIED // ";
                    for (let y = -600; y < 1600; y += 50) {
                        for (let x = -800; x < 2400; x += 850) {
                            ctx.fillText(wmPhrase, x, y);
                        }
                    }
                    ctx.restore();

                    ctx.strokeStyle = 'rgba(134, 188, 37, 0.75)';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(30, 30, 1340, 900);

                    ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(40, 40, 1320, 880);

                    ctx.fillStyle = '#86BC25';
                    ctx.font = "bold 13px 'JetBrains Mono', monospace";
                    ctx.fillText("DELOITTE UNIVERSITY // DAY 2 GEO-QUEST // OFFICIAL CLEARANCE", 70, 75);

                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = "bold 34px 'Space Grotesk', sans-serif";
                    ctx.fillText("PROJECT SUNRISE — INCIDENT OVERRIDE PROOF", 70, 115);

                    ctx.fillStyle = 'rgba(134, 188, 37, 0.15)';
                    ctx.fillRect(1040, 60, 270, 48);
                    ctx.strokeStyle = '#86BC25';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(1040, 60, 270, 48);
                    ctx.fillStyle = '#86BC25';
                    ctx.font = "bold 14px 'JetBrains Mono', monospace";
                    ctx.fillText("STATUS: SAFELOCKED [OK]", 1060, 90);

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                    ctx.fillRect(70, 160, 1260, 150);
                    ctx.strokeStyle = 'rgba(134, 188, 37, 0.85)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(70, 160, 1260, 150);

                    ctx.fillStyle = '#38bdf8';
                    ctx.font = "bold 12px 'JetBrains Mono', monospace";
                    ctx.fillText("OFFICIAL RANKING METRIC // CONFIRMED LOCKDOWN TIMESTAMP:", 95, 195);

                    ctx.fillStyle = '#86BC25';
                    ctx.font = "bold 42px 'JetBrains Mono', monospace";
                    ctx.fillText(timeToPrint, 95, 250);

                    ctx.fillStyle = '#94a3b8';
                    ctx.font = "bold 13px 'JetBrains Mono', monospace";
                    ctx.fillText("AUTHENTICATED GROUP:", 780, 195);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = "bold 36px 'Space Grotesk', sans-serif";
                    ctx.fillText(cleanGroup.toUpperCase(), 780, 245);

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
                    ctx.fillRect(70, 335, 590, 375);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(70, 335, 590, 375);

                    ctx.fillStyle = '#86BC25';
                    ctx.font = "bold 14px 'JetBrains Mono', monospace";
                    ctx.fillText("INCIDENT SPECIFICATIONS", 95, 370);

                    const leftRows = [
                        ["Target Environment", "FTV-PROD-01 (FitVision, Inc.)"],

                        ["Routing Gateway Target", `${(puzzleInputs.puzzle4 || 'GATE-BVI-INTERCEPT').toUpperCase()} (EDD Clearing Intercept)`],
                        ["Frozen Transfer ID", `${(puzzleInputs.puzzle2 || 'TXN8824').toUpperCase()} (2026-06-15 03:00 UTC)`],
                        ["Intercepted Amount", "$22,000,000.00 USD (Channel: SWIFT-EDD)"],
                        ["Beneficiary Entity", "APEX Shell Logistics (BVI Shell Co.)"]
                    ];
                    leftRows.forEach((r, idx) => {
                        const y = 410 + idx * 48;
                        ctx.fillStyle = '#94a3b8';
                        ctx.font = "12px 'Space Grotesk', sans-serif";
                        ctx.fillText(r[0].toUpperCase(), 95, y);
                        ctx.fillStyle = (idx === 1 || idx === 2) ? '#86BC25' : '#e2e8f0';
                        ctx.font = "bold 14px 'JetBrains Mono', monospace";
                        ctx.fillText(r[1], 95, y + 20);
                    });

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
                    ctx.fillRect(690, 335, 640, 375);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.lineWidth = 1;

                                                            <i className="fa-solid fa-users text-deloitte-green mr-1.5"></i> {t.groupNumLabel} <span className="text-red-400">*</span>
                                                        </label>
                                                        <input type="text" value={groupNumber} onChange={(e) => { setGroupNumber(e.target.value); setGroupError(false); }} placeholder={t.groupNumPlaceholder} className={`w-full bg-slate-900 border ${groupError ? 'border-red-500 text-red-400' : 'border-slate-700 text-white focus:border-deloitte-green'} rounded-xl p-3 text-sm font-mono outline-none transition-all`} />
                                                        {groupError && <p className="text-xs text-red-400 mt-1.5 font-mono"><i className="fa-solid fa-triangle-exclamation mr-1"></i> {t.groupNumRequired}</p>}
                                                    </div>
                                                    <p className="text-[11px] text-slate-400 leading-relaxed bg-slate-900/60 p-3 rounded-xl border border-slate-800/80">
                                                        <i className="fa-solid fa-shield-cat text-deloitte-green mr-1.5"></i> {t.watermarkNotice}
                                                    </p>
                                                </div>

                                                {exportSuccessMsg && (
                                                    <div className="mb-4 bg-emerald-950/60 border border-emerald-500/50 rounded-xl p-3 text-center text-xs text-emerald-300 font-mono font-bold fade-in">
                                                        <i className="fa-solid fa-circle-check text-emerald-400 mr-1.5"></i> {t.downloadSuccess}
                                                    </div>
                                                )}

                                                <button type="button" onClick={downloadProofJPEG} disabled={isExporting} className="w-full bg-deloitte-green hover:bg-lime-400 text-slate-950 font-mono font-bold py-3.5 px-6 rounded-xl transition-all uppercase tracking-widest text-xs md:text-sm shadow-[0_0_25px_rgba(134,188,37,0.3)] flex items-center justify-center gap-2.5 cursor-pointer">
                                                    <i className={`fa-solid ${isExporting ? 'fa-circle-notch fa-spin' : 'fa-file-arrow-down'}`}></i>
                                                    <span>{isExporting ? t.exportingText : t.exportProofBtn}</span>
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="fade-in pb-6">
                                            <div className="flex flex-col sm:flex-row sm:justify-between items-start sm:items-center mb-2 gap-2">
                                                <h2 className="text-lg md:text-xl font-mono font-bold text-red-400 uppercase"><i className="fa-solid fa-bolt mr-1.5"></i> {t.sysOverride}</h2>
                                                {haltStrikes > 0 && haltLockoutTimer === 0 && (
                                                    <span className="text-xs font-mono bg-red-950 border border-red-500/60 text-red-400 px-3 py-1 rounded-lg">
                                                        <i className="fa-solid fa-triangle-exclamation mr-1"></i> {t.strikeCountLabel}: {haltStrikes} ({t.nextFreezeLabel}: {getNextFreezeThreshold(haltStrikes)})
                                                    </span>
                                                )}
                                            </div>
                                            <p className="text-xs md:text-sm text-slate-400 mb-5 max-w-3xl leading-relaxed">{t.sysOverrideDesc}</p>
                                            
                                            {easterEggToast && (
                                                <div className="mb-4 bg-cyan-950/90 border border-cyan-400 text-cyan-200 p-3.5 rounded-xl text-xs md:text-sm flex items-center gap-3 fade-in">
                                                    <i className="fa-solid fa-face-laugh-wink text-cyan-400 text-lg shrink-0"></i>
                                                    <span>{easterEggToast}</span>
                                                </div>
                                            )}

                                            {warningToast && (
                                                <div className="mb-4 bg-red-950 border border-red-500 text-red-300 p-3 rounded-xl text-xs md:text-sm flex items-center gap-2 animate-bounce">
                                                    <i className="fa-solid fa-circle-exclamation text-red-400 text-lg shrink-0"></i>
                                                    <span>{warningToast}</span>
                                                </div>
                                            )}

                                            {haltLockoutTimer > 0 && (
                                                <div className="mb-6 bg-red-950/90 border border-red-500 rounded-2xl p-5 text-center animate-pulse">
                                                    <div className="text-red-400 font-mono font-bold uppercase tracking-wider mb-1 text-sm">
                                                        <i className="fa-solid fa-fire mr-1.5"></i> {t.lockoutTitle} ({t.strikeCountLabel}: {haltStrikes})
                                                    </div>
                                                    <p className="text-slate-300 text-xs mb-2">{t.lockoutDesc}</p>
                                                    <div className="font-mono text-3xl font-bold text-red-400 tracking-widest">{haltLockoutTimer}s</div>
                                                </div>
                                            )}

                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                                                {[
                                                    { k: 'puzzle1', t: t.identityMatch, p: t.empNameHint },
                                                    { k: 'puzzle2', t: t.auditFlag, p: t.suspiciousTxn },
                                                    { k: 'puzzle3', t: t.executeAction, p: t.haltActionCode },
                                                    { k: 'puzzle4', t: t.routingGateway, p: t.routingGatewayHint }
                                                ].map((puz, idx) => {
                                                    const isSolved = solvedPuzzles[puz.k];
                                                    const hasError = puzzleErrors[puz.k];
                                                    const isVerifyingThis = verifyingPuzzleKey === puz.k;
                                                    return (
                                                        <div key={puz.k} className={`app-surface border p-4 rounded-2xl flex flex-col justify-between min-h-[160px] ${isSolved ? 'border-deloitte-green bg-deloitte-green/5' : 'border-slate-800'}`}>
                                                            <div>
                                                                <div className="flex items-center justify-between mb-1">
                                                                    <span className="text-[10px] font-mono text-slate-500">VEC_0{idx + 1}</span>
                                                                    <i className={`fa-solid ${isSolved ? 'fa-circle-check text-deloitte-green' : 'fa-crosshairs text-slate-600'} text-xs`}></i>
                                                                </div>
                                                                <h3 className="font-bold uppercase text-xs md:text-sm mb-1 text-white">{puz.t}</h3>
                                                                <p className="text-[11px] text-slate-400 mb-4">{puz.p}</p>
                                                            </div>
                                                            {isSolved ? (
                                                                <div className="text-deloitte-green font-mono font-bold text-center tracking-widest border border-deloitte-green/40 py-2.5 bg-slate-950 rounded-xl text-xs">{t.verified}</div>
                                                            ) : (
                                                                <div className="flex gap-2">
                                                                    <input type="text" placeholder={t.enter} value={puzzleInputs[puz.k] || ''} disabled={haltLockoutTimer > 0 || isVerifyingThis} onChange={(e) => setPuzzleInputs({ ...puzzleInputs, [puz.k]: e.target.value })} onKeyDown={(e) => e.key === 'Enter' && handleVerifyPuzzle(puz.k)} className={`w-full bg-slate-950 border ${hasError ? 'border-red-500 text-red-400' : 'border-slate-700 text-white focus:border-deloitte-green'} ${haltLockoutTimer > 0 ? 'opacity-40 cursor-not-allowed' : ''} rounded-xl p-2.5 text-center font-mono text-xs uppercase outline-none transition-colors`} />
                                                                    <button type="button" disabled={haltLockoutTimer > 0 || isVerifyingThis} onClick={() => handleVerifyPuzzle(puz.k)} className={`bg-red-600 hover:bg-red-500 text-white px-3.5 rounded-xl text-xs font-mono font-bold uppercase transition-colors shrink-0 cursor-pointer ${haltLockoutTimer > 0 ? 'opacity-40 cursor-not-allowed' : ''}`}>
                                                                        {isVerifyingThis ? <i className="fa-solid fa-circle-notch fa-spin"></i> : t.verifyBtn}
                                                                    </button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )
                                )
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const rootContainer = document.getElementById('root');
        if (rootContainer) {
            const root = ReactDOM.createRoot(rootContainer);
            root.render(<QuestView />);
        }
    </script>
</body>
</html>
