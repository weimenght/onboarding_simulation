        // ─────────────────────────────────────────────────────────────
        // info.txt PARSER (unchanged format)
        // ─────────────────────────────────────────────────────────────
        function parseInfoTxt(text) {
            const result = {
                supabase: {}, directory: [], securityInfra: [], eddWatchlist: [],
                purchaseOrders: [], vendors: [], logs: [], ledger: [], protocol: [], overrideAnswers: {}
            };
            let currentSection = '';
            const lines = (text || '').split(/\r?\n/);

            for (let rawLine of lines) {
                const line = rawLine.trim();
                if (!line || line.startsWith('#')) continue;
                if (line.startsWith('[') && line.endsWith(']')) {
                    currentSection = line.slice(1, -1).trim().toUpperCase();
                    continue;
                }
                const parts = line.split('|').map(p => p.trim());
                switch (currentSection) {
                    case 'SUPABASE': {
                        const eqIdx = line.indexOf('=');
                        if (eqIdx !== -1) result.supabase[line.slice(0, eqIdx).trim()] = line.slice(eqIdx + 1).trim();
                        break;
                    }
                    case 'DIRECTORY':
                        if (parts.length >= 6) result.directory.push({ id: parts[0], name: parts[1], dept: parts[2], role: parts[3], ext: parts[4], ip: parts[5] });
                        break;
                    case 'SECURITY_INFRA':
                        if (parts.length >= 3) result.securityInfra.push({ emp: parts[0], sys: parts[1], level: parts[2], highlight: (parts[3] || '').toLowerCase() === 'true' });
                        break;
                    case 'EDD_WATCHLIST':
                        result.eddWatchlist.push(line);
                        break;
                    case 'PURCHASE_ORDERS':
                        if (parts.length >= 4) result.purchaseOrders.push({ po: parts[0], vendor: parts[1], project: parts[2], approver: parts[3] });
                        break;
                    case 'VENDORS':
                        if (parts.length >= 7) result.vendors.push({ id: parts[0], name: parts[1], country: parts[2], status: parts[3], risk: parts[4], bank: parts[5], currency: parts[6] });
                        break;
                    case 'LOGS':
                        if (parts.length >= 5) result.logs.push({ date: '2026-06-15', time: parts[0], event: parts[1], user: parts[2], status: parts[3], ticket: parts[4] });
                        break;
                    case 'LEDGER':
                        if (parts.length >= 8) result.ledger.push({ id: parts[0], date: parts[1], time: parts[2], vendor: parts[3], vendor_id: parts[4], amount: parts[5], approved: parts[6], status: parts[7] });
                        break;
                    case 'PROTOCOL':
                        if (parts.length >= 8) result.protocol.push({ tierKey: parts[0], cap: parts[1], jurKey: parts[2], channel: parts[3], anomalyKey: parts[4], code: parts[5], gateway: parts[6], hash: parts[7] });
                        break;
                    case 'OVERRIDE_ANSWERS':
                        if (parts.length >= 2) result.overrideAnswers[parts[0]] = parts.slice(1);
                        break;
                }
            }
            result.logs.sort((a, b) => (`${a.date} ${a.time}`).localeCompare(`${b.date} ${b.time}`));
            result.ledger.sort((a, b) => (`${a.date} ${a.time} ${a.id}`).localeCompare(`${b.date} ${b.time} ${b.id}`));
            return result;
        }

        function formatUTC8Time(date = new Date()) {
            try {
                const d = new Date(date);
                const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
                const nd = new Date(utc + (3600000 * 8));
                const pad = (n) => String(n).padStart(2, '0');
                return `${nd.getFullYear()}-${pad(nd.getMonth() + 1)}-${pad(nd.getDate())} ${pad(nd.getHours())}:${pad(nd.getMinutes())}:${pad(nd.getSeconds())} (UTC+8)`;
            } catch (e) {
                return new Date().toISOString().replace('T', ' ').substring(0, 19) + ' (UTC+8)';
            }
        }

        function generateSecurityToken(group, timeStr) {
            const raw = `${group || 'UNKNOWN'}_${timeStr}_SUNRISE_VOIDWIRE_2026`;
            let hash = 0;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                hash |= 0;
            }
            return `SEC-${Math.abs(hash).toString(16).toUpperCase().padStart(8, '0')}-DU26`;
        }

        const norm = (s) => (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

        function findEmployee(directory, input) {
            const n = norm(input);
            if (!n) return null;
            return directory.find(m => norm(m.name) === n) || directory.find(m => {
                const [first, ...rest] = m.name.split(/\s+/);
                const last = rest.join('');
                return norm(first + (last[0] || '')) === n || norm((first[0] || '') + last) === n;
            }) || null;
        }

        // Media query hook (with Safari < 14 addListener fallback)
        function useMediaQuery(query) {
            const get = () => (typeof window !== 'undefined' && window.matchMedia) ? window.matchMedia(query).matches : false;
            const [matches, setMatches] = useState(get);
            useEffect(() => {
                if (!window.matchMedia) return;
                const mql = window.matchMedia(query);
                const handler = (e) => setMatches(e.matches);
                setMatches(mql.matches);
                if (mql.addEventListener) mql.addEventListener('change', handler); else mql.addListener(handler);
                return () => { if (mql.removeEventListener) mql.removeEventListener('change', handler); else mql.removeListener(handler); };
            }, [query]);
            return matches;
        }

        function SnakeGame({ onClose }) {
            const [snake, setSnake] = useState([[10, 10]]);
            const [food, setFood] = useState([15, 15]);
            const [dir, setDir] = useState([0, -1]);
            const [gameOver, setGameOver] = useState(false);
            const [score, setScore] = useState(0);
            const lastDirRef = useRef([0, -1]); // direction actually moved last tick (blocks instant 180° turns)
            const touchRef = useRef(null);

            const turn = useCallback((nd) => {
                const ld = lastDirRef.current;
                if (ld[0] + nd[0] === 0 && ld[1] + nd[1] === 0) return;
                setDir(nd);
            }, []);

            useEffect(() => {
                if (gameOver) return;
                const interval = setInterval(() => {
                    setSnake(prev => {
                        const head = prev[0];
                        const newHead = [head[0] + dir[0], head[1] + dir[1]];
                        lastDirRef.current = dir;
                        if (newHead[0] < 0 || newHead[0] >= 20 || newHead[1] < 0 || newHead[1] >= 20 ||
                            prev.some(s => s[0] === newHead[0] && s[1] === newHead[1])) {
                            setGameOver(true); return prev;
                        }
                        const next = [newHead, ...prev];
                        if (newHead[0] === food[0] && newHead[1] === food[1]) {
                            setScore(s => s + 10);
                            setFood([Math.floor(Math.random() * 20), Math.floor(Math.random() * 20)]);
                        } else {
                            next.pop();
                        }
                        return next;
                    });
                }, 120);

        // ─────────────────────────────────────────────────────────────
        // MAIN APP
        // ─────────────────────────────────────────────────────────────
        function QuestView() {
            const [saved] = useState(loadSavedState); // read once, not on every render
            const isDesktop = useMediaQuery('(min-width: 768px)');
            const scrollRef = useRef(null);

            const [appData, setAppData] = useState(null);

            const [sbClient, setSbClient] = useState(null);
            const [sbConnected, setSbConnected] = useState(false);
            const [nodePasswords, setNodePasswords] = useState({ logs: [], ledger: [], banking: [] });
            const [overrideCodes, setOverrideCodes] = useState({ puzzle1: [], puzzle2: [], puzzle3: [], puzzle4: [] });
            const [verifyingPuzzleKey, setVerifyingPuzzleKey] = useState(null);

            const initialRawTab = (saved && saved.activeTab) || 'hub';
            const isLegacyHubTab = ['org', 'security', 'vendor'].includes(initialRawTab);

            const [activeTab, setActiveTab] = useState(() => isLegacyHubTab ? 'hub' : initialRawTab);
            const [hubSubTab, setHubSubTab] = useState(() => {
                if (saved && saved.hubSubTab) return saved.hubSubTab;

            });

            const [unlockedNodes, setUnlockedNodes] = useState(() => (saved && saved.unlockedNodes) || { logs: false, ledger: false, banking: false });
            const [solvedPuzzles, setSolvedPuzzles] = useState(() => (saved && saved.solvedPuzzles) || { puzzle1: false, puzzle2: false, puzzle3: false, puzzle4: false });
            const [puzzleInputs, setPuzzleInputs] = useState(() => (saved && saved.puzzleInputs) || { puzzle1: '', puzzle2: '', puzzle3: '', puzzle4: '' });
            const [puzzleErrors, setPuzzleErrors] = useState({ puzzle1: false, puzzle2: false, puzzle3: false, puzzle4: false });
            const [lang, setLang] = useState(() => (saved && saved.lang) || 'en');

            const [nodeStrikeCount, setNodeStrikeCount] = useState(() => (saved && typeof saved.nodeStrikeCount === 'number') ? saved.nodeStrikeCount : 0);
            const [nodeLockoutUntil, setNodeLockoutUntil] = useState(() => (saved && typeof saved.nodeLockoutUntil === 'number') ? saved.nodeLockoutUntil : 0);
            const [nodeLockoutTimer, setNodeLockoutTimer] = useState(() => Math.max(0, Math.ceil((((saved && saved.nodeLockoutUntil) || 0) - Date.now()) / 1000)));

            const [haltStrikes, setHaltStrikes] = useState(() => (saved && typeof saved.haltStrikes === 'number') ? saved.haltStrikes : 0);
            const [haltLockoutUntil, setHaltLockoutUntil] = useState(() => (saved && typeof saved.haltLockoutUntil === 'number') ? saved.haltLockoutUntil : 0);
            const [haltLockoutTimer, setHaltLockoutTimer] = useState(() => Math.max(0, Math.ceil((((saved && saved.haltLockoutUntil) || 0) - Date.now()) / 1000)));

            const [warningToast, setWarningToast] = useState('');
            const [easterEggToast, setEasterEggToast] = useState('');

            const [showMinigame, setShowMinigame] = useState(false);
            const [, setClickCount] = useState(0);
            const [showMemo, setShowMemo] = useState(false);
            const [, setRowClickCount] = useState(0);
            const [, setRootLogClickCount] = useState(0);
            const [showRootModal, setShowRootModal] = useState(false);
            const [, setN3TitleClicks] = useState(0);
            const [showSecretProtocol, setShowSecretProtocol] = useState(false);
            const [showDefconModal, setShowDefconModal] = useState(false);
            const [, setShieldClicks] = useState(0);
            const [showVictoryBlessing, setShowVictoryBlessing] = useState(false);

            const [completionTime, setCompletionTime] = useState(() => (saved && saved.completionTime) || '');
            const [groupNumber, setGroupNumber] = useState(() => (saved && saved.groupNumber) || '');
            const [groupError, setGroupError] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [exportSuccessMsg, setExportSuccessMsg] = useState(false);
            const [proof, setProof] = useState(null);

            const [search, setSearch] = useState('');
            const [poSearch, setPoSearch] = useState('');
            const [vendorSearch, setVendorSearch] = useState('');
            const [logSearch, setLogSearch] = useState('');
            const [ledgerSearch, setLedgerSearch] = useState('');

            const [unlockInput, setUnlockInput] = useState('');
            const [unlockError, setUnlockError] = useState(false);
            const [verifyingNode, setVerifyingNode] = useState(false);

            const t = dict[lang] || dict.en;
            const isGhost = ['404', '999', 'GHOST', 'EMP404'].includes((search || '').trim().toUpperCase());
            const isCoffeeLogSearch = ['COFFEE', 'ESPRESSO', 'COOKIE', '418', 'TEA', 'SNACK', '咖啡', '饼干'].includes((logSearch || '').trim().toUpperCase());
            const isPizzaLedgerSearch = ['PIZZA', 'COFFEE', 'STARBUCKS', 'COOKIE', 'SNACK', 'LUNCH', '披萨', '咖啡', '饼干'].includes((ledgerSearch || '').trim().toUpperCase());

            const allNodesUnlocked = unlockedNodes.logs && unlockedNodes.ledger && unlockedNodes.banking;
            const allPuzzlesSolved = solvedPuzzles.puzzle1 && solvedPuzzles.puzzle2 && solvedPuzzles.puzzle3 && solvedPuzzles.puzzle4;
            const nodesDone = ['logs', 'ledger', 'banking'].filter(k => unlockedNodes[k]).length;

            // Keep <html lang> in sync so CJK fonts / line-height / screen readers behave
            useEffect(() => {
                document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            }, [lang]);

            // Reset scroll to top when switching views
            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = 0;
            }, [activeTab, hubSubTab]);

            // Boot: info.txt + Supabase
            useEffect(() => {
                async function bootSystem() {
                    let dataLoaded = false;
                    try {
                        const res = await fetch(`./info.txt?v=${Date.now()}`, { cache: 'no-store' });
                        if (!res.ok) throw new Error('Could not load info.txt');
                        const parsed = parseInfoTxt(await res.text());
                        setAppData(parsed);
                        dataLoaded = true;

                        const fb1 = parsed.supabase.FALLBACK_NODE1_KEY || '';
                        const fb2 = parsed.supabase.FALLBACK_NODE2_KEY || '';
                        const fb3 = parsed.supabase.FALLBACK_NODE3_KEY || '';
                        setNodePasswords({
                            logs: fb1 ? [fb1] : [],
                            ledger: fb2 ? [fb2] : [],
                            banking: fb3 ? [fb3, fb3.replace(/\s+/g, '')] : []
                        });

                        if (parsed.overrideAnswers && Object.keys(parsed.overrideAnswers).length > 0) {
                            setOverrideCodes(prev => ({ ...prev, ...parsed.overrideAnswers }));
                        }

                        const sbUrl = parsed.supabase.SUPABASE_URL;
                        const sbKey = parsed.supabase.SUPABASE_ANON_KEY;
                        if (sbUrl && sbKey && !sbUrl.includes('your-project-id') && window.supabase) {
                            const client = window.supabase.createClient(sbUrl, sbKey);
                            setSbClient(client);

                            const { data: nodeData, error: nodeErr } = await client.from('sunrise_nodes').select('node_key, password');
                            if (!nodeErr && nodeData && nodeData.length > 0) {
                                const supaNodes = {};
                                nodeData.forEach(row => {
                                    if (row.node_key && row.password) supaNodes[row.node_key] = [row.password, row.password.replace(/\s+/g, '')];
                                });
                                setNodePasswords(prev => ({ ...prev, ...supaNodes }));
                                setSbConnected(true);
                            }

                            const { data: haltData, error: haltErr } = await client.from('sunrise_override_codes').select('puzzle_key, accepted_answers');
                            if (!haltErr && haltData && haltData.length > 0) {
                                const supaHalt = {};
                                haltData.forEach(row => {
                                    if (row.puzzle_key && row.accepted_answers) supaHalt[row.puzzle_key] = row.accepted_answers.split('|').map(s => s.trim()).filter(Boolean);
                                });
                                setOverrideCodes(prev => ({ ...prev, ...supaHalt }));
                                setSbConnected(true);
                            }
                        }
                    } catch (err) {
                        console.error("Error loading info.txt or Supabase:", err);
                        if (!dataLoaded) setBootError(true); // Supabase failure alone is non-fatal (falls back to info.txt)
                    } finally {
                        setLoadingInfo(false);
                    }
                }
                bootSystem();
            }, []);

            // Persist progress
            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        activeTab, hubSubTab, unlockedNodes, solvedPuzzles, puzzleInputs, lang,
                        nodeStrikeCount, nodeLockoutUntil, haltStrikes, haltLockoutUntil,
                        completionTime, groupNumber
                    }));
                } catch (e) {}
            }, [activeTab, hubSubTab, unlockedNodes, solvedPuzzles, puzzleInputs, lang, nodeStrikeCount, nodeLockoutUntil, haltStrikes, haltLockoutUntil, completionTime, groupNumber]);

            // Countdown timers
            useEffect(() => {
                const interval = setInterval(() => {
                    const now = Date.now();
                    setNodeLockoutTimer(nodeLockoutUntil > now ? Math.ceil((nodeLockoutUntil - now) / 1000) : 0);
                    setHaltLockoutTimer(haltLockoutUntil > now ? Math.ceil((haltLockoutUntil - now) / 1000) : 0);
                }, 250);
                return () => clearInterval(interval);
            }, [nodeLockoutUntil, haltLockoutUntil]);

            useEffect(() => {
                if (allPuzzlesSolved && !completionTime) setCompletionTime(formatUTC8Time(new Date()));
            }, [allPuzzlesSolved, completionTime]);

            // Free blob URL when the proof preview closes
            useEffect(() => () => { if (proof && proof.revoke) URL.revokeObjectURL(proof.url); }, [proof]);

            const getNextFreezeThreshold = (strikes) => {
                if (strikes < 5) return 5;
                if (strikes < 8) return 8;
                if (strikes < 10) return 10;
                if (strikes < 15) return 15;
                return Math.ceil((strikes + 1) / 5) * 5;
            };

            const applyHaltStrike = () => {
                const newStrikes = haltStrikes + 1;
                setHaltStrikes(newStrikes);
                let freezeSecs = 0;
                if (newStrikes === 5) freezeSecs = 30;
                else if (newStrikes === 8) freezeSecs = 60;
                else if (newStrikes === 10) freezeSecs = 120;
                else if (newStrikes === 15 || (newStrikes > 15 && newStrikes % 5 === 0)) freezeSecs = 300;
                if (freezeSecs > 0) {
                    setHaltLockoutUntil(Date.now() + freezeSecs * 1000);
                    setHaltLockoutTimer(freezeSecs);
                }
            };

            const go = (tab) => { setActiveTab(tab); setUnlockInput(''); };
            const toggleLang = () => setLang(lang === 'en' ? 'zh' : 'en');

            // Easter egg tap counters
            const handleSecretClick = () => setClickCount(prev => (prev + 1 >= 5 ? (setShowMinigame(true), 0) : prev + 1));
            const handleDummyRowClick = () => setRowClickCount(prev => (prev + 1 >= 3 ? (setShowMemo(true), 0) : prev + 1));
            const handleRootLogClick = () => setRootLogClickCount(prev => (prev + 1 >= 3 ? (setShowRootModal(true), 0) : prev + 1));
            const handleN3TitleClick = () => setN3TitleClicks(prev => (prev + 1 >= 3 ? (setShowSecretProtocol(s => !s), 0) : prev + 1));
            const handleShieldClick = () => setShieldClicks(prev => (prev + 1 >= 5 ? (setShowVictoryBlessing(true), 0) : prev + 1));

            // Node unlock
            const handleUnlock = async (e, nodeKey) => {
                e.preventDefault();
                if (nodeLockoutTimer > 0 || verifyingNode) return;

                setVerifyingNode(true);
                let expectedList = nodePasswords[nodeKey] || [];
                if (sbClient) {
                    try {
                        const { data, error } = await sbClient.from('sunrise_nodes').select('password').eq('node_key', nodeKey).maybeSingle();
                        if (!error && data && data.password) {
                            expectedList = [data.password, data.password.replace(/\s+/g, '')];
                            setSbConnected(true);
                        }
                    } catch (err) {}
                }
                setVerifyingNode(false);

                const cleanInput = (unlockInput || '').trim().toUpperCase().replace(/,/g, '');
                const noSpaceInput = cleanInput.replace(/\s+/g, '');
                const isMatch = expectedList.some(ans => {
                    const cleanAns = ans.toUpperCase().trim().replace(/,/g, '');
                    return cleanInput === cleanAns || noSpaceInput === cleanAns.replace(/\s+/g, '');
                });

                if (isMatch) {
                    setUnlockError(false);
                    setUnlockInput('');
                    setNodeStrikeCount(0); // a correct key clears earlier typos
                    setUnlockedNodes(prev => ({ ...prev, [nodeKey]: true }));
                    if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // dismiss mobile keyboard
                } else {

                    return allPuzzlesSolved ? renderHaltSolved() : renderHaltPuzzles();

                return null;

                    <nav className="glass tabbar mx-2 mb-2 grid shrink-0 grid-cols-5 gap-1 rounded-2xl px-1.5 pt-1.5 md:hidden" aria-label="Primary">
                        {navItems.map(item => {
                            const active = activeTab === item.k;
                            let cls = active ? 'bg-deloitte-green/15 text-deloitte-green' : 'text-slate-400 active:bg-slate-800/60';
                            if (item.critical) {
                                cls = item.locked
                                    ? (active ? 'bg-red-950/80 text-red-300' : 'text-red-400/70')
                                    : (active ? 'bg-red-600 text-white' : 'bg-red-950/60 text-red-300');
                            }
                            return (
                                <button key={item.k} type="button" onClick={() => go(item.k)} aria-current={active ? 'page' : undefined} aria-label={item.label} className={`relative flex min-h-[50px] min-w-0 flex-col items-center justify-center gap-1 rounded-xl px-0.5 transition-colors ${cls}`}>
                                    <span className="relative">
                                        <i className={`fa-solid ${item.icon} text-[15px]`}></i>
                                        {item.locked && <span className={`absolute -right-1.5 -top-1 h-1.5 w-1.5 rounded-full ${item.critical ? 'bg-red-500' : 'bg-amber-400'}`}></span>}
                                        {item.critical && !item.locked && !active && <span className="absolute -right-1.5 -top-1 h-1.5 w-1.5 animate-pulse rounded-full bg-red-500"></span>}
                                    </span>
                                    <span className={`w-full truncate text-center text-[10.5px] leading-none ${item.critical ? 'font-bold' : 'font-medium'}`}>{item.short}</span>
                                </button>
                            );
                        })}
                    </nav>
                </div>
            );
        }

        const rootContainer = document.getElementById('root');
        if (rootContainer) {
            ReactDOM.createRoot(rootContainer).render(<QuestView />);
        }
    </script>
</body>
</html>
