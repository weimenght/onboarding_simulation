        // info.txt PARSER

        function parseInfoTxt(text) {
            const result = {
                supabase: {}, game: {}, directory: [], securityInfra: [], changeTickets: [], eddWatchlist: [],
                purchaseOrders: [], vendors: [], logs: [], ledger: [], protocol: [], overrideAnswers: {}
            };
            let currentSection = '';
            const lines = (text || '').split(/\r?\n/);
            for (let rawLine of lines) {
                const line = rawLine.trim();
                if (!line || line.startsWith('#')) continue;
                if (line.startsWith('[') && line.endsWith(']')) { currentSection = line.slice(1, -1).trim().toUpperCase(); continue; }
                const parts = line.split('|').map(p => p.trim());
                switch (currentSection) {
                    case 'SUPABASE':
                    case 'GAME': {
                        const eqIdx = line.indexOf('=');
                        if (eqIdx !== -1) result[currentSection === 'GAME' ? 'game' : 'supabase'][line.slice(0, eqIdx).trim()] = line.slice(eqIdx + 1).trim();
                        break;
                    }
                    case 'DIRECTORY':
                        if (parts.length >= 6) result.directory.push({ id: parts[0], name: parts[1], dept: parts[2], role: parts[3], ext: parts[4], ip: parts[5] });
                        break;
                    case 'SECURITY_INFRA':
                        if (parts.length >= 3) result.securityInfra.push({ emp: parts[0], sys: parts[1], level: parts[2], highlight: (parts[3] || '').toLowerCase() === 'true' });
                        break;
                    case 'CHANGE_TICKETS':
                        if (parts.length >= 5) result.changeTickets.push({ id: parts[0], activity: parts[1], requester: parts[2], approver: parts[3], status: parts[4] });
                        break;
                    case 'EDD_WATCHLIST':
                        result.eddWatchlist.push(line);
                        break;
                    case 'PURCHASE_ORDERS':
                        if (parts.length >= 4) result.purchaseOrders.push({ po: parts[0], vendor: parts[1], project: parts[2], approver: parts[3] });
                        break;
                    case 'VENDORS':
                        if (parts.length >= 7) result.vendors.push({ id: parts[0], name: parts[1], country: parts[2], status: parts[3], risk: parts[4], bank: parts[5], currency: parts[6] });
                        break;
                    case 'LOGS':
                        if (parts.length >= 5) result.logs.push({ date: '2026-06-15', time: parts[0], event: parts[1], user: parts[2], status: parts[3], ticket: parts[4] });
                        break;
                    case 'LEDGER':
                        if (parts.length >= 8) result.ledger.push({ id: parts[0], date: parts[1], time: parts[2], vendor: parts[3], vendor_id: parts[4], amount: parts[5], approved: parts[6], status: parts[7] });
                        break;
                    case 'PROTOCOL':
                        if (parts.length >= 8) result.protocol.push({ tierKey: parts[0], cap: parts[1], jurKey: parts[2], channel: parts[3], anomalyKey: parts[4], code: parts[5], gateway: parts[6], hash: parts[7] });
                        break;
                    case 'OVERRIDE_ANSWERS':
                        if (parts.length >= 2) result.overrideAnswers[parts[0]] = parts.slice(1);
                        break;
                }
            }
            result.logs.sort((a, b) => (`${a.date} ${a.time}`).localeCompare(`${b.date} ${b.time}`));
            result.ledger.sort((a, b) => (`${a.date} ${a.time} ${a.id}`).localeCompare(`${b.date} ${b.time} ${b.id}`));
            return result;
        }

        function readGameConfig(game) {
            const g = game || {};
            const startMs = g.GAME_START ? Date.parse(g.GAME_START) : NaN;
            const minutes = parseInt(g.SETTLEMENT_MINUTES, 10);
            const cooldown = parseInt(g.ROLE_SWITCH_COOLDOWN, 10);
            return {
                session: (g.GAME_SESSION || 'default').slice(0, 40),
                startMs: Number.isFinite(startMs) ? startMs : null,
                limitSec: (Number.isFinite(minutes) && minutes > 0 ? minutes : 120) * 60,
                roleMode: (g.ROLE_MODE || 'on').toLowerCase() !== 'off',
                cooldownSec: Number.isFinite(cooldown) && cooldown >= 0 ? cooldown : 60
            };
        }

        function formatUTC8Time(date = new Date()) {
            try {
                const d = new Date(date);
                const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
                const nd = new Date(utc + (3600000 * 8));
                const pad = (n) => String(n).padStart(2, '0');
                return `${nd.getFullYear()}-${pad(nd.getMonth() + 1)}-${pad(nd.getDate())} ${pad(nd.getHours())}:${pad(nd.getMinutes())}:${pad(nd.getSeconds())} (UTC+8)`;
            } catch (e) {
                return new Date().toISOString().replace('T', ' ').substring(0, 19) + ' (UTC+8)';
            }
        }

        const formatClock = (sec) => {
            const s = Math.max(0, Math.floor(Math.abs(sec)));
            return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        };

        function generateSecurityToken(group, timeStr) {
            const raw = `${group || 'UNKNOWN'}_${timeStr}_SUNRISE_VOIDWIRE_2026`;
            let hash = 0;
            for (let i = 0; i < raw.length; i++) { hash = ((hash << 5) - hash) + raw.charCodeAt(i); hash |= 0; }
            return `SEC-${Math.abs(hash).toString(16).toUpperCase().padStart(8, '0')}-DU26`;
        }

        // "Group 7", "7", "第7组" → "GROUP 7" so teammates on different phones match on the leaderboard
        const normalizeGroup = (s) => {
            const raw = (s || '').trim();
            const m = raw.match(/\d+/);
            return m ? `GROUP ${parseInt(m[0], 10)}` : raw.toUpperCase().slice(0, 30);
        };

        const norm = (s) => (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

        function findEmployee(directory, input) {
            const n = norm(input);
            if (!n) return null;
            return directory.find(m => norm(m.name) === n) || directory.find(m => {
                const [first, ...rest] = m.name.split(/\s+/);
                const last = rest.join('');
                return norm(first + (last[0] || '')) === n || norm((first[0] || '') + last) === n;
            }) || null;
        }

        const isIOSDevice = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        function getClientId() {
            try {
                let id = localStorage.getItem('PROJECT_SUNRISE_CLIENT');
                if (!id) { id = Math.random().toString(36).slice(2, 10); localStorage.setItem('PROJECT_SUNRISE_CLIENT', id); }
                return id;
            } catch (e) { return 'anon'; }
        }

        function useMediaQuery(query) {
            const get = () => (typeof window !== 'undefined' && window.matchMedia) ? window.matchMedia(query).matches : false;
            const [matches, setMatches] = useState(get);
            useEffect(() => {
                if (!window.matchMedia) return;
                const mql = window.matchMedia(query);
                const handler = (e) => setMatches(e.matches);
                setMatches(mql.matches);
                if (mql.addEventListener) mql.addEventListener('change', handler); else mql.addListener(handler);
                return () => { if (mql.removeEventListener) mql.removeEventListener('change', handler); else mql.removeListener(handler); };
            }, [query]);
            return matches;
        }

        // ─────────────────────────────────────────────────────────────

        function SnakeGame({ onClose }) {
            const [snake, setSnake] = useState([[10, 10]]);
            const [food, setFood] = useState([15, 15]);
            const [dir, setDir] = useState([0, -1]);
            const [gameOver, setGameOver] = useState(false);
            const [score, setScore] = useState(0);
            const lastDirRef = useRef([0, -1]);
            const touchRef = useRef(null);

            const turn = useCallback((nd) => {
                const ld = lastDirRef.current;
                if (ld[0] + nd[0] === 0 && ld[1] + nd[1] === 0) return;
                setDir(nd);
            }, []);

            useEffect(() => {
                if (gameOver) return;
                const interval = setInterval(() => {
                    setSnake(prev => {
                        const head = prev[0];
                        const newHead = [head[0] + dir[0], head[1] + dir[1]];
                        lastDirRef.current = dir;
                        if (newHead[0] < 0 || newHead[0] >= 20 || newHead[1] < 0 || newHead[1] >= 20 ||
                            prev.some(s => s[0] === newHead[0] && s[1] === newHead[1])) {
                            setGameOver(true); return prev;
                        }
                        const next = [newHead, ...prev];
                        if (newHead[0] === food[0] && newHead[1] === food[1]) {
                            setScore(s => s + 10);
                            setFood([Math.floor(Math.random() * 20), Math.floor(Math.random() * 20)]);
                        } else {
                            next.pop();
                        }
                        return next;
                    });
                }, 120);
                return () => clearInterval(interval);
            }, [dir, food, gameOver]);

            useEffect(() => {
                const onKey = (e) => {
                    const map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
                    if (map[e.key]) { e.preventDefault(); turn(map[e.key]); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [turn]);

            const onTouchStart = (e) => { const p = e.touches[0]; touchRef.current = [p.clientX, p.clientY]; };
            const onTouchEnd = (e) => {
                if (!touchRef.current) return;
                const p = e.changedTouches[0];
                const dx = p.clientX - touchRef.current[0], dy = p.clientY - touchRef.current[1];
                touchRef.current = null;
                if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
                if (Math.abs(dx) > Math.abs(dy)) turn([dx > 0 ? 1 : -1, 0]); else turn([0, dy > 0 ? 1 : -1]);
            };

            const reset = () => { setSnake([[10, 10]]); setDir([0, -1]); lastDirRef.current = [0, -1]; setScore(0); setGameOver(false); };
            const padBtn = "bg-slate-900 active:bg-slate-800 border border-slate-700 h-12 w-12 rounded-xl flex items-center justify-center";

            return (
                <Modal onClose={onClose}>
                    <div className="glass max-h-full overflow-y-auto rounded-2xl border border-deloitte-green/60 p-4 sm:p-5 shadow-[0_0_40px_rgba(134,188,37,0.2)]">

                                </div>
                            )}
                        </div>

                                <div></div>
                                <button aria-label="Up" className={padBtn} onClick={() => turn([0, -1])}><i className="fa-solid fa-arrow-up text-deloitte-green"></i></button>
                                <div></div>
                                <button aria-label="Left" className={padBtn} onClick={() => turn([-1, 0])}><i className="fa-solid fa-arrow-left text-deloitte-green"></i></button>

                        <p className="caps mb-1 font-mono text-[11px] text-slate-500"><i className="fa-solid fa-unlock-keyhole mr-1"></i>{title}</p>

        function SecretsModal({ t, found, onClose }) {
            return (
                <Modal onClose={onClose}>
                    <div className="glass max-h-full w-full max-w-md overflow-y-auto rounded-2xl border border-amber-400/50 p-5">

                            <h3 className="caps font-mono text-xs font-bold text-amber-300"><i className="fa-solid fa-star mr-1.5"></i>{t.secretsTitle} · {found.length}/{SECRET_IDS.length}</h3>
                            <button onClick={onClose} aria-label={t.close} className="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white"><i className="fa-solid fa-xmark"></i></button>

                                        <span className={`mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full font-mono text-[11px] font-bold ${ok ? 'bg-amber-400 text-slate-950' : 'border border-slate-700 text-slate-500'}`}>

                                        <div className="min-w-0">

        function RoleSwitchModal({ t, role, cooldownSec, onPick, onClose }) {

                <Modal onClose={onClose}>
                    <div className="glass max-h-full w-full max-w-md overflow-y-auto rounded-2xl border border-slate-700 p-5">

                        <p className="mb-4 text-xs leading-relaxed text-amber-300"><i className="fa-solid fa-triangle-exclamation mr-1.5"></i>{fmt(t.switchRoleWarn, { s: cooldownSec })}</p>
                        <RolePicker t={t} value={pick} onChange={setPick} />
                        <div className="mt-4 flex gap-2">
                            <button onClick={onClose} className="flex-1 rounded-xl border border-slate-700 bg-slate-900 py-3 font-mono text-xs font-bold uppercase text-slate-300">{t.cancel}</button>
                            <button disabled={!pick || pick === role} onClick={() => onPick(pick)} className="flex-1 rounded-xl bg-deloitte-green py-3 font-mono text-xs font-bold uppercase text-slate-950 disabled:opacity-40">{t.confirmSwitch}</button>

        function RolePicker({ t, value, onChange }) {
            const roles = [
                { k: 'it', name: t.roleIt, desc: t.roleItDesc },

            return (
                <div className="grid grid-cols-1 gap-2" role="radiogroup">
                    {roles.map(r => {
                        const meta = ROLE_META[r.k];

                        return (

                                className={`flex items-center gap-3 rounded-xl border p-3 text-left transition-colors ${active ? meta.ring : 'border-slate-800 bg-slate-950/60 hover:border-slate-600'}`}>
                                <span className={`flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border ${active ? meta.ring : 'border-slate-800 bg-slate-900'}`}>
                                    <i className={`fa-solid ${meta.icon} ${meta.color}`}></i>

        function ProofModal({ proof, onClose, t }) {
            const [canShare, setCanShare] = useState(false);
            useEffect(() => {
                try {
                    if (proof.blob && navigator.canShare && window.File) {
                        const f = new File([proof.blob], proof.fileName, { type: 'image/jpeg' });
                        setCanShare(navigator.canShare({ files: [f] }));
                    }
                } catch (e) { setCanShare(false); }
            }, [proof]);
            const share = async () => {
                try {
                    const f = new File([proof.blob], proof.fileName, { type: 'image/jpeg' });
                    await navigator.share({ files: [f], title: 'Project Sunrise' });
                } catch (e) { }
            };
            return (
                <Modal onClose={onClose}>
                    <div className="glass flex max-h-full w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-deloitte-green/50">
                        <div className="flex items-center justify-between gap-3 border-b border-slate-800 px-4 py-3">
                            <h3 className="caps font-mono text-xs font-bold text-deloitte-green"><i className="fa-solid fa-certificate mr-1.5"></i>{t.proofTitle}</h3>
                            <button onClick={onClose} aria-label={t.close} className="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <div className="min-h-0 flex-1 overflow-y-auto p-4">
                            <img src={proof.url} alt={t.proofTitle} className="mx-auto h-auto w-full rounded-lg border border-slate-800" style={{ WebkitTouchCallout: 'default' }} />
                            <p className="mt-3 text-center text-xs leading-relaxed text-slate-400">{isIOSDevice() ? t.proofHintIOS : t.proofHintOther}</p>
                        </div>
                        <div className="tabbar flex flex-col gap-2 border-t border-slate-800 px-4 pt-3 sm:flex-row">
                            {canShare && (
                                <button onClick={share} className="flex-1 rounded-xl bg-deloitte-green py-3 font-mono text-xs font-bold uppercase tracking-wider text-slate-950 hover:bg-lime-400">
                                    <i className="fa-solid fa-share-from-square mr-1.5"></i>{t.shareBtn}
                                </button>
                            )}
                            <a href={proof.url} download={proof.fileName} className={`flex-1 rounded-xl py-3 text-center font-mono text-xs font-bold uppercase tracking-wider ${canShare ? 'border border-slate-700 bg-slate-900 text-slate-200 hover:bg-slate-800' : 'bg-deloitte-green text-slate-950 hover:bg-lime-400'}`}>
                                <i className="fa-solid fa-download mr-1.5"></i>{t.downloadBtn}
                            </a>
                        </div>
                    </div>
                </Modal>
            );
        }

        function loadSavedState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        // ─────────────────────────────────────────────────────────────
        // MAIN APP
        // ─────────────────────────────────────────────────────────────
        function QuestView() {
            const [saved] = useState(() => loadSavedState() || {});
            const isDesktop = useMediaQuery('(min-width: 768px)');
            const scrollRef = useRef(null);
            const tapRef = useRef({});
            const clientId = useRef(getClientId()).current;

            const [appData, setAppData] = useState(null);
            const [loadingInfo, setLoadingInfo] = useState(true);
            const [bootError, setBootError] = useState(false);
            const [sbClient, setSbClient] = useState(null);
            const [sbConnected, setSbConnected] = useState(false);
            const [nodePasswords, setNodePasswords] = useState({ logs: [], ledger: [], banking: [] });
            const [overrideCodes, setOverrideCodes] = useState({ puzzle1: [], puzzle2: [], puzzle3: [] });
            const [verifyingPuzzleKey, setVerifyingPuzzleKey] = useState(null);

            const [lang, setLang] = useState(saved.lang || 'en');
            const [registered, setRegistered] = useState(!!saved.registered);
            const [groupNumber, setGroupNumber] = useState(saved.groupNumber || '');
            const [role, setRole] = useState(saved.role || '');
            const [startedAt, setStartedAt] = useState(saved.startedAt || null);
            const [finishedAt, setFinishedAt] = useState(saved.finishedAt || null);
            const [roleCooldownUntil, setRoleCooldownUntil] = useState(saved.roleCooldownUntil || 0);
            const [secrets, setSecrets] = useState(Array.isArray(saved.secrets) ? saved.secrets : []);
            const secretsRef = useRef(secrets);
            const [regError, setRegError] = useState('');

            const [activeTab, setActiveTab] = useState(saved.activeTab || 'hub');
            const [hubSubTab, setHubSubTab] = useState(saved.hubSubTab || 'org');
            const [unlockedNodes, setUnlockedNodes] = useState(saved.unlockedNodes || { logs: false, ledger: false, banking: false });
            const [solvedPuzzles, setSolvedPuzzles] = useState(saved.solvedPuzzles || { puzzle1: false, puzzle2: false, puzzle3: false });
            const [puzzleInputs, setPuzzleInputs] = useState(saved.puzzleInputs || { puzzle1: '', puzzle2: '', puzzle3: '' });
            const [puzzleErrors, setPuzzleErrors] = useState({ puzzle1: false, puzzle2: false, puzzle3: false });

            const [nodeStrikeCount, setNodeStrikeCount] = useState(typeof saved.nodeStrikeCount === 'number' ? saved.nodeStrikeCount : 0);
            const [nodeLockoutUntil, setNodeLockoutUntil] = useState(typeof saved.nodeLockoutUntil === 'number' ? saved.nodeLockoutUntil : 0);
            const [haltStrikes, setHaltStrikes] = useState(typeof saved.haltStrikes === 'number' ? saved.haltStrikes : 0);
            const [haltLockoutUntil, setHaltLockoutUntil] = useState(typeof saved.haltLockoutUntil === 'number' ? saved.haltLockoutUntil : 0);
            const [now, setNow] = useState(Date.now());

            const [warningToast, setWarningToast] = useState('');
            const [easterEggToast, setEasterEggToast] = useState('');
            const [secretToast, setSecretToast] = useState(null);
            const [beatQueue, setBeatQueue] = useState([]);
            const [showSecrets, setShowSecrets] = useState(false);
            const [showRoleSwitch, setShowRoleSwitch] = useState(false);

            const [showMinigame, setShowMinigame] = useState(false);
            const [showMemo, setShowMemo] = useState(false);
            const [showRootModal, setShowRootModal] = useState(false);
            const [showSecretProtocol, setShowSecretProtocol] = useState(false);
            const [showDefconModal, setShowDefconModal] = useState(false);
            const [showVictoryBlessing, setShowVictoryBlessing] = useState(false);

            const [completionTime, setCompletionTime] = useState(saved.completionTime || '');
            const [isExporting, setIsExporting] = useState(false);
            const [exportSuccessMsg, setExportSuccessMsg] = useState(false);
            const [proof, setProof] = useState(null);

            const [search, setSearch] = useState('');
            const [poSearch, setPoSearch] = useState('');
            const [vendorSearch, setVendorSearch] = useState('');
            const [logSearch, setLogSearch] = useState('');
            const [ledgerSearch, setLedgerSearch] = useState('');

            const [unlockInput, setUnlockInput] = useState('');
            const [unlockError, setUnlockError] = useState(false);
            const [verifyingNode, setVerifyingNode] = useState(false);

            const t = dict[lang] || dict.en;
            const config = readGameConfig(appData && appData.game);
            const group = normalizeGroup(groupNumber);

            const nodeLockoutTimer = Math.max(0, Math.ceil((nodeLockoutUntil - now) / 1000));
            const haltLockoutTimer = Math.max(0, Math.ceil((haltLockoutUntil - now) / 1000));
            const cooldownLeft = Math.max(0, Math.ceil((roleCooldownUntil - now) / 1000));

            const isGhost = ['404', '999', 'GHOST', 'EMP404'].includes((search || '').trim().toUpperCase());
            const isCoffeeLogSearch = ['COFFEE', 'ESPRESSO', 'COOKIE', '418', 'TEA', 'SNACK', '咖啡', '饼干'].includes((logSearch || '').trim().toUpperCase());
            const isPizzaLedgerSearch = ['PIZZA', 'COFFEE', 'STARBUCKS', 'COOKIE', 'SNACK', 'LUNCH', 'DINNER', '披萨', '咖啡', '饼干', '晚饭'].includes((ledgerSearch || '').trim().toUpperCase());

            const allNodesUnlocked = NODE_KEYS.every(k => unlockedNodes[k]);
            const allPuzzlesSolved = PUZZLE_KEYS.every(k => solvedPuzzles[k]);
            const nodesDone = NODE_KEYS.filter(k => unlockedNodes[k]).length;

            const canSee = (section) => !config.roleMode || (cooldownLeft === 0 && !!role && (ROLE_ACCESS[role] || []).includes(section));

            // Clock: shared start (GAME_START) or this team's first join
            const getStartMs = () => config.startMs || startedAt || now;
            const elapsedSecAt = (ts) => Math.max(0, Math.floor((ts - getStartMs()) / 1000));
            const clock = {
                finished: !!finishedAt,
                elapsed: elapsedSecAt(finishedAt || now),
                remaining: config.limitSec - elapsedSecAt(finishedAt || now)
            };

            // ─── Live event feed (Supabase 'sunrise_events') ───
            const logEvent = (type, detail = '', extra = {}) => {
                if (!sbClient || !group) return;
                try {
                    sbClient.from('sunrise_events').insert({
                        session: config.session, group_name: group, role: role || null,
                        event_type: type, detail: String(detail || '').slice(0, 60),
                        elapsed_seconds: extra.elapsed !== undefined ? extra.elapsed : elapsedSecAt(Date.now()),
                        secrets: extra.secrets !== undefined ? extra.secrets : secretsRef.current.length,
                        client_id: clientId
                    }).then(() => {}, () => {});
                } catch (e) {}
            };

            const foundSecret = (id) => {
                if (secretsRef.current.includes(id)) return;
                const next = [...secretsRef.current, id];
                secretsRef.current = next;
                setSecrets(next);
                setSecretToast({ id, count: next.length });
                setTimeout(() => setSecretToast(null), 3500);
                logEvent('secret', id, { secrets: next.length });
            };

            useEffect(() => { document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'; }, [lang]);
            useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [activeTab, hubSubTab]);
            useEffect(() => { const i = setInterval(() => setNow(Date.now()), 500); return () => clearInterval(i); }, []);

            // Secret triggers that come from searches
            useEffect(() => { if (isGhost) foundSecret('ghost'); }, [isGhost]);
            useEffect(() => { if (isCoffeeLogSearch) foundSecret('coffee'); }, [isCoffeeLogSearch]);
            useEffect(() => { if (isPizzaLedgerSearch) foundSecret('pizza'); }, [isPizzaLedgerSearch]);

            // Boot: info.txt + Supabase
            useEffect(() => {
                async function bootSystem() {
                    let dataLoaded = false;
                    try {
                        const res = await fetch(`./info.txt?v=${Date.now()}`, { cache: 'no-store' });
                        if (!res.ok) throw new Error('Could not load info.txt');
                        const parsed = parseInfoTxt(await res.text());
                        setAppData(parsed);
                        dataLoaded = true;

                        const fb1 = parsed.supabase.FALLBACK_NODE1_KEY || '';
                        const fb2 = parsed.supabase.FALLBACK_NODE2_KEY || '';
                        const fb3 = parsed.supabase.FALLBACK_NODE3_KEY || '';
                        setNodePasswords({ logs: fb1 ? [fb1] : [], ledger: fb2 ? [fb2] : [], banking: fb3 ? [fb3, fb3.replace(/\s+/g, '')] : [] });
                        if (parsed.overrideAnswers && Object.keys(parsed.overrideAnswers).length > 0) {
                            setOverrideCodes(prev => ({ ...prev, ...parsed.overrideAnswers }));
                        }

                        const sbUrl = parsed.supabase.SUPABASE_URL;
                        const sbKey = parsed.supabase.SUPABASE_ANON_KEY;
                        if (sbUrl && sbKey && !sbUrl.includes('your-project-id') && window.supabase) {
                            const client = window.supabase.createClient(sbUrl, sbKey);
                            setSbClient(client);
                            const { data: nodeData, error: nodeErr } = await client.from('sunrise_nodes').select('node_key, password');
                            if (!nodeErr && nodeData && nodeData.length > 0) {
                                const supaNodes = {};
                                nodeData.forEach(row => { if (row.node_key && row.password) supaNodes[row.node_key] = [row.password, row.password.replace(/\s+/g, '')]; });
                                setNodePasswords(prev => ({ ...prev, ...supaNodes }));
                                setSbConnected(true);
                            }
                            const { data: haltData, error: haltErr } = await client.from('sunrise_override_codes').select('puzzle_key, accepted_answers');
                            if (!haltErr && haltData && haltData.length > 0) {
                                const supaHalt = {};
                                haltData.forEach(row => { if (row.puzzle_key && row.accepted_answers) supaHalt[row.puzzle_key] = row.accepted_answers.split('|').map(s => s.trim()).filter(Boolean); });
                                setOverrideCodes(prev => ({ ...prev, ...supaHalt }));
                                setSbConnected(true);
                            }
                        }
                    } catch (err) {
                        console.error("Error loading info.txt or Supabase:", err);
                        if (!dataLoaded) setBootError(true);
                    } finally {
                        setLoadingInfo(false);
                    }
                }
                bootSystem();
            }, []);

            // Without GAME_START, share the team's clock: earliest 'join' event for this group wins
            useEffect(() => {
                if (!registered || !sbClient || !group || !appData || config.startMs) return;
                (async () => {
                    try {
                        const { data, error } = await sbClient.from('sunrise_events').select('created_at')
                            .eq('session', config.session).eq('group_name', group).eq('event_type', 'join')
                            .order('created_at', { ascending: true }).limit(1);
                        if (!error && data && data[0]) {
                            const first = Date.parse(data[0].created_at);
                            if (Number.isFinite(first)) setStartedAt(prev => (prev ? Math.min(prev, first) : first));
                        }
                    } catch (e) {}
                })();
            }, [registered, sbClient, group, appData]);

            // Persist progress
            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        lang, registered, groupNumber, role, startedAt, finishedAt, roleCooldownUntil, secrets,
                        activeTab, hubSubTab, unlockedNodes, solvedPuzzles, puzzleInputs,
                        nodeStrikeCount, nodeLockoutUntil, haltStrikes, haltLockoutUntil, completionTime
                    }));
                } catch (e) {}
            }, [lang, registered, groupNumber, role, startedAt, finishedAt, roleCooldownUntil, secrets, activeTab, hubSubTab, unlockedNodes, solvedPuzzles, puzzleInputs, nodeStrikeCount, nodeLockoutUntil, haltStrikes, haltLockoutUntil, completionTime]);

            // Finish: freeze the clock, stamp the time, tell the leaderboard
            useEffect(() => {
                if (allPuzzlesSolved && !finishedAt && appData) {
                    const ts = Date.now();
                    setFinishedAt(ts);
                    if (!completionTime) setCompletionTime(formatUTC8Time(new Date(ts)));
                    logEvent('finish', '', { elapsed: elapsedSecAt(ts) });
                }
            }, [allPuzzlesSolved, finishedAt, appData]);

            useEffect(() => () => { if (proof && proof.revoke) URL.revokeObjectURL(proof.url); }, [proof]);

            const getNextFreezeThreshold = (strikes) => {
                if (strikes < 5) return 5;
                if (strikes < 8) return 8;
                if (strikes < 10) return 10;
                if (strikes < 15) return 15;
                return Math.ceil((strikes + 1) / 5) * 5;
            };

            const applyHaltStrike = () => {
                const newStrikes = haltStrikes + 1;
                setHaltStrikes(newStrikes);
                let freezeSecs = 0;
                if (newStrikes === 5) freezeSecs = 30;
                else if (newStrikes === 8) freezeSecs = 60;
                else if (newStrikes === 10) freezeSecs = 120;
                else if (newStrikes === 15 || (newStrikes > 15 && newStrikes % 5 === 0)) freezeSecs = 300;
                if (freezeSecs > 0) setHaltLockoutUntil(Date.now() + freezeSecs * 1000);
            };

            const go = (tab) => { setActiveTab(tab); setUnlockInput(''); };
            const toggleLang = () => setLang(lang === 'en' ? 'zh' : 'en');

            // Hidden multi-tap counters
            const tap = (key, needed, fn) => {
                const c = (tapRef.current[key] || 0) + 1;
                if (c >= needed) { tapRef.current[key] = 0; fn(); } else { tapRef.current[key] = c; }
            };
            const handleSecretClick = () => tap('logo', 5, () => { setShowMinigame(true); foundSecret('shell'); });
            const handleDummyRowClick = () => tap('memo', 3, () => { setShowMemo(true); foundSecret('memo'); });
            const handleRootLogClick = () => tap('root', 3, () => { setShowRootModal(true); foundSecret('oven'); });
            const handleN3TitleClick = () => tap('tier', 3, () => { setShowSecretProtocol(s => !s); foundSecret('tier'); });
            const handleShieldClick = () => tap('shield', 5, () => setShowVictoryBlessing(true));

            // ─── Registration ───
            const startMission = (e) => {
                e.preventDefault();
                if (!groupNumber.trim()) { setRegError(t.groupNumRequired); return; }
                if (config.roleMode && !role) { setRegError(t.roleRequired); return; }
                setRegError('');
                const ts = Date.now();
                if (!startedAt) setStartedAt(ts);
                setRegistered(true);
                if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                if (sbClient) {
                    try {
                        sbClient.from('sunrise_events').insert({
                            session: config.session, group_name: normalizeGroup(groupNumber), role: role || null,
                            event_type: 'join', detail: '', elapsed_seconds: 0, secrets: secretsRef.current.length, client_id: clientId
                        }).then(() => {}, () => {});
                    } catch (err) {}
                }
            };

            const switchRole = (r) => {
                setRole(r);
                setRoleCooldownUntil(Date.now() + config.cooldownSec * 1000);
                setShowRoleSwitch(false);
            };

            // ─── Node unlock ───
            const handleUnlock = async (e, nodeKey) => {
                e.preventDefault();
                if (nodeLockoutTimer > 0 || verifyingNode) return;
                setVerifyingNode(true);
                let expectedList = nodePasswords[nodeKey] || [];
                if (sbClient) {
                    try {
                        const { data, error } = await sbClient.from('sunrise_nodes').select('password').eq('node_key', nodeKey).maybeSingle();
                        if (!error && data && data.password) { expectedList = [data.password, data.password.replace(/\s+/g, '')]; setSbConnected(true); }
                    } catch (err) {}
                }
                setVerifyingNode(false);

                const cleanInput = (unlockInput || '').trim().toUpperCase().replace(/,/g, '');
                const noSpaceInput = cleanInput.replace(/\s+/g, '');
                const isMatch = expectedList.some(ans => {
                    const cleanAns = ans.toUpperCase().trim().replace(/,/g, '');
                    return cleanInput === cleanAns || noSpaceInput === cleanAns.replace(/\s+/g, '');
                });

                if (isMatch) {
                    setUnlockError(false);
                    setUnlockInput('');
                    setNodeStrikeCount(0);
                    const next = { ...unlockedNodes, [nodeKey]: true };
                    setUnlockedNodes(next);
                    setBeatQueue(q => [...q, nodeKey, ...(NODE_KEYS.every(k => next[k]) ? ['all'] : [])]);
                    logEvent('node', nodeKey);
                    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

            const renderHaltLocked = () => (

                    </div>
                    {haltLockoutTimer > 0 && (

                            <div className="caps mb-1 font-mono text-sm font-bold text-red-400"><i className="fa-solid fa-fire mr-1.5"></i>{t.lockoutTitle} · {t.strikeCountLabel} {haltStrikes}</div>
                            <p className="mb-2 text-xs text-slate-300">{t.lockoutDesc}</p>
                            <div className="font-mono text-3xl font-bold tabular-nums text-red-400">{haltLockoutTimer}s</div>
                        </div>
                    )}
                    <div className="grid grid-cols-1 gap-3 md:grid-cols-3">
                        {puzzles.map((puz, idx) => {
                            const isSolved = solvedPuzzles[puz.k];
                            const hasError = puzzleErrors[puz.k];
                            const isVerifyingThis = verifyingPuzzleKey === puz.k;
                            const disabled = haltLockoutTimer > 0 || isVerifyingThis;
                            return (
                                <div key={puz.k} className={`panel flex flex-col justify-between gap-4 rounded-2xl p-4 ${isSolved ? '!border-deloitte-green bg-deloitte-green/5' : ''}`}>

                                    {isSolved ? (

                                    ) : (
                                        <form className="flex gap-2" onSubmit={(e) => { e.preventDefault(); handleVerifyPuzzle(puz.k); }}>
                                            <input type="text" aria-label={puz.title} placeholder={t.enter} value={puzzleInputs[puz.k] || ''} disabled={disabled}
                                                onChange={(e) => setPuzzleInputs(prev => ({ ...prev, [puz.k]: e.target.value }))}
                                                autoComplete="off" autoCorrect="off" autoCapitalize={puz.cap} spellCheck={false}
                                                className={`field min-w-0 flex-1 rounded-xl p-2.5 text-center font-mono text-sm uppercase ${hasError ? '!border-red-500 text-red-400' : ''}`} />

                                                {isVerifyingThis ? <i className="fa-solid fa-circle-notch fa-spin"></i> : t.verifyBtn}
                                            </button>
                                        </form>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>

            const renderNode = (nodeKey, title, hint, renderFn) => {
                if (!unlockedNodes[nodeKey]) return renderUnlock(title, hint, nodeKey);
                if (!canSee(NODE_SECTION[nodeKey])) return renderRestrictedNode(nodeKey, title);
                return renderFn();
            };

            const renderContent = () => {
                if (activeTab === 'hub') {
                    if (hubSubTab === 'security') return renderSecurity();
                    if (hubSubTab === 'vendor') return renderVendors();
                    return renderDirectory();
                }
                if (activeTab === 'logs') return renderNode('logs', t.n1Title, t.n1Hint, renderLogs);
                if (activeTab === 'ledger') return renderNode('ledger', t.n2Title, t.n2Hint, renderLedger);
                if (activeTab === 'banking') return renderNode('banking', t.n3Title, t.n3Hint, renderProtocol);
                if (activeTab === 'mystery') {
                    if (!allNodesUnlocked) return renderHaltLocked();
                    return allPuzzlesSolved ? renderHaltSolved() : renderHaltPuzzles();
                }
                return null;
            };

            const innerScrollView = isDesktop && (
                (activeTab === 'logs' && unlockedNodes.logs && canSee('logs')) ||
                (activeTab === 'ledger' && unlockedNodes.ledger && canSee('ledger'))
            );

            const sideItemCls = (item, active) => {
                if (item.critical) {
                    if (item.locked) return active ? 'bg-red-950/80 text-red-300 border-red-500/60' : 'bg-slate-900/80 text-red-400/70 border-red-900/50 hover:border-red-500/50';
                    return active ? 'bg-red-600 text-white border-red-400 shadow-[0_0_20px_rgba(220,38,38,0.45)]' : 'bg-red-950/70 text-red-300 border-red-500 hover:bg-red-600 hover:text-white';

                <button type="button" onClick={() => setShowRoleSwitch(true)} aria-label={`${t.yourRole}: ${roleName(t, role)}`} className={`flex items-center gap-1.5 rounded-lg border font-mono font-bold ${roleMeta.ring} ${cls}`}>
                    <i className={`fa-solid ${cooldownLeft > 0 ? 'fa-hourglass-half' : roleMeta.icon} ${roleMeta.color}`}></i>
                    <span className="hidden sm:inline">{cooldownLeft > 0 ? `${cooldownLeft}s` : roleName(t, role)}</span>
                </button>
            );
            const secretsButton = (cls) => (
                <button type="button" onClick={() => setShowSecrets(true)} aria-label={`${t.secretsLabel} ${secrets.length}/${SECRET_IDS.length}`} className={`flex items-center gap-1.5 rounded-lg border border-amber-500/40 bg-amber-500/10 font-mono font-bold text-amber-300 ${cls}`}>
                    <i className="fa-solid fa-star text-[10px]"></i>{secrets.length}/{SECRET_IDS.length}
                </button>
            );

            return (
                <div className="shell relative z-10 mx-auto flex h-full w-full max-w-[1600px] flex-col md:flex-row md:gap-4">
                    {showMinigame && <SnakeGame onClose={() => setShowMinigame(false)} />}
                    {showMemo && <CorruptedMemoModal onClose={() => setShowMemo(false)} t={t} />}
                    {showRootModal && <RootInterceptModal onClose={() => setShowRootModal(false)} t={t} />}
                    {showDefconModal && <DefconModal onClose={() => setShowDefconModal(false)} t={t} />}
                    {showSecrets && <SecretsModal t={t} found={secrets} onClose={() => setShowSecrets(false)} />}
                    {showRoleSwitch && <RoleSwitchModal t={t} role={role} cooldownSec={config.cooldownSec} onPick={switchRole} onClose={() => setShowRoleSwitch(false)} />}
                    {beatQueue.length > 0 && <BeatModal key={beatQueue[0] + beatQueue.length} beat={beatQueue[0]} t={t} role={role} roleMode={config.roleMode} onContinue={closeBeat} />}
                    {proof && <ProofModal proof={proof} t={t} onClose={() => setProof(null)} />}

                    {secretToast && (
                        <div className="toast-in fixed left-1/2 z-[60] flex items-center gap-2 rounded-full border border-amber-400 bg-slate-950/95 px-4 py-2 font-mono text-xs font-bold text-amber-300 shadow-[0_0_25px_rgba(251,191,36,0.3)]" style={{ top: 'calc(var(--safe-t) + 12px)' }} role="status">
                            <i className="fa-solid fa-star"></i>{t.secretFound} · {secretToast.count}/{SECRET_IDS.length}
                        </div>
                    )}

                    {/* ── Desktop sidebar ── */}
                    <aside className="glass hidden w-64 shrink-0 flex-col gap-1.5 rounded-2xl p-4 shadow-2xl md:flex">
                        <div className="mb-3 flex items-center justify-between border-b border-slate-800/80 pb-4">
                            <div className="no-select flex cursor-pointer items-center gap-2.5" onClick={handleSecretClick}>
                                <div className="flex h-8 w-8 items-center justify-center rounded-lg border border-deloitte-green/50 bg-deloitte-green/15 text-deloitte-green"><i className="fa-solid fa-terminal text-sm"></i></div>
                                <div>
                                    <h1 className="caps text-sm font-bold leading-none text-white">{t.projectSunrise}</h1>
                                    <span className="font-mono text-[10px] text-deloitte-green">{group}</span>
                                </div>
                            </div>
                            <button onClick={toggleLang} className="rounded-lg border border-slate-700 bg-slate-900 px-2.5 py-1 font-mono text-[11px] font-bold text-slate-200 transition-colors hover:bg-slate-800">{lang === 'en' ? '中文' : 'EN'}</button>
                        </div>
                        {navItems.map((item) => {
                            const active = activeTab === item.k;
                            return (
                                <React.Fragment key={item.k}>
                                    {item.k === 'logs' && <div className="caps mb-0.5 mt-3 px-2 font-mono text-[10px] font-bold text-slate-500">{t.encryptedNodes}</div>}
                                    {item.critical && <div className="flex-grow"></div>}
                                    <button type="button" onClick={() => go(item.k)} aria-current={active ? 'page' : undefined} className={`flex w-full items-center justify-between gap-3 rounded-xl border px-3.5 py-2.5 text-[13px] font-medium transition-colors ${sideItemCls(item, active)}`}>
                                        <span className="flex min-w-0 items-center gap-3">
                                            <i className={`fa-solid ${item.icon} w-4 text-center text-sm`}></i>
                                            <span className={`truncate ${item.critical ? 'caps font-mono font-bold' : ''}`}>{item.label}</span>
                                        </span>
                                        {item.locked && <i className="fa-solid fa-lock text-[10px] opacity-60"></i>}
                                        {!item.locked && !item.critical && active && <span className="h-1.5 w-1.5 rounded-full bg-deloitte-green"></span>}
                                    </button>
                                    {item.k === 'hub' && (
                                        <div className="my-0.5 ml-3 flex flex-col gap-1 border-l border-slate-800/80 pl-3">
                                            {hubTabs.map(sub => {
                                                const isSubActive = activeTab === 'hub' && hubSubTab === sub.k;
                                                return (
                                                    <button key={sub.k} type="button" onClick={() => { go('hub'); setHubSubTab(sub.k); }} className={`flex items-center gap-2.5 rounded-lg px-3 py-2 text-left text-xs font-medium transition-colors ${isSubActive ? 'bg-deloitte-green/10 font-semibold text-deloitte-green' : 'text-slate-400 hover:bg-slate-900/50 hover:text-slate-200'}`}>
                                                        <i className={`fa-solid ${sub.icon} w-4 text-center text-[11px]`}></i><span>{sub.l}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}
                                </React.Fragment>
                            );
                        })}
                    </aside>

                    {/* ── Main column ── */}
                    <div className="flex min-h-0 min-w-0 flex-1 flex-col">
                        {/* Mobile app bar: logo (hidden game) · clock · role · secrets · language */}
                        <header className="glass mx-2 mt-2 flex shrink-0 items-center justify-between gap-1.5 rounded-2xl px-2.5 py-2 md:hidden">
                            <div className="flex min-w-0 items-center gap-1.5">
                                <button type="button" onClick={handleSecretClick} aria-label={t.projectSunrise} className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-deloitte-green/50 bg-deloitte-green/15 text-deloitte-green">
                                    <i className="fa-solid fa-terminal text-[11px]"></i>
                                </button>
                                <ClockChip t={t} clock={clock} />
                            </div>
                            <div className="flex shrink-0 items-center gap-1.5">
                                {roleButton('h-8 px-2 text-[11px]')}
                                {secretsButton('h-8 px-2 text-[11px]')}
                                <button onClick={toggleLang} className="h-8 rounded-lg border border-slate-700 bg-slate-900 px-2 font-mono text-[11px] font-bold text-white">{lang === 'en' ? '中文' : 'EN'}</button>
                            </div>
                        </header>

                        {/* Desktop telemetry bar */}
                        <div className="glass mb-3 hidden shrink-0 items-center justify-between gap-3 rounded-2xl px-4 py-2 md:flex">
                            <div className="flex min-w-0 items-center gap-2">
                                {nodeChips.map(obj => {
                                    const ok = unlockedNodes[obj.k];
                                    return (
                                        <button key={obj.k} onClick={() => go(obj.k)} className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1 font-mono text-[11px] font-bold transition-colors ${ok ? 'border-deloitte-green/50 bg-deloitte-green/15 text-deloitte-green' : 'border-slate-800 bg-slate-950/90 text-slate-500 hover:border-slate-700'}`}>
                                            <i className={`fa-solid ${ok ? 'fa-unlock-keyhole' : 'fa-lock'} text-[10px]`}></i>{obj.l}
                                        </button>
                                    );
                                })}
                            </div>
                            <div className="flex shrink-0 items-center gap-2">
                                {roleButton('h-9 px-3 text-xs')}
                                {secretsButton('h-9 px-3 text-xs')}
                                <ClockChip t={t} clock={clock} size="lg" />
                            </div>
                        </div>

                        {/* Hub segmented control */}
                        {activeTab === 'hub' && (
                            <div className="mx-2 mt-2 grid shrink-0 grid-cols-3 gap-1 rounded-2xl border border-slate-800/90 bg-slate-950/90 p-1 md:mx-0 md:mb-3 md:mt-0">
                                {hubTabs.map(sub => {
                                    const active = hubSubTab === sub.k;
                                    return (
                                        <button key={sub.k} type="button" onClick={() => setHubSubTab(sub.k)} aria-pressed={active} className={`flex min-h-[40px] min-w-0 items-center justify-center gap-1.5 rounded-xl px-1.5 text-xs font-bold transition-colors ${active ? 'bg-deloitte-green text-slate-950' : 'text-slate-400 hover:bg-slate-900/60 hover:text-white'}`}>
                                            <i className={`fa-solid ${sub.icon} text-[11px]`}></i><span className="truncate">{sub.l}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        )}

                        <main ref={scrollRef} className={`scroll-area relative min-h-0 flex-1 px-3 pb-4 pt-3 md:px-0 md:pb-0 md:pt-0 ${innerScrollView ? 'overflow-hidden' : 'overflow-y-auto md:pr-1'}`}>
                            {renderContent()}
                        </main>
                    </div>

                    {/* ── Mobile bottom tab bar ── */}
                    <nav className="glass tabbar mx-2 mb-2 grid shrink-0 grid-cols-5 gap-1 rounded-2xl px-1.5 pt-1.5 md:hidden" aria-label="Primary">
                        {navItems.map(item => {
                            const active = activeTab === item.k;
                            let cls = active ? 'bg-deloitte-green/15 text-deloitte-green' : 'text-slate-400 active:bg-slate-800/60';
                            if (item.critical) {
                                cls = item.locked ? (active ? 'bg-red-950/80 text-red-300' : 'text-red-400/70') : (active ? 'bg-red-600 text-white' : 'bg-red-950/60 text-red-300');
                            }
                            return (
                                <button key={item.k} type="button" onClick={() => go(item.k)} aria-current={active ? 'page' : undefined} aria-label={item.label} className={`relative flex min-h-[50px] min-w-0 flex-col items-center justify-center gap-1 rounded-xl px-0.5 transition-colors ${cls}`}>
                                    <span className="relative">
                                        <i className={`fa-solid ${item.icon} text-[15px]`}></i>
                                        {item.locked && <span className={`absolute -right-1.5 -top-1 h-1.5 w-1.5 rounded-full ${item.critical ? 'bg-red-500' : 'bg-amber-400'}`}></span>}
                                        {item.critical && !item.locked && !active && <span className="absolute -right-1.5 -top-1 h-1.5 w-1.5 animate-pulse rounded-full bg-red-500"></span>}
                                    </span>
                                    <span className={`w-full truncate text-center text-[10.5px] leading-none ${item.critical ? 'font-bold' : 'font-medium'}`}>{item.short}</span>
                                </button>
                            );
                        })}
                    </nav>
                </div>
            );
        }

        const rootContainer = document.getElementById('root');
        if (rootContainer) ReactDOM.createRoot(rootContainer).render(<QuestView />);
    </script>
</body>
</html>
