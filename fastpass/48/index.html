    function timeStrToMin(str) {
      const [h, m] = (str || '00:00').split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function applyConfigPayload(payload) {
      if (!payload) return false;
      let changed = false;

      if (payload.venues && typeof payload.venues === 'object') {
        stationVenues = { ...stationVenues, ...payload.venues };
        changed = true;
      }

      if (Array.isArray(payload.time_slots) && payload.time_slots.length === 6) {
        TIME_SLOTS = payload.time_slots.map(slot => ({
          start: slot.start,
          end: slot.end,
          startMin: typeof slot.startMin === 'number' ? slot.startMin : timeStrToMin(slot.start),
          endMin: typeof slot.endMin === 'number' ? slot.endMin : timeStrToMin(slot.end)
        }));
        const rangeEl = document.getElementById('overallTimeRange');
        if (rangeEl) {
          rangeEl.textContent = `${TIME_SLOTS[0].start} - ${TIME_SLOTS[TIME_SLOTS.length - 1].end}`;
        }
        changed = true;
      }

      if (changed) renderScheduleView();
      return changed;
    }

    function parseVenueText(text) {
      const venues = {};
      if (!text || typeof text !== 'string') return venues;

      const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0 && !l.startsWith('#'));
      if (rawLines.length === 0) return venues;

      function parseBilingual(val) {
        if (val.includes('|')) {
          const [zh, en] = val.split('|').map(s => s.trim());
          return { zh: zh || val, en: en || zh || val };
        }
        if (val.includes('/')) {
          const [zh, en] = val.split('/').map(s => s.trim());
          return { zh: zh || val, en: en || zh || val };
        }
        return { zh: val, en: val };
      }

      const kvPairs = [];
      for (const line of rawLines) {
        const sepIdx = line.search(/[:=：]/);
        if (sepIdx !== -1) {
          const key = line.slice(0, sepIdx).trim();
          const val = line.slice(sepIdx + 1
