    function timeStrToMin(str) {
      const [h, m] = (str || '00:00').split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function applyConfigPayload(payload) {
      if (!payload) return false;
      let changed = false;

      if (payload.venues && typeof payload.venues === 'object') {
        stationVenues = { ...stationVenues, ...payload.venues };
        changed = true;
      }

      if (Array.isArray(payload.time_slots) && payload.time_slots.length === 6) {
        TIME_SLOTS = payload.time_slots.map(slot => ({
          start: slot.start,
          end: slot.end,
          startMin: typeof slot.startMin === 'number' ? slot.startMin : timeStrToMin(slot.start),
          endMin: typeof slot.endMin === 'number' ? slot.endMin : timeStrToMin(slot.end)
        }));
        const rangeEl = document.getElementById('overallTimeRange');
        if (rangeEl) {
          rangeEl.textContent = `${TIME_SLOTS[0].start} - ${TIME_SLOTS[TIME_SLOTS.length - 1].end}`;
        }
        changed = true;
      }

      if (changed && currentTeam) renderScheduleView();
      return changed;
    }

    function parseVenueText(text) {
      const venues = {};
      if (!text || typeof text !== 'string') return venues;

      const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0 && !l.startsWith('#'));
      if (rawLines.length === 0) return venues;

      function parseBilingual(val) {
        if (val.includes('|')) {
          const [zh, en] = val.split('|').map(s => s.trim());
          return { zh: zh || val, en: en || zh || val };
        }
        if (val.includes('/')) {
          const [zh, en] = val.split('/').map(s => s.trim());
          return { zh: zh || val, en: en || zh || val };
        }
        return { zh: val, en: val };
      }

      const kvPairs = [];
      for (const line of rawLines) {
        const sepIdx = line.search(/[:=：]/);
        if (sepIdx !== -1) {
          const key = line.slice(0, sepIdx).trim();
          const val = line.slice(sepIdx + 1).trim();
          kvPairs.push({ key, val });
        }
      }

      if (kvPairs.length > 0) {
        const hasZero = kvPairs.some(p => p.key.replace(/\D/g, '') === '0');
        let matchedAny = false;

        for (const { key, val } of kvPairs) {
          const cleanKey = key.toLowerCase();
          
          let nameMatched = false;
          for (const [idStr, stObj] of Object.entries(STATIONS)) {
            if (cleanKey.includes(stObj.zh.toLowerCase()) || cleanKey.includes(stObj.en.toLowerCase())) {
              venues[parseInt(idStr, 10)] = parseBilingual(val);
              nameMatched = true;
              matchedAny = true;
              break;
            }
          }
          if (nameMatched) continue;

          const numMatch = cleanKey.match(/\d+/);
          if (numMatch) {
            const num = parseInt(numMatch[0], 10);
            const idx = hasZero ? num : (num >= 1 && num <= 6 ? num - 1 : num);
            if (idx >= 0 && idx <= 5) {
              venues[idx] = parseBilingual(val);
              matchedAny = true;
            }
          }
        }

        if (matchedAny) return venues;
      }

      for (let i = 0; i < Math.min(rawLines.length, 6); i++) {
        venues[i] = parseBilingual(rawLines[i]);
      }

      return venues;
    }

    async function loadVenueData() {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('fastpass_config')
            .select('venues, time_slots')
            .eq('id', 1)
            .maybeSingle();

          if (!error && data && applyConfigPayload(data)) {
            localStorage.setItem('fastpass_config_v1', JSON.stringify(data));
            return;
          }
        } catch (err) {}
      }

      try {
        const cached = localStorage.getItem('fastpass_config_v1');
        if (cached && applyConfigPayload(JSON.parse(cached))) {
          return;
        }
      } catch (e) {}

      const candidates = ['../venue.txt', 'venue.txt'];
      for (const path of candidates) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            const text = await res.text();
            const parsed = parseVenueText(text);
            if (Object.keys(parsed).length > 0) {
              stationVenues = { ...stationVenues, ...parsed };
              if (currentTeam) renderScheduleView();
              return;
            }
          }
        } catch (err) {}
      }
    }

    function subscribeRealtimeConfig() {
      if (!supabaseClient) return;
      try {
        supabaseClient
          .channel('fastpass_config_live')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'fastpass_config' }, (payload) => {
            if (payload.new) {
              applyConfigPayload(payload.new);
              localStorage.setItem('fastpass_config_v1', JSON.stringify(payload.new));
            }
          })
          .subscribe();
      } catch (e) {}
    }

    function getActiveSlotIndex() {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      for (let i = 0; i < TIME_SLOTS.length; i++) {
        if (currentMin >= TIME_SLOTS[i].startMin && currentMin <= TIME_SLOTS[i].endMin) return i;
      }
      if (currentMin < TIME_SLOTS[0].startMin) return -1;
      if (currentMin > TIME_SLOTS[TIME_SLOTS.length - 1].endMin) return 99;
      for (let i = 0; i < TIME_SLOTS.length - 1; i++) {
        if (currentMin > TIME_SLOTS[i].endMin && currentMin < TIME_SLOTS[i + 1].startMin) return i + 1;
      }
      return -1;
    }

    async function initAudioEngine() {
      if (audioReady) return;
      try {
        await Tone.start();
        switchSynth = new Tone.MembraneSynth({
          pitchDecay: 0.02,
          octaves: 2,
          envelope: { attack: 0.001, decay: 0.08, sustain: 0.01, release: 0.08 }
        }).toDestination();
        switchSynth.volume.value = -12;
        audioReady = true;
      } catch (err) {}
    }

    function playSwitchSound() {
      if (!audioEnabled) return;
      initAudioEngine();
      try {
        if (switchSynth) switchSynth.triggerAttackRelease("C3", "32n", Tone.now());
      } catch (e) {}
    }

      document.getElementById("submitBtnText").textContent = t.submitBtn;
      document.getElementById("backBtnText").textContent = t.backBtn;
      document.getElementById("thTime").textContent = t.thTime;
      document.getElementById("thStation").textContent = t.thStation;
      document.getElementById("thVenue").textContent = t.thVenue;
      document.getElementById("thStatus").textContent = t.thStatus;
      document.getElementById("scheduleBadge").textContent = t.scheduleBadge;
      document.getElementById("footerDuration").textContent = t.footerDuration;
    }

    function showInputScreen() {
      playSwitchSound();
      document.getElementById("scheduleScreen").classList.add("hidden");
      const inputScreen = document.getElementById("teamInputScreen");
      inputScreen.classList.remove("hidden");
      const input = document.getElementById("teamInputNumber");
      input.value = currentTeam || "";
      setTimeout(() => input.focus(), 50);
    }

    function handleTeamSubmit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById("teamInputNumber");
      const errorMsg = document.getElementById("inputErrorMsg");
      const card = document.getElementById("teamInputScreen");
      const t = I18N[currentLang];

      const val = parseInt(input.value, 10);
      if (isNaN(val) || val < 1 || val > TOTAL_TEAMS) {
        errorMsg.textContent = t.errorRange;
        errorMsg.classList.remove("hidden");
        card.classList.remove("shake");
        void card.offsetWidth; // trigger reflow
        card.classList.add("shake");
        input.focus();
        return;
      }

      errorMsg.classList.add("hidden");
      currentTeam = val;
      playSwitchSound();

      // Switch views
      document.getElementById("teamInputScreen").classList.add("hidden");
      document.getElementById("scheduleScreen").classList.remove("hidden");
      renderScheduleView();
    }

    function renderScheduleView() {
      if (!currentTeam) return;
      const t = I18N[currentLang];
      const schedule = SCHEDULE_MATRIX_36[currentTeam - 1];
      const activeSlot = getActiveSlotIndex();

      document.getElementById("scheduleTitle").textContent = t.scheduleTitle(currentTeam);
      document.getElementById("selectedTeamBadge").textContent = t.teamBadge(currentTeam);

      const liveBadge = document.getElementById("liveStatusBadge");
      if (activeSlot === 99) {
        liveBadge.textContent = t.liveConcluded;
        liveBadge.className = "text-gray-400 font-bold";
      } else {
        liveBadge.textContent = t.liveActive;
        liveBadge.className = "text-deloitte-green font-bold";
      }

      const tbody = document.getElementById("scheduleTableBody");
      let rowsHtml = "";

      for (let i = 0; i < 6; i++) {
        const slot = TIME_SLOTS[i];
        const stationIdx = schedule[i];
        const station = STATIONS[stationIdx];
        const isCurrent = (i === activeSlot);

        const venueObj = stationVenues[stationIdx] || { zh: `场地 ${stationIdx + 1}`, en: `Venue ${stationIdx + 1}` };
        const venueName = currentLang === 'zh' ? venueObj.zh : venueObj.en;

        let rowBg = isCurrent ? "bg-deloitte-green/10" : "hover:bg-white/[0.02]";
        let timeColor = isCurrent ? "text-deloitte-green font-extrabold" : "text-gray-300";
        let stationName = currentLang === 'zh' ? station.zh : station.en;

        let statusBadge = "";
        if (isCurrent) {
          statusBadge = `
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-deloitte-green text-black font-extrabold text-[11px] shadow-sm">
              <span class="w-1.5 h-1.5 rounded-full bg-black animate-ping"></span>
              ${t.statusNow}
            </span>
          `;
        } else if (i === activeSlot + 1) {
          statusBadge = `
            <span class="px-2.5 py-1 rounded-full bg-deloitte-green/15 text-deloitte-green font-bold text-[11px] border border-deloitte-green/30">
              ${t.statusNext}
            </span>
          `;
        } else if (activeSlot !== -1 && i < activeSlot) {
          statusBadge = `
            <span class="text-gray-500 text-xs flex items-center gap-1 justify-end font-semibold">
              <i class="fa-solid fa-check text-deloitte-green"></i> ${t.statusDone}
            </span>
          `;
        } else {
          statusBadge = `
            <span class="text-gray-600 text-xs font-semibold">${t.statusWaiting}</span>
          `;
        }

        rowsHtml += `
          <tr class="transition-colors ${rowBg}">
            <td class="py-3.5 px-4 font-mono font-bold text-xs sm:text-sm ${timeColor}">
              ${slot.start} - ${slot.end}
            </td>
            <td class="py-3.5 px-4">
              <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-deloitte-green flex-shrink-0">
                  <i class="fa-solid ${station.icon} text-xs"></i>
                </div>
                <span class="font-bold text-white text-xs sm:text-sm">${stationName}</span>
              </div>
            </td>
            <td class="py-3.5 px-4">
              <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs sm:text-sm font-medium text-gray-200">
                <i class="fa-solid fa-location-dot text-deloitte-green text-xs flex-shrink-0"></i>
                <span class="truncate max-w-[130px] sm:max-w-[200px]" title="${venueName}">${venueName}</span>
              </div>
            </td>
            <td class="py-3.5 px-4 text-right">
              ${statusBadge}
            </td>
          </tr>
        `;
      }
      tbody.innerHTML = rowsHtml;
    }

    window.onload = function() {
      updateStaticTranslations();
      loadVenueData();
      subscribeRealtimeConfig();
      setInterval(() => {
        if (currentTeam) renderScheduleView();
      }, 30000);
      setInterval(loadVenueData, 60000);
    };

    document.addEventListener("click", () => {
      if (!audioReady && audioEnabled) initAudioEngine();
    }, { once: true });
  </script>
</body>
</html>
