<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DeloitteLand Participant Hub</title>
  
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deloitte: {
              green: '#86BC25',
              darkgreen: '#568819',
              teal: '#004F59',
              navy: '#002776',
              black: '#080b11',
              cardbg: '#121620',
              cardborder: '#1f2637',
              gray: '#868D96',
              lightgray: '#DCE0E5'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans SC"', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #080b11;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(134, 188, 37, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 79, 89, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(0, 39, 118, 0.08) 0%, transparent 60%);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    .deloitte-dot {
      display: inline-block;
      width: 0.55em;
      height: 0.55em;
      background-color: #86BC25;
      border-radius: 50%;
      margin-left: 0.12em;
      box-shadow: 0 0 12px rgba(134, 188, 37, 0.85);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .deloitte-dot:active { transform: scale(1.6); }

    .card-shadow {
      box-shadow: 0 12px 32px -6px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.07);
    }

    .button-press { 
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: manipulation;
    }
    .button-press:active { transform: scale(0.96) translateY(2px); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(134,188,37,0.3); border-radius: 4px; }

    .safe-top { padding-top: env(safe-area-inset-top, 12px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 24px); }

    @keyframes matrixPulse {
      0%, 100% { border-color: rgba(134, 188, 37, 0.4); box-shadow: 0 0 20px rgba(134, 188, 37, 0.2); }
      50% { border-color: rgba(134, 188, 37, 0.9); box-shadow: 0 0 35px rgba(134, 188, 37, 0.6); }
    }
    .matrix-active { animation: matrixPulse 1.5s infinite; }
  </style>
</head>

<body class="text-white font-sans flex flex-col justify-between min-h-screen selection:bg-deloitte-green selection:text-black">

  <!-- Mobile Top Floating Header -->
  <header class="sticky top-0 z-40 bg-[#080b11]/90 backdrop-blur-md border-b border-white/10 safe-top">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-deloitte-green/20 border border-deloitte-green/40 flex items-center justify-center text-deloitte-green text-xs font-black">
          <i class="fa-solid fa-shapes"></i>
        </div>
        <div class="flex items-baseline">
          <span class="font-black text-lg tracking-tight text-white">Deloitte<span id="easterDot" class="deloitte-dot" onclick="handleDotEggClick()"></span></span>
          <span class="text-[10px] font-bold text-gray-400 ml-1.5 uppercase tracking-wider" data-i18n="subTitle">学员端</span>
        </div>
      </div>

      <!-- Right Action Tools -->
      <div class="flex items-center gap-2">
        <button type="button" onclick="triggerPartyConfetti()" class="button-press w-8 h-8 rounded-full bg-white/5 border border-white/15 text-deloitte-green flex items-center justify-center text-xs" title="Good Luck">
          <i class="fa-solid fa-sparkles"></i>
        </button>
        <button type="button" onclick="toggleLanguage()" class="button-press px-2.5 py-1 rounded-full text-xs font-bold bg-white/10 hover:bg-white/20 border border-white/20 text-white flex items-center gap-1">
          <i class="fa-solid fa-language text-deloitte-green text-xs"></i>
          <span id="langToggleLabel">EN</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container (Mobile-First 440px max) -->
  <main class="flex-grow max-w-md mx-auto w-full px-4 py-4 space-y-4">

    <!-- 01. Dynamic Host Announcement Board -->
    <div id="announcementCard" class="p-3.5 rounded-2xl bg-gradient-to-r from-deloitte-teal/30 via-deloitte-cardbg to-deloitte-cardbg border border-deloitte-green/30 card-shadow relative overflow-hidden">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-xl bg-deloitte-green/20 border border-deloitte-green/40 flex items-center justify-center text-deloitte-green text-sm shrink-0 mt-0.5 animate-pulse">
          <i class="fa-solid fa-bullhorn"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-extrabold uppercase tracking-widest text-deloitte-green" data-i18n="announcementTag">现场广播</span>
            <span id="announcementTime" class="text-[10px] font-mono text-gray-500">Live</span>
          </div>
          <p id="announcementBody" class="text-xs sm:text-sm font-semibold text-gray-100 mt-1 leading-relaxed">
            欢迎来到德勤乐园！
          </p>
        </div>
      </div>
    </div>

    <!-- 02. Essential Mission Cards: FastPass & D-Rush -->
    <div class="grid grid-cols-2 gap-3">
      <!-- FastPass Dynamic Portal Card -->
      <a id="fastpassDynamicLink" href="https://projectsunrise.win/fastpass/36" target="_blank" rel="noopener noreferrer"
        class="button-press p-3.5 rounded-2xl bg-deloitte-cardbg border border-lime-500/30 hover:border-lime-400 card-shadow flex flex-col justify-between group relative overflow-hidden">
        <div class="absolute -right-4 -top-4 w-16 h-16 bg-lime-500/10 rounded-full blur-xl pointer-events-none"></div>
        <div class="flex items-center justify-between">
          <div class="w-8 h-8 rounded-xl bg-lime-500/20 text-lime-400 flex items-center justify-center text-sm font-bold">
            <i class="fa-solid fa-route"></i>
          </div>
          <span id="fpCohortBadge" class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full bg-lime-400/20 text-lime-300 border border-lime-400/30">FP-36</span>
        </div>
        <div class="mt-3">
          <div class="text-xs font-black text-white group-hover:text-lime-300 transition-colors" data-i18n="fastpassTitle">FastPass 通行证</div>
          <div class="text-[10px] text-gray-400 mt-0.5" data-i18n="fastpassSub">查看队伍轮转时刻</div>
        </div>
      </a>

      <!-- D-Rush Mini Game & Highest Score (Fetched directly from Supabase) -->
      <a href="https://www.projectsunrise.win/game" target="_blank" rel="noopener noreferrer"
        class="button-press p-3.5 rounded-2xl bg-deloitte-cardbg border border-deloitte-green/30 hover:border-deloitte-green card-shadow flex flex-col justify-between group relative overflow-hidden">
        <div class="absolute -right-4 -top-4 w-16 h-16 bg-deloitte-green/10 rounded-full blur-xl pointer-events-none"></div>
        <div class="flex items-center justify-between">
          <div class="w-8 h-8 rounded-xl bg-deloitte-green/20 text-deloitte-green flex items-center justify-center text-sm font-bold">
            <i class="fa-solid fa-gamepad"></i>
          </div>
          <div class="flex items-center gap-1 text-[10px] font-mono text-deloitte-green font-bold bg-deloitte-green/15 px-2 py-0.5 rounded-full border border-deloitte-green/30">
            <i class="fa-solid fa-trophy text-[9px]"></i>
            <span id="drushHighScoreBadge">--</span>
          </div>
        </div>
        <div class="mt-3">
          <div class="text-xs font-black text-white group-hover:text-deloitte-green transition-colors">D-Rush</div>
          <div class="text-[10px] text-gray-400 mt-0.5" data-i18n="drushSub">刷最高分</div>
        </div>
      </a>
    </div>

    <!-- 03. Project Sunrise Passcode Gate -->
    <div id="sunriseUnlockBox" class="p-4 rounded-2xl bg-deloitte-cardbg border border-amber-500/30 card-shadow space-y-3">

        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs">
            <i class="fa-solid fa-sun"></i>
          </div>
          <h2 class="text-xs font-extrabold text-white uppercase tracking-wider" data-i18n="sunriseGateTitle">日出计划秘钥</h2>
        </div>
        <span id="sunriseStatusBadge" class="text-[10px] font-mono text-amber-400/80 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20" data-i18n="badgeLocked">LOCKED</span>
      </div>

      <div id="sunriseInputSection" class="space-y-2">
        <p class="text-[11px] text-gray-400" data-i18n="sunrisePasscodePrompt">输入主持人公布的秘钥解锁：</p>
        <div class="flex gap-2">
          <input id="sunrisePasscodeInput" type="text" placeholder="Passcode (14位口令)"

          <button type="button" onclick="verifySunrisePasscode()"
            class="button-press px-4 py-2 bg-amber-400 hover:bg-amber-300 text-black text-xs font-black rounded-xl flex items-center gap-1.5 shrink-0">
            <span data-i18n="btnUnlock">解锁</span>
            <i class="fa-solid fa-key text-[10px]"></i>
          </button>
        </div>
        <p id="sunriseErrorHint" class="hidden text-[10px] text-rose-400 flex items-center gap-1 pt-0.5">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span data-i18n="errPasscode">秘钥错误，请倾听主持人现场口令</span>
        </p>
      </div>

      <!-- Unlocked State Links (Initially Hidden) -->
      <div id="sunriseUnlockedLinks" class="hidden pt-1 space-y-2.5">
        <div class="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-between">
          <span class="text-xs font-bold text-amber-300" data-i18n="unlockedSuccess">关卡站点已就绪</span>
          <span class="text-[10px] text-gray-400 font-mono">esirnustcejorp</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <a href="https://www.projectsunrise.win/sunrise" target="_blank" rel="noopener noreferrer"
            class="button-press p-2.5 rounded-xl bg-amber-400 text-black font-extrabold text-xs text-center col-span-2 flex items-center justify-center gap-1.5 shadow-md shadow-amber-400/20">
            <span data-i18n="launchMainSunrise">进入日出计划主站</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
          </a>
        </div>
      </div>
    </div>

    <!-- 04. 6 Stations Leaderboard (TOP 10 ONLY - NO FAKE DATA) -->
    <div class="p-4 rounded-2xl bg-deloitte-cardbg border border-white/10 card-shadow space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-deloitte-green/20 text-deloitte-green flex items-center justify-center text-xs">
            <i class="fa-solid fa-ranking-star"></i>
          </div>
          <div>
            <h2 class="text-xs font-black text-white uppercase tracking-wider" data-i18n="leaderboardTitle">Top 10</h2>

          </div>
        </div>
        <button type="button" onclick="fetchLiveLeaderboard()" class="button-press text-deloitte-green text-xs p-1" title="Refresh">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>

      <!-- Station Filter Chips -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">

        <button type="button" onclick="filterLeaderboardStation('1')" id="stFilterBtn-1" class="button-press px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white/5 text-gray-400 whitespace-nowrap">

        <button type="button" onclick="filterLeaderboardStation('2')" id="stFilterBtn-2" class="button-press px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white/5 text-gray-400 whitespace-nowrap">

      <div id="leaderboardList" class="space-y-1.5 pt-1">

      </div>
    </div>

    <div class="p-4 rounded-2xl bg-deloitte-cardbg border border-white/10 card-shadow space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">

            class="col-span-1 bg-black/60 border border-white/15 focus:border-teal-400 focus:outline-none rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-gray-600">
          <input id="msgContent" type="text" placeholder="说点什么为队友打气..." maxlength="100" required
            class="col-span-2 bg-black/60 border border-white/15 focus:border-teal-400 focus:outline-none rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-gray-600">
        </div>
        <div class="flex items-center justify-between pt-1">
          <div class="flex items-center gap-1 text-[11px] text-gray-500">
            <span data-i18n="msgFriendlyTip">友善互动</span>
          </div>
          <button type="submit" id="msgSubmitBtn"
            class="button-press px-3.5 py-1.5 bg-teal-500 hover:bg-teal-400 text-black font-extrabold text-xs rounded-lg flex items-center gap-1">
            <span data-i18n="btnSendMsg">发送</span>
            <i class="fa-solid fa-paper-plane text-[9px]"></i>
          </button>
        </div>
      </form>

      <!-- Message Stream -->
      <div id="messageListContainer" class="max-h-60 overflow-y-auto space-y-2 pr-0.5">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Hidden Easter Egg Trigger Area -->
    <div class="text-center pt-2">
      <button type="button" onclick="handleSecretEggTrigger()" class="text-[10px] font-mono text-gray-700 hover:text-deloitte-green transition-colors">
        • DELOITTELAND 2026 •
      </button>
    </div>

  </main>

  <!-- Interactive Floating Easter Egg Popup Modal -->

    <div class="bg-deloitte-cardbg border-2 border-deloitte-green rounded-3xl p-6 max-w-xs w-full text-center space-y-4 card-shadow animate-fade-in">
      <div class="w-16 h-16 rounded-full bg-deloitte-green/20 border border-deloitte-green/40 mx-auto flex items-center justify-center text-deloitte-green text-2xl animate-bounce">
        <i class="fa-solid fa-gift"></i>
      </div>
      <div>
        <h3 class="text-base font-black text-white" data-i18n="eggFoundTitle">发现隐藏彩蛋！</h3>
        <p id="easterEggText" class="text-xs text-gray-300 mt-1 leading-relaxed">

      </div>
      <button type="button" onclick="closeEasterEggModal()" class="button-press w-full py-2.5 rounded-xl bg-deloitte-green text-black font-extrabold text-xs" data-i18n="btnCloseEgg">
        收下祝福 (Close)

    </div>
  </div>

        sunrisePlaceholder: "Passcode (14 chars)",
        btnUnlock: "Unlock",
        errPasscode: "Invalid passcode. Check with the MC.",
        unlockedSuccess: "Site Ready",
        launchMainSunrise: "Launch Project Sunrise Main Site",
        leaderboardTitle: "Top 10",
        leaderboardSub: "Live rankings across 6 stations",
        filterAll: "Total",
        st0: "Piece by Piece",
        st1: "Ethical Tree",
        st2: "D.Signal",
        st3: "Knowledge Clash",
        st4: "EQ Matrix",
        st5: "The AI Era",
        emptyLeaderboard: "No scores recorded yet. Standings will appear once judges submit scores.",
        msgBoardTitle: "Community Board",
        msgBoardSub: "Share cheers and battle notes",
        nicknamePlaceholder: "Nickname",
        msgPlaceholder: "Cheer for your team...",
        msgFriendlyTip: "Friendly Community",
        btnSendMsg: "Post",
        eggFoundTitle: "Easter Egg Discovered!",
        btnCloseEgg: "Awesome (Close)",
        eggDotMsg: "[Easter Egg 1] Green Dot tapped 5 times! Matrix Pulse mode activated. Tap 5 times to toggle.",
        eggSecretMsg: "[Easter Egg 2] Hidden Code: DeloitteLand 2026 system running at full speed. Keep exploring!",
        eggValueMsg: "Core Value Unlocked: 'Together makes progress.' Honor badge acquired!"
      }
    };

    let currentLang = localStorage.getItem('participant_lang') || 'zh';
    let currentRawAnnouncementData = null;

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('participant_lang', lang);
      document.getElementById('langToggleLabel').textContent = I18N[lang].langToggle;

      // Update text nodes with data-i18n
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[lang] && I18N[lang][key]) {
          el.textContent = I18N[lang][key];
        }
      });

      // Update input placeholders
      const nickInput = document.getElementById('msgNickname');
      const contentInput = document.getElementById('msgContent');
      const passcodePin = document.getElementById('sunrisePasscodeInput');
      if (nickInput) nickInput.placeholder = I18N[lang].nicknamePlaceholder;
      if (contentInput) contentInput.placeholder = I18N[lang].msgPlaceholder;
      if (passcodePin) passcodePin.placeholder = I18N[lang].sunrisePlaceholder;

      // Re-render announcement in the target language
      if (currentRawAnnouncementData) {
        applyAnnouncementData(currentRawAnnouncementData);
      } else {
        document.getElementById('announcementBody').textContent = I18N[lang].defaultAnnouncement;
      }

      // Re-render leaderboard for bilingual station titles / empty state
      renderLeaderboard();
    }

    function toggleLanguage() {
      setLanguage(currentLang === 'zh' ? 'en' : 'zh');
    }

    /* ==========================================================
       01. D-RUSH HIGHEST SCORE DIRECTLY FROM SUPABASE
       ========================================================== */
    async function loadDrushHighScore() {
      const badge = document.getElementById('drushHighScoreBadge');
      if (!badge) return;
      try {
        if (supabaseClient) {
          // 1. Check dedicated drush_scores table ordered descending
          const { data: scoreData, error: sErr } = await supabaseClient
            .from('drush_scores')
            .select('score')
            .order('score', { ascending: false })
            .limit(1)
            .maybeSingle();

          if (!sErr && scoreData && scoreData.score !== undefined && scoreData.score !== null) {
            badge.textContent = scoreData.score;
            localStorage.setItem('drush_high_score_cache', String(scoreData.score));
            return;
          }

          // 2. Check portal_announcements table for synchronized drush_high_score field
          const { data: annData, error: aErr } = await supabaseClient
            .from('portal_announcements')
            .select('drush_high_score')
            .eq('id', 1)
            .maybeSingle();

          if (!aErr && annData && annData.drush_high_score !== undefined && annData.drush_high_score !== null) {
            badge.textContent = annData.drush_high_score;
            localStorage.setItem('drush_high_score_cache', String(annData.drush_high_score));
            return;
          }
        }
      } catch (err) {
        console.warn("D-Rush Supabase high score fetch error:", err);
      }

      const cached = localStorage.getItem('drush_high_score_cache');
      if (cached) {
        badge.textContent = cached;
      }
    }

    /* ==========================================================
       02. ANNOUNCEMENT & FASTPASS DISPATCH SYNC
       ========================================================== */
    async function loadPortalAnnouncement() {
      try {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.from('portal_announcements').select('*').eq('id', 1).maybeSingle();
          if (!error && data) {
            currentRawAnnouncementData = data;
            applyAnnouncementData(data);
            return;
          }
        }
      } catch (err) {
        console.warn("Announcement fetch fallback:", err);
      }

      const cached = localStorage.getItem('portal_announcement_cache');
      if (cached) {
        currentRawAnnouncementData = JSON.parse(cached);
        applyAnnouncementData(currentRawAnnouncementData);
      } else {
        document.getElementById('announcementBody').textContent = I18N[currentLang].defaultAnnouncement;
      }
    }

    function applyAnnouncementData(data) {
      if (!data) return;
      const text = currentLang === 'zh' 
        ? (data.text_zh || data.text || I18N.zh.defaultAnnouncement) 
        : (data.text_en || data.text || I18N.en.defaultAnnouncement);

      if (text) {
        document.getElementById('announcementBody').textContent = text;
      }
      if (data.updated_at) {
        const dt = new Date(data.updated_at);
        document.getElementById('announcementTime').textContent = dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      // FastPass target cohort sync (24, 36, or 48)
      const cohort = data.fastpass_target || '36';
      const fpLink = document.getElementById('fastpassDynamicLink');
      const fpBadge = document.getElementById('fpCohortBadge');
      if (fpLink && fpBadge) {
        fpLink.href = `https://projectsunrise.win/fastpass/${cohort}`;
        fpBadge.textContent = `FP-${cohort}`;
      }
    }

    /* ==========================================================
       03. PROJECT SUNRISE PASSCODE UNLOCK LOGIC
       Passcode: "esirnustcejorp"
       ========================================================== */
    const SUNRISE_PASSCODE = "esirnustcejorp";

    function checkSunriseUnlockState() {
      const isUnlocked = localStorage.getItem('sunrise_unlocked') === 'true';
      if (isUnlocked) {
        revealSunriseContent();
      }
    }

    function verifySunrisePasscode() {
      const input = document.getElementById('sunrisePasscodeInput');
      const errorHint = document.getElementById('sunriseErrorHint');
      const val = (input.value || "").trim().toLowerCase();

      if (val === SUNRISE_PASSCODE) {
        localStorage.setItem('sunrise_unlocked', 'true');
        errorHint.classList.add('hidden');
        revealSunriseContent();
        triggerPartyConfetti();
      } else {
        errorHint.classList.remove('hidden');
        input.classList.add('border-rose-500');
        setTimeout(() => input.classList.remove('border-rose-500'), 1500);
      }
    }

    function revealSunriseContent() {
      document.getElementById('sunriseInputSection').classList.add('hidden');
      document.getElementById('sunriseUnlockedLinks').classList.remove('hidden');
      const badge = document.getElementById('sunriseStatusBadge');
      badge.textContent = I18N[currentLang].badgeUnlocked;
      badge.className = "text-[10px] font-mono text-emerald-400 bg-emerald-500/15 px-2 py-0.5 rounded border border-emerald-500/30 font-bold";
    }

    /* ==========================================================
       04. 6 STATIONS LEADERBOARD (STRICTLY NO FAKE DATA)
       ========================================================== */
    let currentSelectedStation = 'ALL';
    let fullScoresDataset = null;

    async function fetchLiveLeaderboard() {
      try {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.from('station_leaderboards').select('*').eq('id', 1).maybeSingle();
          if (!error && data && Array.isArray(data.team_scores) && data.team_scores.length > 0) {
            fullScoresDataset = data.team_scores;
            renderLeaderboard();
            return;
          }
        }
      } catch (e) {
        console.warn("Leaderboard fetch fallback:", e);
      }

      const cached = localStorage.getItem('leaderboard_data_cache');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) {
            fullScoresDataset = parsed;
          } else {
            fullScoresDataset = null;
          }
        } catch (err) {
          fullScoresDataset = null;
        }
      } else {
        fullScoresDataset = null;
      }
      renderLeaderboard();
    }

    function filterLeaderboardStation(stationKey) {
      currentSelectedStation = stationKey;
      ['ALL', '0', '1', '2', '3', '4', '5'].forEach(k => {
        const btn = document.getElementById(`stFilterBtn-${k}`);
        if (btn) {
          if (k === stationKey) {
            btn.className = "button-press px-2.5 py-1 rounded-lg text-[11px] font-bold bg-deloitte-green text-black whitespace-nowrap";
          } else {
            btn.className = "button-press px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white/5 text-gray-400 whitespace-nowrap";
          }
        }
      });
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const listEl = document.getElementById('leaderboardList');
      if (!listEl) return;

      if (!fullScoresDataset || fullScoresDataset.length === 0) {
        listEl.innerHTML = `
          <div class="p-6 rounded-xl bg-black/30 border border-white/5 text-center space-y-2">
            <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center mx-auto text-gray-500 text-xs">
              <i class="fa-solid fa-clock-rotate-left"></i>
            </div>
            <p class="text-xs text-gray-400 font-medium">${I18N[currentLang].emptyLeaderboard}</p>
          </div>
        `;
        return;
      }

      let sorted = fullScoresDataset.map(item => {
        let scoreToRank = 0;
        if (currentSelectedStation === 'ALL') {
          scoreToRank = item.total !== undefined ? item.total : (item.stations ? item.stations.reduce((a, b) => a + b, 0) : 0);
        } else {
          const idx = parseInt(currentSelectedStation, 10);
          scoreToRank = (item.stations && item.stations[idx] !== undefined) ? item.stations[idx] : 0;
        }
        return { team: item.team, score: scoreToRank };
      });

      sorted.sort((a, b) => b.score - a.score);
      const top10 = sorted.slice(0, 10);

      if (top10.length === 0 || top10.every(item => item.score === 0)) {
        listEl.innerHTML = `
          <div class="p-6 rounded-xl bg-black/30 border border-white/5 text-center space-y-2">
            <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center mx-auto text-gray-500 text-xs">
              <i class="fa-solid fa-hourglass-start"></i>
            </div>
            <p class="text-xs text-gray-400 font-medium">${I18N[currentLang].emptyLeaderboard}</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = top10.map((item, index) => {
        const rank = index + 1;
        let rankBadge = `<span class="w-5 text-center font-mono font-bold text-gray-400 text-xs">${rank}</span>`;
        if (rank === 1) rankBadge = `<span class="w-5 text-center text-amber-400 text-xs"><i class="fa-solid fa-crown"></i></span>`;
        if (rank === 2) rankBadge = `<span class="w-5 text-center text-slate-300 text-xs"><i class="fa-solid fa-medal"></i></span>`;
        if (rank === 3) rankBadge = `<span class="w-5 text-center text-amber-600 text-xs"><i class="fa-solid fa-award"></i></span>`;

        return `
          <div class="flex items-center justify-between p-2 rounded-xl bg-white/[0.03] hover:bg-white/[0.06] border border-white/5 transition-all">
            <div class="flex items-center gap-2">
              ${rankBadge}
              <span class="text-xs font-bold text-white">${item.team}</span>
            </div>
            <div class="flex items-center gap-1.5 font-mono">
              <span class="text-xs font-black text-deloitte-green">${item.score}</span>
              <span class="text-[10px] text-gray-500">pts</span>
            </div>
          </div>
        `;
      }).join('');
    }

    /* ==========================================================
       05. PARTICIPANT MESSAGE BOARD
       ========================================================== */
    let localMessages = [
      { id: 1, nickname: "DeloitteLand MC", content: "欢迎新同事！大家冲鸭！🚀", time: "Live" }
    ];

    async function loadMessages() {
      try {
        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from('participant_messages')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);

          if (!error && data && data.length > 0) {
            renderMessageStream(data);
            return;
          }
        }
      } catch (err) {
        console.warn("Message board fetch fallback:", err);
      }

      renderMessageStream(localMessages);
    }

    function renderMessageStream(msgs) {
      const container = document.getElementById('messageListContainer');
      const badge = document.getElementById('msgCountBadge');
      if (!container) return;

      badge.textContent = `${msgs.length} msgs`;

      container.innerHTML = msgs.map(m => `
        <div class="p-2.5 rounded-xl bg-black/40 border border-white/10 text-xs space-y-1">
          <div class="flex items-center justify-between text-[10px]">
            <span class="font-bold text-teal-300 flex items-center gap-1">
              <i class="fa-regular fa-user text-[9px]"></i>
              ${escapeHtml(m.nickname || 'Participant')}
            </span>
            <span class="text-gray-500 font-mono">${m.time || (m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Now')}</span>
          </div>
          <p class="text-gray-200 text-xs leading-normal">${escapeHtml(m.content || m.message)}</p>
        </div>
      `).join('');
    }

    async function handlePostMessage(e) {
      e.preventDefault();
      const nickInput = document.getElementById('msgNickname');
      const contentInput = document.getElementById('msgContent');
      const btn = document.getElementById('msgSubmitBtn');

      const nickname = nickInput.value.trim();
      const content = contentInput.value.trim();
      if (!nickname || !content) return;

      btn.disabled = true;

      // Easter Egg Trigger Word
      if (content.toLowerCase().includes("together makes progress") || content.includes("众行致远")) {
        showEasterEggModal(I18N[currentLang].eggValueMsg);
      }

      const newMsg = {
        nickname,
        message: content,
        content: content,
        created_at: new Date().toISOString(),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      try {
        if (supabaseClient) {
          await supabaseClient.from('participant_messages').insert([newMsg]);
        }
      } catch (err) {
        console.warn("Save message err:", err);
      }

      localMessages.unshift(newMsg);
      renderMessageStream(localMessages);
      contentInput.value = '';
      btn.disabled = false;
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    /* ==========================================================
       06. EASTER EGGS LOGIC
       ========================================================== */
    let dotClickCount = 0;
    function handleDotEggClick() {
      dotClickCount++;
      if (dotClickCount >= 5) {
        dotClickCount = 0;
        document.body.classList.toggle('matrix-active');
        triggerPartyConfetti();
        showEasterEggModal(I18N[currentLang].eggDotMsg);
      }
    }

    function handleSecretEggTrigger() {
      showEasterEggModal(I18N[currentLang].eggSecretMsg);
      triggerPartyConfetti();
    }

    function showEasterEggModal(text) {
      document.getElementById('easterEggText').textContent = text;
      document.getElementById('easterEggModal').classList.remove('hidden');
    }

    function closeEasterEggModal() {
      document.getElementById('easterEggModal').classList.add('hidden');
    }

    function triggerPartyConfetti() {
      if (window.confetti) {
        confetti({
          particleCount: 45,
          spread: 70,
          origin: { y: 0.2 },
          colors: ['#86BC25', '#568819', '#004F59', '#38bdf8', '#ffffff']
        });
      }
    }

    /* ==========================================================
       INITIALIZATION
       ========================================================== */
    window.addEventListener('load', () => {
      setLanguage(currentLang);
      checkSunriseUnlockState();
      loadPortalAnnouncement();
      loadDrushHighScore();
      fetchLiveLeaderboard();
      loadMessages();

      // Poll Supabase data every 12 seconds
      setInterval(() => {
        loadPortalAnnouncement();
        loadDrushHighScore();
        loadMessages();
        fetchLiveLeaderboard();
      }, 12000);
    });
  </script>
</body>
</html>
