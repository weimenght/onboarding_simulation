  <style>
    body {
      background-color: #080b11;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(134, 188, 37, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 79, 89, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(0, 39, 118, 0.08) 0%, transparent 60%);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    .deloitte-dot {
      display: inline-block;
      width: 0.52em;
      height: 0.52em;
      background-color: #86BC25;
      border-radius: 50%;
      margin-left: 0.1em;
      box-shadow: 0 0 12px rgba(134, 188, 37, 0.9);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .deloitte-dot:active { transform: scale(1.6); }

    .card-shadow {
      box-shadow: 0 12px 32px -6px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.07);
    }

    .card-active-glow {
      box-shadow: 0 14px 35px -8px rgba(134, 188, 37, 0.28), 0 0 0 2px rgba(134, 188, 37, 0.65);
    }

    .button-press { 
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: manipulation;
    }
    .button-press:active { transform: scale(0.95) translateY(1px); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(134,188,37,0.3); border-radius: 4px; }

    .safe-top { padding-top: env(safe-area-inset-top, 12px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 24px); }

    /* Native App Slide-Over Transition */
    .app-drawer {
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    @keyframes matrixPulse {
      0%, 100% { border-color: rgba(134, 188, 37, 0.4); box-shadow: 0 0 20px rgba(134, 188, 37, 0.2); }
      50% { border-color: rgba(134, 188, 37, 0.9); box-shadow: 0 0 35px rgba(134, 188, 37, 0.6); }
    }
    .matrix-active { animation: matrixPulse 1.5s infinite; }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-2.5px) rotate(6deg); }
    }
    .logo-float { animation: floatLogo 3s ease-in-out infinite; }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.97) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop-in {
      animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.35s ease-in-out; }

<body class="text-white font-sans flex flex-col justify-between min-h-screen selection:bg-deloitte-green selection:text-black">

  <@@DLC@@ ==========================================================
       MODAL 1: WELCOMING ONBOARDING PROFILE GATE (WITH CN/EN TOGGLE)
       ========================================================== -->
  <div id="teamGateModal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/85 backdrop-blur-md p-3.5 overflow-y-auto">
    <div id="teamGateCard" class="bg-deloitte-cardbg border-2 border-deloitte-green/40 rounded-3xl p-5 max-w-sm w-full space-y-4 card-shadow my-auto">
      
      <@@DLC@@ Modal Top Header: Welcoming Title + Segmented CN/EN Language Toggle -->
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-6 h-6 rounded-lg bg-deloitte-green/20 border border-deloitte-green/40 flex items-center justify-center text-deloitte-green text-xs shrink-0">
            <i class="fa-solid fa-id-badge"></i>
          </div>
          <span class="font-black text-sm tracking-tight text-white truncate" data-i18n="modalHeaderTitle">欢迎来到德勤乐园</span>
        </div>

        <@@DLC@@ Segmented Language Switcher inside Modal -->
        <div class="bg-black/60 border border-white/15 rounded-full p-0.5 flex items-center text-[11px] shrink-0">
          <button type="button" id="modalLangZhBtn" onclick="setLanguage('zh')" class="px-2.5 py-0.5 rounded-full font-bold transition-all bg-deloitte-green text-black">
            中文
          </button>
          <button type="button" id="modalLangEnBtn" onclick="setLanguage('en')" class="px-2.5 py-0.5 rounded-full font-semibold transition-all text-gray-400 hover:text-white">
            EN
          </button>
        </div>
      </div>

      <@@DLC@@ Live Profile Preview & Randomize All Button -->
      <div class="flex items-center justify-between gap-2.5 bg-black/50 border border-white/10 rounded-2xl p-3">
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <div id="modalAvatarPreview" class="w-14 h-14 rounded-2xl overflow-hidden border-2 border-deloitte-green shadow-md shadow-deloitte-green/20 shrink-0 bg-black"></div>
          <div class="text-left min-w-0 flex-1">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[10px] font-mono font-extrabold px-1.5 py-0.5 rounded bg-deloitte-green/20 text-deloitte-green border border-deloitte-green/30 shrink-0" id="modalTeamPreviewBadge">TEAM #--</span>
              <span id="modalAvatarTitleTag" class="text-[10px] text-gray-400 truncate">冰美式战神</span>
            </div>
            <div id="modalNicknamePreview" class="text-sm font-black text-white truncate mt-1">New Explorer</div>
          </div>
        </div>

        <button type="button" onclick="randomizeFullPersona()" class="button-press w-16 h-14 rounded-xl bg-deloitte-green/15 hover:bg-deloitte-green/25 border border-deloitte-green/40 text-deloitte-green font-bold flex flex-col items-center justify-center gap-1 shrink-0" title="Randomize Avatar & Nickname">
          <i class="fa-solid fa-dice text-sm"></i>
          <span class="text-[10px] leading-none whitespace-nowrap" data-i18n="btnRandomAll">换一批</span>
        </button>
      </div>

      <form onsubmit="handleSaveTeamNumber(event)" class="space-y-3.5 text-left">
        
        <@@DLC@@ 1. Team Number Input -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="teamNumberInput" class="text-[11px] font-extrabold uppercase tracking-wider text-gray-300">
              1. <span data-i18n="teamModalTitle">你在哪一组？</span>
            </label>
            <span id="teamModalSubtitle" class="text-[10px] font-mono text-deloitte-green font-bold">1 - 36</span>
          </div>
          <div class="relative">
            <input type="number" id="teamNumberInput" inputmode="numeric" min="1" max="36" placeholder="1 - 36" required
              oninput="updateModalLivePreview()"
              class="w-full h-11 bg-black/70 border border-white/15 focus:border-deloitte-green focus:outline-none rounded-xl px-3.5 pr-14 text-base font-black text-deloitte-green font-mono">
            <span id="teamMaxSuffix" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-mono text-gray-500">/ 36</span>
          </div>
        </div>

        <@@DLC@@ 2. Funny Nickname Input + Shuffle Button -->
        <div>
          <label for="modalNicknameInput" class="block text-[11px] font-extrabold uppercase tracking-wider text-gray-300 mb-1">
            2. <span data-i18n="lblModalNickname">起个好玩的花名吧</span>
          </label>
          <div class="flex items-center gap-2">
            <input type="text" id="modalNicknameInput" maxlength="18" required
              oninput="updateModalLivePreview()"
              placeholder="输入昵称（无需真名）或点右边随机"
              class="flex-1 h-10 min-w-0 bg-black/70 border border-white/15 focus:border-deloitte-green focus:outline-none rounded-xl px-3 text-xs font-bold text-white">
            <button type="button" onclick="rollRandomNickname()" class="button-press h-10 px-3 rounded-xl bg-white/10 hover:bg-white/15 border border-white/15 text-xs font-bold text-amber-300 flex items-center justify-center gap-1.5 shrink-0 whitespace-nowrap">
              <i class="fa-solid fa-wand-magic-sparkles text-[11px]"></i>
              <span data-i18n="btnRandomNick">随机花名</span>
            </button>
          </div>
        </div>

        <@@DLC@@ 3. Locally Generated Diverse & Funny SVG Avatar Grid -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-[11px] font-extrabold uppercase tracking-wider text-gray-300">
              3. <span data-i18n="lblSelectAvatar">选个代表你的头像</span>
            </label>
            <span class="text-[10px] text-gray-400" data-i18n="avatarSubHint">点选你喜欢的风格</span>
          </div>
          <div id="avatarPickerGrid" class="grid grid-cols-6 gap-2 bg-black/40 p-2.5 rounded-2xl border border-white/10">
            <@@DLC@@ 12 SVG Avatars rendered via JS -->
          </div>
        </div>

        <p id="teamInputError" class="hidden text-xs text-rose-400 font-semibold text-center"></p>

        <button type="submit" class="button-press w-full h-11 rounded-xl bg-deloitte-green hover:bg-emerald-400 text-black font-extrabold text-xs tracking-wide shadow-lg shadow-deloitte-green/20 flex items-center justify-center gap-1.5">
          <span data-i18n="teamModalSaveBtn">开启今日旅程</span>
          <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
      </form>
    </div>
  </div>

  <@@DLC@@ ==========================================================
       BASE LAYER: MAIN PARTICIPANT HUB
       ========================================================== -->
  <header class="sticky top-0 z-30 bg-[#080b11]/90 backdrop-blur-md border-b border-white/10 safe-top">
    <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between gap-2">
      
      <@@DLC@@ Fun Animated DeloitteLand Logo + Profile Pill -->
      <div class="flex items-center gap-2.5 select-none min-w-0 flex-1">
        <div onclick="handleDotEggClick()" class="relative w-9 h-9 rounded-xl bg-gradient-to-br from-deloitte-green/25 via-deloitte-teal/30 to-deloitte-navy/40 border border-deloitte-green/50 flex items-center justify-center shadow-md shadow-deloitte-green/15 cursor-pointer group shrink-0">
          <i class="fa-solid fa-rocket text-deloitte-green text-sm logo-float group-active:scale-125 transition-transform"></i>
          <span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-deloitte-green border-2 border-[#080b11] animate-ping"></span>
          <span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-deloitte-green border-2 border-[#080b11]"></span>
        </div>

        <div class="min-w-0 flex-1">
          <div class="flex items-baseline leading-none">
            <span class="font-black text-base tracking-tight text-white">Deloitte</span>
            <span class="font-black text-base tracking-tight text-deloitte-green">Land</span>
            <span id="easterDot" class="deloitte-dot" onclick="handleDotEggClick()"></span>
          </div>
          <@@DLC@@ User Avatar + Nickname + Team Pill + BC Style Tag -->
          <div class="mt-1 flex items-center gap-1.5 max-w-full">
            <button type="button" onclick="openTeamGateModal()" class="inline-flex items-center gap-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full pr-2 pl-0.5 py-0.5 transition-colors min-w-0">
              <div id="headerAvatarIcon" class="w-4 h-4 rounded-full overflow-hidden shrink-0"></div>
              <span id="headerNicknameText" class="text-[10px] font-bold text-gray-200 truncate max-w-[90px]">Rookie</span>
              <span id="headerTeamBadge" class="text-[9px] font-mono font-extrabold text-lime-300 bg-lime-400/15 px-1.5 rounded-full shrink-0">#--</span>
            </button>
            <button type="button" id="headerBcStylePill" data-dlv="bc" onclick="openAppView('bc')" class="hidden text-[9px] font-extrabold px-1.5 py-0.5 rounded-full border shrink-0 transition-colors"></button>
          </div>
        </div>
      </div>

      <@@DLC@@ Right Action Tools -->
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" onclick="triggerEnergyBooster()" class="button-press w-8 h-8 rounded-full bg-deloitte-green/15 hover:bg-deloitte-green/25 border border-deloitte-green/40 text-deloitte-green flex items-center justify-center text-xs shadow-sm shadow-deloitte-green/20" title="Good Vibes">

    async function initBcAudioEngine() {
      if (bcAudioReady || !window.Tone) return;
      try {
        await Tone.start();
        bcClickSynth = new Tone.MembraneSynth({
          pitchDecay: 0.01,
          octaves: 2,
          envelope: { attack: 0.001, decay: 0.08, sustain: 0.01, release: 0.08 }
        }).toDestination();
        bcClickSynth.volume.value = -10;

        bcTabSynth = new Tone.Synth({
          oscillator: { type: "sine" },
          envelope: { attack: 0.005, decay: 0.1, sustain: 0.0, release: 0.08 }
        }).toDestination();
        bcTabSynth.volume.value = -12;

        bcAudioReady = true;
      } catch (e) {}
    }

    function toggleBcAudio() {

      const icon = document.getElementById('bcAudioIcon');
      if (icon) {
        icon.className = bcAudioEnabled
          ? "fa-solid fa-volume-high text-deloitte-green"
          : "fa-solid fa-volume-xmark text-gray-500";
      }
      if (bcAudioEnabled) initBcAudioEngine();
    }

    function playBcSfx(type) {
      if (!bcAudioEnabled) return;
      initBcAudioEngine();
      try {
        const now = Tone.now();
        if (type === 'click' && bcClickSynth) bcClickSynth.triggerAttackRelease("C3", "32n", now);
        else if (type === 'tab' && bcTabSynth) bcTabSynth.triggerAttackRelease("E5", "32n", now);
      } catch (e) {}
    }

    function detectInitialLanguage() {
      const saved = localStorage.getItem('participant_lang');
      if (saved === 'zh' || saved === 'en') return saved;
      const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();

    async function loadExternalInfoTxt() {
      const filesToTry = ['./info.txt', './i18n.txt'];
      for (const path of filesToTry) {
        try {
          const res = await fetch(path, { cache: 'no-cache' });
          if (!res.ok) continue;
          const text = await res.text();
          const lines = text.split(/\r?\n/);
          let updated = false;

          const parsedCheersZh = [];
          const parsedCheersEn = [];
          const parsedTipsZh = [];
          const parsedTipsEn = [];

          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const eqIdx = line.indexOf('=');
            if (eqIdx === -1) continue;

            const key = line.slice(0, eqIdx).trim();
            const valPart = line.slice(eqIdx + 1).trim();
            if (!key || !valPart) continue;

            if (key === 'BLOCKED_WORDS') {
              const words = valPart.split(',').map(w => w.trim().toLowerCase()).filter(Boolean);
              if (words.length > 0) BLOCKED_KEYWORDS = words;
              updated = true;
              continue;
            }

            if (key === 'LIST_NICKNAMES' && valPart.includes('|')) {
              const [zhListStr, enListStr] = valPart.split('|');
              const zhArr = zhListStr.split(',').map(s => s.trim()).filter(Boolean);
              const enArr = enListStr.split(',').map(s => s.trim()).filter(Boolean);
              if (zhArr.length > 0) FUNNY_NICKNAMES.zh = zhArr;
              if (enArr.length > 0) FUNNY_NICKNAMES.en = enArr;
              updated = true;
              continue;
            }

            if (key.startsWith('CHEER_') && valPart.includes('|')) {
              const [zhC, enC] = valPart.split('|').map(s => s.trim());
              if (zhC) parsedCheersZh.push(zhC);
              if (enC) parsedCheersEn.push(enC);
              updated = true;
              continue;
            }

            if (key.startsWith('TIP_') && valPart.includes('|')) {
              const [zhT, enT] = valPart.split('|').map(s => s.trim());
              if (zhT) parsedTipsZh.push(zhT);
              if (enT) parsedTipsEn.push(enT);
              updated = true;
              continue;
            }

            if (valPart.includes('|')) {
              const [zhVal, enVal] = valPart.split('|').map(s => s.trim());
              if (zhVal && typeof I18N.zh[key] !== 'function') I18N.zh[key] = zhVal;
              if (enVal && typeof I18N.en[key] !== 'function') I18N.en[key] = enVal;
              updated = true;
            }
          }

          if (parsedCheersZh.length > 0) QUICK_CHEERS.zh = parsedCheersZh;
          if (parsedCheersEn.length > 0) QUICK_CHEERS.en = parsedCheersEn;
          if (parsedTipsZh.length > 0) ENERGY_TIPS.zh = parsedTipsZh;
          if (parsedTipsEn.length > 0) ENERGY_TIPS.en = parsedTipsEn;

          if (updated) {
            setLanguage(currentLang);
          }
          return;
        } catch (e) {}
      }
    }

    function openTeamGateModal() {
      const modal = document.getElementById('teamGateModal');
      const teamInput = document.getElementById('teamNumberInput');
      const nickInput = document.getElementById('modalNicknameInput');
      const subtitle = document.getElementById('teamModalSubtitle');
      const suffix = document.getElementById('teamMaxSuffix');

      }
      if (nickInput) {

        if (!participantNickname) {

          nickInput.value = pool[Math.floor(Math.random() * pool.length)];
        } else {
          nickInput.value = participantNickname;
        }
      }
      if (subtitle) subtitle.textContent = I18N[currentLang].teamRangeHint(currentCohortScale);
      if (suffix) suffix.textContent = `/ ${currentCohortScale}`;

      renderAvatarPickerGrid();
      updateModalLivePreview();

    function handleSaveTeamNumber(e) {
      e.preventDefault();
      const teamInput = document.getElementById('teamNumberInput');
      const nickInput = document.getElementById('modalNicknameInput');
      const err = document.getElementById('teamInputError');
      const card = document.getElementById('teamGateCard');

      const val = parseInt(teamInput.value, 10);
      const nickVal = (nickInput.value || '').trim();

      if (isNaN(val) || val < 1 || val > currentCohortScale) {
        err.textContent = I18N[currentLang].teamErrRange(currentCohortScale);
        err.classList.remove('hidden');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        return;
      }

      if (!nickVal || !isTextClean(nickVal)) {
        rollRandomNickname();
      }

      participantTeamNumber = val;
      participantNickname = (nickInput.value || '').trim();

      localStorage.setItem('participant_team_num', String(participantTeamNumber));
      localStorage.setItem('participant_nickname', participantNickname);
      localStorage.setItem('participant_avatar_id', String(participantAvatarId));

      syncProfileToHeaderAndBoard();

      const modal = document.getElementById('teamGateModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      renderLiveFastPassPanel();
      if (activeAppView === 'fastpass') renderBundledFastPassDrawer();
    }

    let activeAppView = null;

    function openAppView(viewName, pushToHistory = true) {
      if (viewName === 'fastpass' && (!participantTeamNumber || participantTeamNumber > currentCohortScale)) {
        openTeamGateModal();
        return;
      }

      const drawer = document.getElementById(`appView-${viewName}`);
      if (!drawer) return;

      activeAppView = viewName;
      document.body.style.overflow = 'hidden';

      if (viewName === 'fastpass') {
        renderBundledFastPassDrawer();
      } else if (viewName === 'bc') {
        selectBcType(participantBcStyle || currentInspectedBcType || 'driver', true);
      } else if (viewName === 'drush') {
        syncProfileToHeaderAndBoard();
        const iframe = document.getElementById('drushAppIframe');

          iframe.src = DLR('game');
        }
      } else if (viewName === 'sunrise') {

        if (iframe && iframe.src === 'about:blank') {
          switchSunriseNode(DLR('sunrise'), 0);
        }
      }

      drawer.classList.remove('translate-x-full');
      drawer.classList.add('translate-x-0');

      if (pushToHistory) {
        try {
          window.history.pushState({ appView: viewName }, '', `#${viewName}`);
        } catch (e) {}
      }
    }

    function closeAppView(fromPopState = false) {
      if (!activeAppView) return;
      const closingView = activeAppView;
      const drawer = document.getElementById(`appView-${closingView}`);
      if (drawer) {
        drawer.classList.remove('translate-x-0');
        drawer.classList.add('translate-x-full');
      }

      activeAppView = null;
      document.body.style.overflow = '';

      if (closingView === 'drush') {
        setTimeout(() => {
          if (activeAppView !== 'drush') {
            const iframe = document.getElementById('drushAppIframe');
            if (iframe) iframe.src = 'about:blank';
          }
        }, 320);
        loadDrushHighScore();

      if (!fromPopState && window.location.hash) {
        try { window.history.back(); } catch (e) {}
      }

    function getScheduleForTeam(teamNum, scale) {
      if (!teamNum || teamNum < 1) return null;
      if (scale === 24) {
        return SCHEDULE_MATRIX_24[(teamNum - 1) % SCHEDULE_MATRIX_24.length];
      } else if (scale === 48) {
        return SCHEDULE_MATRIX_48[(teamNum - 1) % SCHEDULE_MATRIX_48.length];
      } else {
        return SCHEDULE_MATRIX_36[(teamNum - 1) % SCHEDULE_MATRIX_36.length];
      }
    }

    function getActiveSlotIndex() {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      for (let i = 0; i < fpTimeSlots.length; i++) {
        if (currentMin >= fpTimeSlots[i].startMin && currentMin <= fpTimeSlots[i].endMin) return i;
      }
      if (currentMin < fpTimeSlots[0].startMin) return -1;
      if (currentMin > fpTimeSlots[fpTimeSlots.length - 1].endMin) return 99;
      for (let i = 0; i < fpTimeSlots.length - 1; i++) {
        if (currentMin > fpTimeSlots[i].endMin && currentMin < fpTimeSlots[i + 1].startMin) return i + 1;
      }
      return -1;
    }

    function timeStrToMin(str) {
      const [h, m] = (str || '00:00').split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    var dlPulseNow = null;
    function dlPulse(k) { return dlPulseNow && Object.prototype.hasOwnProperty.call(dlPulseNow, k) ? { data: dlPulseNow[k], error: null } : null; }
    async function loadFastpassVenueAndTimeConfig() {
      try {
        if (supabaseClient) {
          const { data, error } = dlPulse('fp') || await supabaseClient
            .from('fastpass_config')
            .select('venues, time_slots')
            .eq('id', 1)
            .maybeSingle();

          if (!error && data) {
            if (data.venues && typeof data.venues === 'object') {
              fpStationVenues = { ...fpStationVenues, ...data.venues };
            }
            if (Array.isArray(data.time_slots) && data.time_slots.length === 6) {
              const validSlots = data.time_slots.filter(s => s && s.start && s.end);
              if (validSlots.length === 6) {
                fpTimeSlots = validSlots.map(slot => ({
                  start: slot.start,
                  end: slot.end,
                  startMin: typeof slot.startMin === 'number' ? slot.startMin : timeStrToMin(slot.start),
                  endMin: typeof slot.endMin === 'number' ? slot.endMin : timeStrToMin(slot.end)
                }));
              }
            }
          }
        }
      } catch (e) {
        console.warn("FastPass config fetch error:", e);
      }
      const winEl = document.getElementById('fpCardTimeWindow');
      if (winEl && fpTimeSlots.length === 6) {
        winEl.textContent = `${fpTimeSlots[0].start} - ${fpTimeSlots[5].end}`;
      }
      renderLiveFastPassPanel();
      if (activeAppView === 'fastpass') renderBundledFastPassDrawer();
    }

        box.innerHTML = `
          <div onclick="event.stopPropagation(); openTeamGateModal();" class="col-span-2 p-3.5 rounded-xl bg-black/40 border border-dashed border-lime-400/40 text-center cursor-pointer hover:bg-lime-400/5 transition-colors">

          </div>
        `;
        return;
      }

      const schedule = getScheduleForTeam(participantTeamNumber, currentCohortScale);
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();

      const WINDOW_START = 13 * 60 + 30; // 13:30 (810)
      const WINDOW_END = 18 * 60;        // 18:00 (1080)

      if (currentMin < WINDOW_START) {
        const r1Card = buildMiniStationCardHtml({
          badgeText: t.fpRound1Label,
          badgeStyle: "text-deloitte-green",
          timeText: `${fpTimeSlots[0].start}-${fpTimeSlots[0].end}`,
          stationIdx: schedule[0],
          borderStyle: "bg-deloitte-green/10 border-deloitte-green/40"
        });
        const r2Card = buildMiniStationCardHtml({
          badgeText: t.fpRound2Label,
          badgeStyle: "text-lime-300",
          timeText: `${fpTimeSlots[1].start}-${fpTimeSlots[1].end}`,
          stationIdx: schedule[1],
          borderStyle: "bg-black/50 border-white/15"

      if (currentMin > WINDOW_END) {
        box.innerHTML = `

          </div>
        `;
        return;
      }

      let currentRoundIdx = -1;
      let nextRoundIdx = -1;

      for (let i = 0; i < fpTimeSlots.length; i++) {
        const slot = fpTimeSlots[i];
        if (currentMin >= slot.startMin && currentMin <= slot.endMin) {
          currentRoundIdx = i;
          nextRoundIdx = (i + 1 < fpTimeSlots.length) ? i + 1 : -1;
          break;
        }
        if (currentMin < slot.startMin) {
          currentRoundIdx = -2;
          nextRoundIdx = i;
          break;
        }
      }

      let currentHtml = '';
      if (currentRoundIdx >= 0) {
        currentHtml = buildMiniStationCardHtml({
          badgeText: t.fpCurrentLabel,
          badgeStyle: "text-deloitte-green",
          timeText: `${fpTimeSlots[currentRoundIdx].start}-${fpTimeSlots[currentRoundIdx].end}`,
          stationIdx: schedule[currentRoundIdx],
          borderStyle: "bg-deloitte-green/15 border-deloitte-green/40"
        });
      } else if (currentRoundIdx === -2) {
        currentHtml = `
          <div class="min-h-[92px] p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 flex flex-col justify-between min-w-0">

            <span class="text-[10px] font-bold text-gray-400 uppercase truncate">${t.fpCurrentLabel}</span>
            <div class="text-xs font-bold text-gray-300 truncate mt-1">${t.fpAllDone}</div>
            <div class="text-[10px] text-gray-500 truncate mt-0.5">${t.fpAllDoneSub}</div>
          </div>
        `;
      }

      let nextHtml = '';
      if (nextRoundIdx >= 0 && nextRoundIdx < fpTimeSlots.length) {
        nextHtml = buildMiniStationCardHtml({
          badgeText: t.fpNextLabel,
          badgeStyle: "text-lime-300",
          timeText: `${fpTimeSlots[nextRoundIdx].start}-${fpTimeSlots[nextRoundIdx].end}`,
          stationIdx: schedule[nextRoundIdx],
          borderStyle: "bg-black/50 border-white/15"

            <span class="text-[10px] font-bold text-gray-500 uppercase truncate">${t.fpNextLabel}</span>

            <div class="text-[10px] text-gray-500 truncate mt-0.5">${t.fpAllDoneSub}</div>

    const MSG_COOLDOWN_MS = 60000;

    function isTextClean(rawStr) {
      if (!rawStr) return false;
      const normalized = rawStr.toLowerCase().trim();
      if (normalized.length < 1) return false;
      // No email addresses or phone / ID-length digit runs in public text (the database refuses them too).
      if (/[a-z0-9._%+-]+@[a-z0-9-]+\.[a-z.]{2,}/i.test(rawStr) || /\d{8,}/.test(rawStr.replace(/[\s\-().+]/g, ''))) return false;

      // 1. Block excessive repeated characters (e.g. "aaaaaaa" or "1111111")
      if (/(.)\1{5,}/.test(normalized)) {
        return false;
      }

      // 2. Check against blocked keywords list (from built-in + info.txt)
      for (const word of BLOCKED_KEYWORDS) {
        if (!word) continue;
        if (normalized.includes(word.toLowerCase())) {
          return false;
        }
      }

      return true;
    }

    function getRemainingCooldownSeconds() {
      const lastTs = parseInt(localStorage.getItem('last_msg_post_ts') || '0', 10);
      const diff = Date.now() - lastTs;
      if (diff < MSG_COOLDOWN_MS) {
        return Math.ceil((MSG_COOLDOWN_MS - diff) / 1000);
      }
      return 0;
    }

    function parseNicknameAndAvatar(rawNickname) {
      const str = rawNickname || 'Participant';
      // Supports [av:2|bc:driver] Name (#05) or [av:2] Name (#05)
      const match = str.match(/^\[av:(\d+)(?:\|bc:([a-z]+))?\]\s*(.*)$/);
      if (match) {
        return {
          avatarId: parseInt(match[1], 10) % SVG_AVATARS.length,
          bcStyle: match[2] || '',
          displayName: match[3] || 'Participant'
        };
      }
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash * 31 + str.charCodeAt(i)) % SVG_AVATARS.length;
      }
      return { avatarId: Math.abs(hash), bcStyle: '', displayName: str };
    }

    async function handlePostMessage(e) {
      e.preventDefault();
      if (getRemainingCooldownSeconds() > 0) {
        startCooldownTimer();
        return;
      }

      if (!participantTeamNumber || !participantNickname) {
        openTeamGateModal();
        return;
      }

      const contentInput = document.getElementById('msgContent');
      const btn = document.getElementById('msgSubmitBtn');
      const content = contentInput.value.trim();
      if (!content) return;

      // Client-side moderation check
      if (!isTextClean(content)) {
        showModerationAlert();
        return;
      }

      hideModerationAlert();
      btn.disabled = true;

      if (content.toLowerCase().includes("together makes progress") || content.includes("众行致远")) {
        showEasterEggModal(I18N[currentLang].eggValueMsg);
      }

      const bcPart = participantBcStyle ? `|bc:${participantBcStyle}` : '';
      const formattedNickname = `[av:${participantAvatarId}${bcPart}] ${participantNickname} (#${String(participantTeamNumber).padStart(2, '0')})`;

      const newMsg = {
        nickname: formattedNickname,
        message: content,
        content: content,
        created_at: new Date().toISOString()
      };

      try {
        if (supabaseClient) {
          const { error } = await supabaseClient.from('participant_messages').insert([newMsg]);
          if (error) throw error;
        }
        localStorage.setItem('last_msg_post_ts', String(Date.now()));
        contentInput.value = '';
        startCooldownTimer();
        await loadMessages();
      } catch (err) {
        console.warn("Save message err:", err);
        btn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

.dot{display:inline-block;width:.55em;height:.55em;background:var(--green);margin-left:.2em;box-shadow:0 0 8px rgba(134,188,37,.9)}
.brand .sub{font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:.3px;white-space:nowrap}
.dock{display:flex;gap:5px;flex-shrink:0}
.icon-btn{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#e5e7eb;font-size:15px;display:grid;place-items:center;padding:0 7px;cursor:pointer;touch-action:manipulation;line-height:1}
.icon-btn:active{transform:translateY(1px);background:rgba(255,255,255,.12)}
.icon-btn.gold{border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.12)}
.icon-btn.lang{font:800 11px var(--sans);color:var(--green);border-color:rgba(134,188,37,.45);background:rgba(134,188,37,.12)}

/* HUD */
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#090c12;border:1px solid var(--line);border-radius:12px;padding:6px 6px 5px;flex-shrink:0}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.stat .k{font:7px var(--pixel);color:var(--muted);white-space:nowrap}
.stat .v{font:10px var(--pixel);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stat.rank{cursor:pointer}
.stat.rank .v{color:#67e8f9;font-size:8px;line-height:10px}
#hudScore{color:var(--green)}
.meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#cbd5e1;border-top:1px solid var(--line);padding-top:5px;margin-top:1px;gap:8px;min-width:0}
.meta .loc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.meta .right{display:flex;align-items:center;gap:8px;flex-shrink:0;font:8px var(--pixel)}
#hudCombo{color:var(--gold)}
#hudClock{color:#e2e8f0}

/* Stage */
.stage{flex:1;min-height:150px;position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;touch-action:none;isolation:isolate;transform:translateZ(0);-webkit-mask-image:-webkit-radial-gradient(white,black)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
canvas.green{filter:grayscale(1) sepia(1) hue-rotate(45deg) saturate(3.5) brightness(.95)}
canvas.sepia{filter:sepia(.75) contrast(1.05)}
.crt{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.28) 50%);background-size:100% 4px;opacity:.4;z-index:5}
.pause-fab{position:absolute;top:6px;right:6px;z-index:15;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid var(--line);color:#fff;font-size:13px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.toast{position:absolute;top:8px;left:50%;transform:translate(-50%,-160%);z-index:16;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.9);border:1px solid rgba(134,188,37,.7);color:var(--green);font-size:11px;font-weight:800;transition:transform .22s ease;max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.banner{position:absolute;left:0;right:0;top:30%;z-index:14;text-align:center;pointer-events:none;opacity:0;padding:0 10px}
.banner .b1{font:14px var(--pixel);color:var(--gold);text-shadow:2px 2px 0 #000;line-height:1.5}
.banner .b2{font:9px var(--pixel);color:#fff;text-shadow:1px 1px 0 #000;margin-top:6px;line-height:1.5}
.banner.show{animation:bannerAnim 1.9s ease-out forwards}
@keyframes bannerAnim{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.pills{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:4px;pointer-events:none}
.pill{font:7px var(--pixel);padding:4px 7px;border-radius:999px;background:rgba(0,0,0,.82);border:1px solid;white-space:nowrap}

/* Overlays inside the stage */
.overlay{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;padding:12px;background:rgba(7,10,15,.95);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.overlay.show{display:flex}
.inner{margin:auto;width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(134,188,37,.1);border:1px solid rgba(134,188,37,.3);color:var(--green);font-size:9px;font-weight:800;letter-spacing:.4px}
.title{font:22px var(--pixel);letter-spacing:2px;animation:glow 2s infinite;cursor:pointer;display:flex;align-items:center}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 3px rgba(134,188,37,.4))}50%{filter:drop-shadow(0 0 10px rgba(134,188,37,.9))}}
.lbl{width:100%;display:flex;justify-content:space-between;font-size:10px;color:#cbd5e1;padding:0 2px}
#nameInput{width:100%;font-size:16px;padding:9px 10px;border-radius:10px;background:#000;border:1px solid rgba(255,255,255,.22);color:#fff;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;outline:none}
#nameInput:focus{border-color:var(--green)}
.sub-txt{font-size:12px;color:#d1d5db;line-height:1.45;margin:0}
.sub-txt b{color:#fcd34d}
.hint{font-size:10px;color:var(--muted);line-height:1.4}
.btn{border:0;border-radius:12px;padding:13px 14px;font:11px var(--pixel);cursor:pointer;width:100%;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--green);color:#081002;box-shadow:inset -2px -3px 0 #385e0c,inset 2px 2px 0 #b6f047,0 3px 0 #05080b}
.btn.primary:active{transform:translateY(2px);box-shadow:inset -1px -1px 0 #385e0c,0 1px 0 #05080b}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff}
.btn.goldb{background:rgba(245,158,11,.16);border:1px solid rgba(245,158,11,.4);color:#fcd34d}
.row{display:flex;gap:8px;width:100%}
.row .btn{flex:1}
.go-title{font:12px var(--pixel);color:#fb7185;line-height:1.5}
.go-reason{font-size:12px;color:#d1d5db;margin:0;line-height:1.4}
.metrics{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.metric{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:7px 4px}
.metric .k{font:7px var(--pixel);color:var(--muted)}
.metric .v{font:10px var(--pixel);margin-top:5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newbest{font:9px var(--pixel);color:var(--gold);animation:glow 1.2s infinite}
.sync{font-size:10px;color:#cbd5e1}
.tip{width:100%;background:#121924;border-left:3px solid var(--green);border-radius:0 10px 10px 0;padding:8px 10px;text-align:left}
.tip .h{font-size:9px;font-weight:800;color:var(--green);letter-spacing:.5px;text-transform:uppercase}
.tip p{margin:4px 0 0;font-size:11.5px;color:#e5e7eb;line-height:1.45}
.newach{font-size:11px;color:#fcd34d;line-height:1.5}

/* Quiz */
.quiz-head{font:9px var(--pixel);color:var(--gold)}
.quiz-q{font-size:14px;font-weight:800;line-height:1.4;color:#fff;margin:0}
.qbar{width:100%;height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;width:100%;background:var(--green);transform-origin:left center}
.opts{width:100%;display:flex;flex-direction:column;gap:7px}
.opt{width:100%;text-align:left;padding:11px 12px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px;line-height:1.35;font-family:var(--sans);font-weight:600;cursor:pointer;touch-action:manipulation}
.opt:active{background:rgba(255,255,255,.12)}
.opt.right{background:rgba(134,188,37,.22);border-color:var(--green)}
.opt.wrong{background:rgba(244,63,94,.18);border-color:var(--red)}
.quiz-ex{font-size:12px;color:#d1d5db;line-height:1.45;min-height:1em;margin:0}

/* Controls */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:clamp(64px,12vh,92px);flex-shrink:0;touch-action:none}
.ctrl{border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:11px var(--pixel);touch-action:none;cursor:pointer;transition:transform .05s}
.ctrl .ar{font-size:20px;line-height:1;font-family:var(--sans);font-weight:900}
.ctrl.slide{background:var(--slate);border:1px solid rgba(56,189,248,.35);color:#7dd3fc;box-shadow:inset -2px -2px 0 rgba(0,0,0,.6),inset 2px 2px 0 rgba(255,255,255,.12),0 3px 0 #000}
.ctrl.jump{background:var(--green);border:1px solid #a3e635;color:#081002;box-shadow:inset -2px -3px 0 #385e0c,inset 2px 2px 0 #b6f047,0 3px 0 #05080b}
.ctrl.down{transform:translateY(2px);filter:brightness(1.18)}

/* Modals */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.84);padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.modal.show{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:420px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font:10px var(--pixel);line-height:1.4}
.sheet-b{padding:12px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:13px;line-height:1.5;color:#d1d5db;touch-action:pan-y;flex:1;min-height:0}
.sheet-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted)}
.close-x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:16px;cursor:pointer;flex-shrink:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font:8px var(--pixel);cursor:pointer}
.tab.on{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.5);color:#fcd34d}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);margin-bottom:6px}
.lb-row.me{border-color:rgba(134,188,37,.6);background:rgba(134,188,37,.1)}
.lb-pos{width:24px;text-align:center;font:10px var(--pixel);color:var(--muted);flex-shrink:0}
.lb-main{flex:1;min-width:0}
.lb-name{font-weight:800;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-sub{font-size:10px;color:#67e8f9}
.lb-score{font:10px var(--pixel);color:var(--green);flex-shrink:0}
.center-msg{text-align:center;padding:28px 0;color:var(--muted);font-size:12px}
.sheet-b h4{margin:12px 0 6px;font-size:12px;color:#fff}
.sheet-b h4:first-child{margin-top:0}
.sheet-b ul{margin:0;padding-left:18px}
.sheet-b li{margin-bottom:4px}
.g{color:var(--green)}.r{color:#fb7185}.c{color:#7dd3fc}.y{color:#fcd34d}
.ach{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);margin-bottom:6px}
.ach .e{font-size:22px;line-height:1;width:28px;text-align:center;flex-shrink:0}
.ach.locked .e{filter:grayscale(1);opacity:.35}
.ach .n{font-weight:800;color:#fff;font-size:13px}
.ach.locked .n{color:#9ca3af}
.ach .d{font-size:11px;color:#cbd5e1;line-height:1.4}
.ach .tag{font:7px var(--pixel);color:var(--gold);margin-left:4px}
.setting-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.mini{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:12px;font-weight:700;cursor:pointer}

/* Phone in landscape: controls move to the sides of the playfield */
@media (orientation:landscape) and (max-height:540px){
  .app{max-width:none;display:grid;grid-template-columns:minmax(82px,13vw) minmax(0,1fr) minmax(82px,13vw);grid-template-rows:auto auto minmax(0,1fr);gap:5px;padding:4px 8px 6px}
  header{grid-column:1/-1}
  .hud{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,2.2fr);padding:4px 6px}
  .meta{grid-column:auto;border:0;padding:0;margin:0}
  .brand .sub{display:none}
  .icon-btn{height:30px;min-width:32px}
  .logo{width:28px;height:28px}
  .stage{grid-column:2;grid-row:3;min-height:0}
  .controls{display:contents}
  .ctrl.slide{grid-column:1;grid-row:3}
  .ctrl.jump{grid-column:3;grid-row:3}
}
@media (max-width:350px){
  .icon-btn{min-width:32px;height:32px;font-size:13px;padding:0 5px}
  .brand .name{font-size:9px}
}
@media (prefers-reduced-motion:reduce){
  .title,.newbest{animation:none}
}

<div class="app">

  <section class="controls">

<@@DLC@@ Leaderboard -->
<div class="modal" id="lbModal">
  <div class="sheet">

/* ============================================================

   ============================================================ */
const Sfx = {
  ctx: null, master: null, nb: null,
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.22;
        this.master.connect(this.ctx.destination);
        const b = this.ctx.createBuffer(1, 1, 22050), s = this.ctx.createBufferSource();
        s.buffer = b; s.connect(this.ctx.destination); s.start(0);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
    } catch (e) {}
  },
  tone(f, dur, type = 'square', vol = 0.5, f2 = 0, delay = 0) {
    const c = this.ctx, tt = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, tt);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, tt + dur);
    g.gain.setValueAtTime(0.0001, tt);
    g.gain.exponentialRampToValueAtTime(vol, tt + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
    o.connect(g); g.connect(this.master); o.start(tt); o.stop(tt + dur + 0.03);
  },
  noise(dur, vol = 0.4) {
    const c = this.ctx;
    if (!this.nb) {
      this.nb = c.createBuffer(1, Math.floor(c.sampleRate * 0.5), c.sampleRate);
      const d = this.nb.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter(), tt = c.currentTime;
    s.buffer = this.nb; f.type = 'lowpass'; f.frequency.value = 1800;
    g.gain.setValueAtTime(vol, tt); g.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(tt); s.stop(tt + dur);
  },
  seq(notes, step, type = 'square', vol = 0.3) { notes.forEach((f, i) => this.tone(f, step * 1.4, type, vol, 0, i * step)); },
  play(name, arg) {
    if (!settings.sound || !this.ctx || this.ctx.state !== 'running') return;
    try {
      switch (name) {
        case 'jump': this.tone(420, 0.12, 'square', 0.3, 860); break;
        case 'slide': this.noise(0.14, 0.3); break;
        case 'dot': this.tone(660 * Math.pow(2, Math.min(arg || 0, 24) / 24), 0.07, 'triangle', 0.4); break;
        case 'power': this.seq([523, 659, 784, 1047], 0.06); break;
        case 'promo': this.seq([392, 523, 659, 784, 659, 784, 1047], 0.075); break;
        case 'egg': this.seq([784, 988, 1175, 1568, 1319, 1568, 2093], 0.06); break;
        case 'good': this.seq([659, 880, 1175], 0.07, 'triangle', 0.4); break;
        case 'bad': this.tone(300, 0.2, 'square', 0.25, 180); break;
        case 'hit': this.tone(220, 0.35, 'sawtooth', 0.45, 55); this.noise(0.25, 0.35); break;
        case 'smash': this.noise(0.08, 0.3); this.tone(180, 0.08, 'square', 0.25, 90); break;
        case 'near': this.tone(988, 0.05, 'square', 0.18); this.tone(1319, 0.06, 'square', 0.18, 0, 0.05); break;
        case 'shield': this.tone(880, 0.2, 'triangle', 0.4, 440); break;
      }
    } catch (e) {}
  }
};

function makeLayer(color, wins, minH, maxH, seed, winAlpha) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); const r = mulberry(seed);
  let x = 0;
  while (x < W) {
    let bw = 26 + Math.floor(r() * 36);
    if (W - x < 34) bw = W - x;
    const bh = Math.floor(minH + r() * (maxH - minH)), top = FLOOR - bh;

    if (r() < 0.25) g.fillRect(x + 3, top - 4, bw - 6, 4);

function setFont(px) { ctx.font = `${px}px "Press Start 2P", ui-monospace, Menlo, monospace`; }

class Obstacle {

class Item {

      const dx = (P.x + P.w / 2) - (this.x + 6), dy = (P.y + P.h / 2) - (this.y + 6), d = Math.hypot(dx, dy);

class Npc {
  constructor(x) {
    const r = Math.random();
    this.kind = r < 0.15 ? 'PARTNER' : r < 0.45 ? 'COACH' : 'BUDDY';
    this.x = x; this.y = FLOOR - 34; this.w = 18; this.h = 34; this.met = false; this.dead = false;

  update(sp) { this.x -= sp; if (this.x < -60) this.dead = true; }
  draw() {
    const x = Math.floor(this.x), y = Math.floor(this.y);
    const c = { BUDDY: ['#38BDF8', '#004F59', '#86BC25', '#475569'], COACH: ['#a3e635', '#1E3A5F', '#38BDF8', '#78350f'], PARTNER: ['#F59E0B', '#002776', '#F59E0B', '#cbd5e1'] }[this.kind];
    if (!this.met) drawText(`[${this.kind}]`, x + 9, y - 8 + Math.sin(frame * 0.1) * 1.5, c[0], 5);
    else drawText('✓', x + 9, y - 8, '#86BC25', 7);
    ctx.fillStyle = c[3]; ctx.fillRect(x + 3, y, 12, 5);
    ctx.fillStyle = '#e8b48a'; ctx.fillRect(x + 4, y + 4, 10, 8);

    ctx.fillStyle = c[1]; ctx.fillRect(x + 3, y + 12, 13, 11);
    ctx.fillStyle = c[2]; ctx.fillRect(x + 8, y + 12, 3, 7);

    ctx.fillStyle = c[1]; ctx.fillRect(x, y + 13 + wave, 3, 7);
    ctx.fillStyle = '#1E293B'; ctx.fillRect(x + 4, y + 23, 4, 9); ctx.fillRect(x + 10, y + 23, 4, 9);

function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 4 - speed * 0.2, vy: (Math.random() - 0.8) * 3, s: 2 + Math.floor(Math.random() * 3), life: 20, color });
  if (particles.length > 160) particles.splice(0, particles.length - 160);
}
function dust(x, y) { for (let i = 0; i < 4; i++) particles.push({ x: x + rand(-4, 4), y: y - 2, vx: -speed * 0.3 - Math.random(), vy: -Math.random() * 0.8, s: 2, life: 14, color: 'rgba(203,213,225,0.6)' }); }
function floatText(text, x, y, color = '#86BC25') { floats.push({ text, x, y, color, life: 48 }); if (floats.length > 12) floats.shift(); }

function addScore(base, x, y, color, mult = false) {
  let v = base * (mult ? comboMult() : 1) * (phase.type === 'BUSY' ? 1.5 : 1);
  v = Math.round(v); score += v;
  if (x !== undefined) floatText('+' + v, x, y, color);
  return v;
}

/* ============================================================
   SPAWNING
   ============================================================ */
function pickWeighted(pool) {
  let total = 0; for (const p of pool) total += p[1];
  let r = Math.random() * total;
  for (const p of pool) { if ((r -= p[1]) <= 0) return p[0]; }
  return pool[0][0];
}
function chooseObstacle() {
  const pool = [['REF', 10]];
  if (dist > 40) pool.push(['FILE', 7]);
  if (dist > 80) pool.push(['EMAIL', run.emailBoost ? 12 : 6]);
  if (dist > 140) pool.push(['SCOPE', 6]);
  if (dist > 260) pool.push(['DREF', 4]);
  if (dist > 380) pool.push(['DEADLINE', 5]);
  if (dist > 480) pool.push(['COMBO', 4]);
  return pickWeighted(pool);
}
function pickPower() {
  const p = pickWeighted([['COFFEE', 28], ['SHIELD', 24], ['MAGNET', 26], ['TIMESHEET', 22]]);
  if (p === 'COFFEE' && !run.gold && Math.random() < 0.06) return 'GOLD';
  return p;
}
function dotLine(x, n = 5) { for (let i = 0; i < n; i++) items.push(new Item('DOT', x + i * 22, FLOOR - 24)); }
function dotArc(cx) {
  for (let i = 0; i < 5; i++) {
    const dx = (i - 2) * 22, k = 1 - Math.pow(dx / 70, 2);
    items.push(new Item('DOT', cx + dx - 6, FLOOR - 23 - 62 * k));
  }
}
function spawnPattern() {
  const sp = speed, air = 36, x = W + 20;
  if (phase.type === 'LEAVE') {
    Math.random() < 0.5 ? dotLine(x, 6) : dotArc(x + 50);
    spawnGap = 150 + Math.random() * 60;
    return;
  }
  const type = chooseObstacle();
  let extra = 0, lastW = 30;
  if (type === 'COMBO') {
    obstacles.push(new Obstacle('REF', x));
    const x2 = x + Math.round(sp * air) + 40;
    obstacles.push(new Obstacle('EMAIL', x2));
    extra = x2 - x; lastW = 26;
  } else {
    const o = new Obstacle(type, x); obstacles.push(o); lastW = o.w;
    if (!o.fly && type !== 'DEADLINE' && Math.random() < 0.45) dotArc(x + o.w / 2);
  }
  const busy = phase.type === 'BUSY';
  const minGap = sp * air + 70;
  const gap = extra + minGap + Math.random() * sp * (busy ? 14 : 34);
  spawnGap = gap;
  const lastEnd = x + extra + lastW, nextStart = x + gap;
  const mid = (lastEnd + nextStart) / 2;
  if (nextStart - lastEnd < 110) return;
  if (dist >= next.npc) { npcs.push(new Npc(mid - 9)); next.npc = dist + 120 + Math.random() * 90; }
  else if (dist >= next.quiz) { items.push(new Item('QUIZ', mid - 6, FLOOR - 34)); next.quiz = dist + 260 + Math.random() * 160; }
  else if (dist >= next.power) { items.push(new Item(pickPower(), mid - 6, FLOOR - 32)); next.power = dist + 100 + Math.random() * 110; }
  else if (Math.random() < 0.55 && nextStart - lastEnd > 150) dotLine(mid - 44, 5);
}

/* ============================================================
   COLLISION
   ============================================================ */
function hit(a, b, pad = 4) {
  return a.x + pad < b.x + b.w - pad && a.x + a.w - pad > b.x + pad && a.y + pad < b.y + b.h - pad && a.y + a.h - pad > b.y + pad;
}

/* ============================================================
   MAIN STEP
   ============================================================ */
function stepWorld() {
  const phaseMul = phase.type === 'BUSY' ? 1.12 : phase.type === 'LEAVE' ? 0.92 : 1;
  speed = Math.min(MAX_SPEED, BASE_SPEED + dist * RAMP) * phaseMul;
  const dm = speed * 0.06;
  dist += dm; scroll += speed;
  score += dm * 5 * (phase.type === 'BUSY' ? 1.5 : 1);

  if (coffee > 0) coffee--;
  if (magnet > 0) magnet--;
  if (comboT > 0) comboT--; else combo = 0;
  if (shake > 0) shake *= 0.85;

  // Phases: Busy Season -> Annual Leave -> Normal
  if (phase.type === 'NORMAL' && dist >= nextBusyAt) { phase = { type: 'BUSY', t: 60 * 18 }; banner(t('busy'), t('busySub')); Sfx.play('power'); buzz(40); }
  else if (phase.type === 'BUSY' && --phase.t <= 0) { phase = { type: 'LEAVE', t: 60 * 6 }; banner(t('leave'), t('leaveSub')); Sfx.play('good'); }
  else if (phase.type === 'LEAVE' && --phase.t <= 0) { phase = { type: 'NORMAL', t: 0 }; nextBusyAt = dist + 380; }

  // Promotions
  const ri = rankIndex(dist);
  if (ri > run.rank) {
    run.rank = ri;
    const isPartner = ri === RANK_AT.length - 1;
    banner(t('promoted'), isPartner ? `${rankName(ri)} · ${t('partnerSub')}` : rankName(ri));
    addScore(isPartner ? 1845 : 200, P.x + 8, P.y - 10, '#F59E0B');
    Sfx.play('promo'); buzz([30, 40, 30]);
    burst(P.x + 8, P.y, '#F59E0B', 16);
    if (ri >= 4) unlock('manager');
    if (isPartner) unlock('partner');
  }

  // Office clock
  const hour = officeHour();
  if (!run.sixpm && hour >= 18) { run.sixpm = true; run.emailBoost = true; toast(t('sixpm')); }

  P.update();
  spawnGap -= speed;
  if (spawnGap <= 0) spawnPattern();

  for (let i = npcs.length - 1; i >= 0; i--) {
    const n = npcs[i]; n.update(speed);
    if (!n.met && hit(P, n, 2)) {
      n.met = true; run.buddies++;
      const pts = n.kind === 'PARTNER' ? 800 : n.kind === 'COACH' ? 400 : 250;
      addScore(pts, n.x + 9, n.y - 4, n.kind === 'PARTNER' ? '#F59E0B' : '#86BC25');
      if (n.kind === 'COACH') P.shield = true;
      toast(t(n.kind.toLowerCase()));
      Sfx.play('power'); buzz(25); burst(n.x + 9, n.y + 10, n.kind === 'PARTNER' ? '#F59E0B' : '#86BC25', 12);
      if (run.buddies >= 4) unlock('buddy');
    }
    if (n.dead) npcs.splice(i, 1);
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i]; o.update(speed);
    if (o.x < P.x + P.w && o.x + o.w > P.x) {
      const gv = P.y + P.h <= o.y ? o.y - (P.y + P.h) : (P.y >= o.y + o.h ? P.y - (o.y + o.h) : 0);
      if (gv < o.minGap) o.minGap = gv;
    }
    if (hit(P, o)) {
      if (coffee > 0) { smash(o); obstacles.splice(i, 1); addScore(100, o.x, o.y - 4, '#fb7185'); continue; }
      if (P.invuln > 0) continue;
      if (P.shield) { P.shield = false; P.invuln = 70; smash(o); obstacles.splice(i, 1); toast(t('shieldSaved')); Sfx.play('shield'); buzz(60); continue; }
      die(o.type); return;
    }
    if (!o.passed && o.x + o.w < P.x) {
      o.passed = true; addScore(40);
      if (o.minGap <= 7 && P.invuln <= 0 && coffee <= 0) {
        run.close++; addScore(60, P.x + 8, P.y - 6, '#FCD34D');
        floatText(t('closeCall'), P.x + 8, P.y - 16, '#FCD34D');
        Sfx.play('near'); buzz(12);
        if (run.close >= 8) unlock('close');
      }
    }
    if (o.dead) obstacles.splice(i, 1);
  }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i]; it.update(speed);
    if (hit(P, it, 1)) { collect(it); items.splice(i, 1); if (state !== 'PLAYING') return; continue; }
    if (it.dead) items.splice(i, 1);
  }
  updateParticles();
}

function smash(o) { burst(o.x + o.w / 2, o.y + o.h / 2, '#E11D48', 10); Sfx.play('smash'); shake = Math.max(shake, 3); }

function collect(it) {
  const cx = it.x + 6, cy = it.y;
  switch (it.type) {
    case 'DOT':
      combo++; comboT = 100; run.maxCombo = Math.max(run.maxCombo, combo);
      addScore(50, cx, cy - 4, '#86BC25', true); Sfx.play('dot', combo);
      burst(cx, cy + 6, '#86BC25', 4);
      if (combo >= 25) unlock('combo');
      break;
    case 'COFFEE': coffee = 240; addScore(150, cx, cy); toast(t('coffee')); Sfx.play('power'); buzz(30); break;
    case 'GOLD': run.gold = true; coffee = 360; addScore(1845, cx, cy, '#FCD34D'); toast(t('golden')); Sfx.play('egg'); buzz([40, 30, 40]); burst(cx, cy, '#FCD34D', 18); unlock('golden'); break;
    case 'SHIELD': P.shield = true; addScore(100, cx, cy, '#38BDF8'); toast(t('shield')); Sfx.play('power'); break;
    case 'MAGNET': magnet = 420; addScore(100, cx, cy, '#f87171'); toast(t('magnet')); Sfx.play('power'); break;
    case 'TIMESHEET': addScore(500, cx, cy, '#4ade80'); toast(t('timesheet')); Sfx.play('good'); buzz(20); break;
    case 'QUIZ': openQuiz(); break;
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.08; if (--p.life <= 0) particles.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.y -= 0.6; if (--f.life <= 0) floats.splice(i, 1); }
}
function updateWeather() {
  if (weather.type === 'RAIN') for (const p of weatherP) { p.x += p.vx; p.y += p.vy; if (p.y > FLOOR) { p.y = -10; p.x = Math.random() * (W + 40); } }
  else if (weather.type === 'SPARKLE') for (const p of weatherP) { p.x += p.vx - 0.3; p.y += p.vy; if (p.y < 0 || p.x < 0) { p.y = FLOOR; p.x = Math.random() * W; } }
}
function officeHour() { return (run.startHour + dist / 110) % 24; }

function tick() {
  frame++;
  updateWeather();
  if (state === 'PLAYING') stepWorld();
  else if (state === 'DYING') { updateParticles(); shake *= 0.9; if (--dyingT <= 0) showGameOver(); }
  else if (state === 'QUIZ') stepQuiz();
  else if (state === 'START' || state === 'GAMEOVER') { scroll += 1.2; if (state === 'START') P.run += 0.2; updateParticles(); }
  if (frame % 5 === 0) updateHUD();
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  ctx.save();
  if (shake > 0.5) ctx.translate(Math.round(rand(-shake, shake)), Math.round(rand(-shake, shake)));
  ctx.fillStyle = skyGrad; ctx.fillRect(-10, -10, W + 20, FLOOR + 10);

  const h = state === 'START' ? 9 : officeHour();
  let night = (h >= 18 || h < 6) ? 0.5 : h >= 16 ? (h - 16) / 2 * 0.5 : 0;
  if (run.nightOwl) night = 0.55;

  for (const s of stars) { ctx.globalAlpha = 0.25 + 0.5 * night + ((frame / 20 + s.tw) % 6 < 0.6 ? 0.3 : 0); ctx.fillStyle = '#fff'; ctx.fillRect(Math.floor((s.x - scroll * 0.02 + W * 10) % W), Math.floor(s.y), s.s, s.s); }
  ctx.globalAlpha = 1;
  // sun / moon
  const by = 34 + night * 30;
  if (night > 0.25 || weather.type === 'CLEAR') { ctx.fillStyle = '#e2e8f0'; ctx.fillRect(W - 72, by, 14, 14); ctx.fillRect(W - 74, by + 2, 18, 10); ctx.fillStyle = loc.sky[0]; ctx.fillRect(W - 66, by, 8, 8); }
  else { ctx.fillStyle = weather.type === 'SUNSET' ? '#fb923c' : '#fde68a'; ctx.fillRect(W - 76, by, 18, 18); ctx.fillRect(W - 79, by + 3, 24, 12); ctx.fillRect(W - 73, by - 3, 12, 24); }

  if (weather.type === 'SUNSET') { const g = ctx.createLinearGradient(0, FLOOR - 120, 0, FLOOR); g.addColorStop(0, 'rgba(251,146,60,0)'); g.addColorStop(1, 'rgba(251,146,60,0.35)'); ctx.fillStyle = g; ctx.fillRect(0, FLOOR - 120, W, 120); }

  const fo = Math.floor((scroll * 0.2) % W);
  ctx.globalAlpha = 0.7; ctx.drawImage(farLayer, -fo, 0); ctx.drawImage(farLayer, W - fo, 0); ctx.globalAlpha = 1;
  const no = Math.floor((scroll * 0.55) % W);
  ctx.drawImage(nearLayer, -no, 0); ctx.drawImage(nearLayer, W - no, 0);

  if (night > 0) { ctx.fillStyle = `rgba(2,4,20,${night * 0.6})`; ctx.fillRect(0, 0, W, FLOOR); }

  if (weather.type === 'RAIN') { ctx.strokeStyle = 'rgba(147,197,253,0.45)'; ctx.lineWidth = 1; ctx.beginPath(); for (const p of weatherP) { ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.vx, p.y + p.l); } ctx.stroke(); }
  else if (weather.type === 'SPARKLE') { ctx.fillStyle = 'rgba(134,188,37,0.75)'; for (const p of weatherP) ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.s, p.s); }

  // ground
  ctx.fillStyle = loc.ground; ctx.fillRect(-10, FLOOR, W + 20, H - FLOOR + 10);
  ctx.fillStyle = phase.type === 'BUSY' && frame % 30 < 15 ? '#F43F5E' : loc.accent; ctx.fillRect(-10, FLOOR, W + 20, 3);
  ctx.fillStyle = '#1e293b'; ctx.fillRect(-10, FLOOR + 3, W + 20, 2);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  const go = Math.floor(scroll % 32);
  for (let x = -go; x < W; x += 32) { ctx.fillRect(x, FLOOR + 14, 14, 2); ctx.fillRect(x + 16, FLOOR + 28, 10, 2); }

  for (const it of items) it.draw();
  for (const n of npcs) n.draw();
  for (const o of obstacles) o.draw();
  if (state !== 'GAMEOVER' || true) P.draw();
  for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life / 10); ctx.fillStyle = p.color; ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.s, p.s); }
  ctx.globalAlpha = 1;
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life / 15); drawText(f.text, Math.floor(f.x), Math.floor(f.y), f.color, 6); }
  ctx.globalAlpha = 1;
  if (state === 'DYING') { ctx.fillStyle = `rgba(225,29,72,${dyingT / 45 * 0.35})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

/* ============================================================
   LOOP (fixed 60 Hz timestep: same speed on 60/90/120/144 Hz screens)
   ============================================================ */
let lastT = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  let dt = ts - lastT; lastT = ts;
  if (dt > 200) dt = STEP;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 5) { tick(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render();
}

   QUIZ
   ============================================================ */
let quizRecent = [];
function openQuiz() {
  let idx, guard = 0;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (quizRecent.includes(idx) && ++guard < 30);
  quizRecent.push(idx); if (quizRecent.length > 6) quizRecent.shift();
  const q = QUIZ[idx];
  const order = q.a.map((_, i) => i).sort(() => Math.random() - 0.5);
  quiz = { q, order, t: 600, max: 600, done: false, after: 0 };
  input.jumpHeld = input.slideHeld = false; input.jumpBuf = 0;
  state = 'QUIZ';
  $('quizQ').textContent = q.q[settings.lang];
  $('quizEx').textContent = '';
  $('quizBar').style.transform = 'scaleX(1)';
  const box = $('quizOpts'); box.innerHTML = '';
  order.forEach((ai, pos) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = `${'ABC'[pos]}. ${q.a[ai][settings.lang]}`;
    b.addEventListener('click', (e) => { e.stopPropagation(); answerQuiz(ai); });
    box.appendChild(b);
  });
  show('quizOverlay');
  Sfx.play('power');
}
function stepQuiz() {
  if (!quiz) return;
  if (quiz.done) { if (--quiz.after <= 0) closeQuiz(); return; }
  quiz.t--;
  $('quizBar').style.transform = `scaleX(${Math.max(0, quiz.t / quiz.max)})`;
  if (quiz.t <= 0) answerQuiz(-1);
}
function answerQuiz(ai) {
  if (!quiz || quiz.done) return;
  quiz.done = true; quiz.after = 150;
  const right = ai === 0;
  [...$('quizOpts').children].forEach((b, pos) => {
    const idx = quiz.order[pos];
    if (idx === 0) b.classList.add('right'); else if (idx === ai) b.classList.add('wrong');
  });
  const head = right ? t('quizRight') : ai === -1 ? t('quizTime') : t('quizWrong');
  $('quizEx').textContent = `${head} ${quiz.q.ex[settings.lang]} (${t('tapContinue')})`;
  if (right) {
    addScore(500, P.x + 8, P.y - 10, '#FCD34D');
    stats.quizRight++; saveStats();
    if (stats.quizRight >= 5) unlock('quiz');
    Sfx.play('good'); buzz(25);

}

}

/* ============================================================
   INPUT (Pointer Events with touch/mouse fallback)
   ============================================================ */
function pressJump() {
  if (anyModal()) return;
  if (state === 'START') { startGame(); return; }
  if (state === 'GAMEOVER') { if (performance.now() - gameOverAt > 700) startGame(); return; }
  if (state !== 'PLAYING') return;
  input.jumpHeld = true; input.jumpBuf = 8;
}
function releaseJump() { input.jumpHeld = false; }
function pressSlide() {
  if (anyModal() || state !== 'PLAYING') return;
  input.slideHeld = true;
  if (P.grounded && !P.sliding) P.startSlide();
}

function bindHold(el, down, up) {
  const d = (e) => { if (e.cancelable) e.preventDefault(); Sfx.unlock(); el.classList.add('down'); down(); };
  const u = () => { el.classList.remove('down'); up(); };
  if (window.PointerEvent) {
    el.addEventListener('pointerdown', (e) => { try { el.setPointerCapture(e.pointerId); } catch (_) {} d(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((n) => el.addEventListener(n, u));
  } else {
    el.addEventListener('touchstart', d, { passive: false });
    el.addEventListener('touchend', u); el.addEventListener('touchcancel', u);
    el.addEventListener('mousedown', d); window.addEventListener('mouseup', u);
  }
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
bindHold($('btnJump'), pressJump, releaseJump);
bindHold($('btnSlide'), pressSlide, releaseSlide);

// Canvas: top zone = jump, bottom zone = slide; swipes feed the konami detector
const touches = new Map();
function canvasDown(id, cx, cy) {
  Sfx.unlock();
  if (state !== 'PLAYING') { if (state === 'GAMEOVER' || state === 'START') pressJump(); return; }
  const r = canvas.getBoundingClientRect();
  const zone = (cy - r.top) > r.height * 0.55 ? 'S' : 'J';
  touches.set(id, { zone, x: cx, y: cy, t: performance.now() });
  zone === 'J' ? pressJump() : pressSlide();
}
function canvasUp(id, cx, cy) {
  const a = touches.get(id); if (!a) return; touches.delete(id);
  a.zone === 'J' ? releaseJump() : releaseSlide();
  const dx = cx - a.x, dy = cy - a.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 28 && performance.now() - a.t < 500) pushDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
}
if (window.PointerEvent) {
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (_) {} canvasDown(e.pointerId, e.clientX, e.clientY); });
  canvas.addEventListener('pointerup', (e) => canvasUp(e.pointerId, e.clientX, e.clientY));
  canvas.addEventListener('pointercancel', (e) => canvasUp(e.pointerId, e.clientX, e.clientY));
} else {
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); for (const tc of e.changedTouches) canvasDown(tc.identifier, tc.clientX, tc.clientY); }, { passive: false });
  canvas.addEventListener('touchend', (e) => { for (const tc of e.changedTouches) canvasUp(tc.identifier, tc.clientX, tc.clientY); });
  canvas.addEventListener('mousedown', (e) => canvasDown('m', e.clientX, e.clientY));
  window.addEventListener('mouseup', (e) => canvasUp('m', e.clientX, e.clientY));
}

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Enter') { e.preventDefault(); startGame(); } return; }

  var PAGES = { hub: null, game: 'drush', sunrise: 'sunrise', clue1: 'node1', clue2: 'node2', clue3: 'node3' };
  var PATHS = { '': 'hub', 'a1': 'hub', 'hub': 'hub', 'game': 'game', 'sunrise': 'sunrise', 'diyiguan': 'clue1', 'niveldos': 'clue2', 'sankyu': 'clue3', 'clue1': 'clue1', 'clue2': 'clue2', 'clue3': 'clue3' };
  var VIS_DEFAULT = { fastpass: true, bc: true, drush: true, sunrise: true, node1: false, node2: false, node3: false, top10: true, wall: true, links: true };
  var TXT = { zh: { loading: '正在加载…', notVisible: '这个内容暂未开放。' }, en: { loading: 'Loading…', notVisible: 'That isn’t open yet.' } };

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function $(id) { return document.getElementById(id); }
  function lang() { var l = store('participant_lang') || navigator.language || 'zh'; return /^zh/i.test(l) ? 'zh' : 'en'; }
  function t(k) { return TXT[lang()][k]; }

  var sb = null;
  try { if (window.supabase && window.supabase.createClient) sb = window.supabase.createClient(SB_URL, SB_KEY); } catch (e) { sb = null; }

  // ---------- switches + pushed links (read-only) ----------
  function readJSON(k, fb) { try { var v = JSON.parse(store(k) || 'null'); return v == null ? fb : v; } catch (e) { return fb; } }
  var vis = Object.assign({}, VIS_DEFAULT, readJSON('dl_suite_vis', {}));
  var links = readJSON('dl_suite_links', []); if (!Array.isArray(links)) links = [];
  var visL = [], linkL = [];
  function emit(list, val) {
    return list.filter(function (l) {
      try { if (l.win && (l.win.closed || !l.win.document)) return false; l.fn(val); return true; } catch (e) { return false; }
    });
  }
  function setVis(next) {
    vis = Object.assign({}, VIS_DEFAULT, next || {});
    store('dl_suite_vis', JSON.stringify(vis));
    visL = emit(visL, Object.assign({}, vis));
    if (route !== 'hub' && !EMBED && !allowed(route)) navigate('hub', true);
  }
  function loadVis() {
    if (!sb) return;
    sb.from('portal_visibility').select('settings').eq('id', 1).maybeSingle().then(function (res) {
      if (!res.error) setVis(res.data ? res.data.settings : {});
    }, function () {});
  }
  function loadLinks() {
    if (!sb) return;
    sb.from('portal_links').select('id, title, title_en, url, pushed_at').eq('active', true)
      .order('pushed_at', { ascending: false }).limit(30).then(function (res) {
        if (res.error) return;
        links = res.data || [];
        store('dl_suite_links', JSON.stringify(links));
        linkL = emit(linkL, links.slice());
      }, function () {});
  }

  // ---------- one status call (dl_pulse) for the shell and the hub ----------
  // Falls back to the two separate reads if the database doesn't have dl_pulse yet.
  var pulse = { data: null, at: 0 }, pulseL = [], pulseOk = null;
  function loadPulse() {
    if (!sb || pulseOk === false) return Promise.resolve(false);
    return sb.rpc('dl_pulse').then(function (res) {
      if (res.error) { if (/dl_pulse|PGRST202|42883|schema cache/i.test((res.error.message || '') + ' ' + (res.error.code || ''))) pulseOk = false; return false; }
      var d = res.data || {};
      pulseOk = true; pulse = { data: d, at: Date.now() };
      setVis(d.vis || {});
      links = Array.isArray(d.links) ? d.links : [];
      store('dl_suite_links', JSON.stringify(links));
      linkL = emit(linkL, links.slice());
      pulseL = emit(pulseL, d);
      return true;
    }, function () { return false; });
  }
  function refresh() { return loadPulse().then(function (ok) { if (!ok) { loadVis(); loadLinks(); pulseL = emit(pulseL, null); } }); }

  // ---------- module sources ----------
  var srcCache = {}, urlCache = {};
  function decode(s) { return s.replace(/<@@DLE@@/g, '</script').replace(/<@@DLS@@/g, '<script').replace(/<@@DLC@@/g, '<!--'); }
  function source(id) { if (srcCache[id] == null) { var el = $('dlm-' + id); srcCache[id] = el ? decode(el.textContent) : ''; } return srcCache[id]; }
  function moduleUrl(id) {
    if (!urlCache[id]) { var html = source(id); if (!html) return 'about:blank'; urlCache[id] = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' })); }
    return urlCache[id];
  }
  function baseHref() { return location.href.split('#')[0]; }
  var SRCDOC = location.protocol === 'file:' || !(window.URL && URL.createObjectURL && window.Blob);
  var EMBED = /[?&]embed=1/.test(location.hash);
  function resolveRoute(r) { r = String(r || '').replace(/^\/+|\/+$/g, '').toLowerCase(); return PATHS.hasOwnProperty(r) ? PATHS[r] : null; }
  function allowed(r) {
    r = resolveRoute(r) || r;
    if (r === 'hub') return true;
    if (r === 'sunrise' && scanPass()) return true;
    return PAGES.hasOwnProperty(r) && vis[PAGES[r]] !== false;
  }

  // ---------- node QR codes ----------
  // /diyiguan, /niveldos and /sankyu send phones to #/sunrise?scan=<page>. Sunrise opens even when its switch
  // is off, and the game hands the scan to the team (see dl_pending_scan in the Sunrise page).
  var SCAN_ALIAS = { diyiguan: 'logs', niveldos: 'ledger', sankyu: 'banking', node1: 'logs', node2: 'ledger', node3: 'banking', logs: 'logs', ledger: 'ledger', banking: 'banking' };
  var SCAN_HOURS = 12;
  function scanPass() { var at = +store('dl_scan_pass') || 0; return Date.now() - at < SCAN_HOURS * 3600 * 1000; }
  function takeScan() {
    var m = /[?&]scan=([a-z0-9_-]+)/i.exec(location.hash || '');
    if (!m) return;
    var node = SCAN_ALIAS[m[1].toLowerCase()];
    if (node) {
      store('dl_pending_scan', JSON.stringify({ node: node, at: Date.now() }));
      store('dl_scan_pass', String(Date.now()));
    }
    if (history.replaceState) history.replaceState(null, '', '#/sunrise'); else location.hash = '#/sunrise';
  }

  window.DL = {
    __dl: 1,
    url: function (r) { r = resolveRoute(r) || 'hub'; return SRCDOC ? baseHref() + '#/' + r + '?embed=1' : moduleUrl(r); },
    link: function (r) { return baseHref() + '#/' + r; },
    asset: function (p) { try { return new URL(p, baseHref()).href; } catch (e) { return p; } },
    resolve: function (p) { if (!/^https?:/i.test(location.protocol)) return null; try { return new URL(p, baseHref()).href; } catch (e) { return null; } },
    info: function () { return source('info'); },
    hubInfo: function () { return source('hubinfo'); },
    onVis: function (fn, win) { visL.push({ fn: fn, win: win || null }); try { fn(Object.assign({}, vis)); } catch (e) {} },
    onLinks: function (fn, win) { linkL.push({ fn: fn, win: win || null }); try { fn(links.slice()); } catch (e) {} },
    // Pages share this window's Supabase client (one connection per phone) and its status call.
    supabase: function (url, key) { return sb && url === SB_URL && key === SB_KEY ? sb : null; },
    pulse: {
      on: function (fn, win) { pulseL.push({ fn: fn, win: win || null }); },
      refresh: refresh
    },
    roleOf: function () { return null; },
    deniedText: function () { return '这个页面只对工作人员开放 / Staff only.'; },
    allowed: allowed,
    map: function (href) {
      if (!href) return null;
      if (/^#\//.test(href)) return resolveRoute(href.slice(2).split('?')[0]);
      var m = /^https?:\/\/(?:www\.)?projectsunrise\.win\/?([^?#]*)/i.exec(href);
      return m ? resolveRoute(m[1]) : null;
    },
    go: function (r, opts) { if (opts && opts.newTab) { window.open(this.link(r), '_blank', 'noopener'); return; } navigate(r); }
  };

  // ---------- frames ----------
  var frames = {}, route = null;
  function show(id) {
    var f = frames[id];
    if (!f) {
      f = document.createElement('iframe');
      f.setAttribute('title', id);
      f.setAttribute('allow', 'autoplay; fullscreen; clipboard-read; clipboard-write; web-share; screen-wake-lock');
      f.setAttribute('allowfullscreen', '');
      var loader = document.createElement('div');
      loader.className = 'loading';
      loader.innerHTML = '<div><div class="spin"></div>' + t('loading') + '</div>';
      f.addEventListener('load', function () { if (loader.parentNode) loader.parentNode.removeChild(loader); });
      if (SRCDOC) f.srcdoc = source(id); else f.src = moduleUrl(id);
      $('frames').appendChild(loader); $('frames').appendChild(f);
      frames[id] = f;
    }
    for (var k in frames) {
      frames[k].classList.toggle('on', k === id);
      if (k !== id && k !== 'hub') { frames[k].parentNode.removeChild(frames[k]); delete frames[k]; }
    }
    try { f.focus(); } catch (e) {}
  }
  function navigate(r, replace) {
    var target = r === 'hub' ? '#/' : '#/' + r;
    if (location.hash === target) { apply(); return; }
    if (replace && history.replaceState) { history.replaceState(null, '', target); apply(); } else location.hash = target;
  }
  var toastTimer;
  function toast(msg) { var el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2200); }
  function apply() {
    var raw = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
    var r = resolveRoute(raw);
    if (!r) { if (raw) { navigate('hub', true); return; } r = 'hub'; }
    if (r !== 'hub' && !EMBED && !allowed(r)) { toast(t('notVisible')); navigate('hub', true); return; }
    route = r;
    show(r);
  }

  window.addEventListener('hashchange', function () { takeScan(); apply(); });
  takeScan();
  apply();
  // Notice and consent before anyone joins a team or posts (covers the page until agreed).
  if (window.DLConsent && !EMBED) DLConsent.require();
  refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - pulse.at > 8000) refresh(); });
  if (sb) {
    try {
      sb.channel('dl-p-vis').on('postgres_changes', { event: '*', schema: 'public', table: 'portal_visibility' }, function (p) { if (p && p.new && p.new.settings) setVis(p.new.settings); }).subscribe();
      sb.channel('dl-p-links').on('postgres_changes', { event: '*', schema: 'public', table: 'portal_links' }, loadLinks).subscribe();
    } catch (e) {}
  }
})();
</script>
