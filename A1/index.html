/* Layout: one full-screen frame showing the participant hub (or a page it opens). No staff entry. */
:root { --ink: #080b11; --green: #86BC25; --fg-3: #6B7480; --line-2: rgba(255,255,255,.14); color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: #F3F5F7; overscroll-behavior: none; }
body { font-family: Aptos, "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color: transparent; }
#frames { position: fixed; inset: 0; }
#frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--ink); visibility: hidden; }
#frames iframe.on { visibility: visible; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-3); font-size: 13px; text-align: center; pointer-events: none; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--green); animation: spin .8s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: #181d29; border: 1px solid var(--line-2); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

  syncPages(current);

    get: function () { return current; },

    lastZh: function () { return current !== 'en' ? current : lastZh; },
    browser: fromBrowser,
    set: function (l, src) {

})();
