const NODE_HASH = {

async function localNodeCheck(node, answer) {
  try {
    if (!NODE_HASH[node] || !window.crypto || !crypto.subtle || !window.TextEncoder) return null;

    const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    return hex === NODE_HASH[node];
  } catch (e) {
    return null;
  }
}
