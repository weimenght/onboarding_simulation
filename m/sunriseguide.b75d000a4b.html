<style>
/* Staff walkthrough of Project Sunrise: one step per screen, built to be projected. No answers on any slide. */
:root {
  --ink: #070a10; --panel: #0f141d; --panel-2: #151b26; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.18);
  --fg: #F3F5F7; --fg-2: #AEB6C1; --fg-3: #6B7480; --green: #86BC25;
  --it: #67E8F9; --fin: #FCD34D; --comp: #C4B5FD; --cmd: #FDA4AF; --red: #F87171;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
html[lang^="zh"] body { line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.app { min-height: 100%; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 14px clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand i { color: #FBBF24; }
.steps { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
.steps button { border: 1px solid var(--line-2); background: transparent; color: var(--fg-3); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.steps button[aria-current="step"] { background: var(--green); color: #0b1018; border-color: var(--green); }
.steps button.done { color: var(--fg-2); }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: clamp(16px, 4vw, 48px); }
.slide { width: min(1180px, 100%); animation: in .35s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .slide { animation: none; } }
.kicker { font-family: var(--mono); font-size: clamp(11px, 1.1vw, 14px); letter-spacing: .14em; text-transform: uppercase; color: var(--green); margin: 0 0 10px; }
h1 { font-size: clamp(28px, 4.4vw, 60px); line-height: 1.12; margin: 0 0 14px; font-weight: 900; letter-spacing: -.01em; }
h2 { font-size: clamp(24px, 3.2vw, 44px); line-height: 1.15; margin: 0 0 12px; font-weight: 900; }
.lead { font-size: clamp(16px, 1.6vw, 22px); color: var(--fg-2); max-width: 64ch; margin: 0 0 26px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 900px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .g2, .g4 { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: clamp(14px, 1.6vw, 22px); }
.card h3 { margin: 0 0 6px; font-size: clamp(16px, 1.5vw, 21px); display: flex; align-items: center; gap: 10px; }
.card p { margin: 0; color: var(--fg-2); font-size: clamp(14px, 1.2vw, 17px); }
.card .tag { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 6px; padding: 2px 7px; border: 1px solid currentColor; opacity: .9; margin-left: auto; }
.ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; font-size: 17px; }
.it { color: var(--it); } .fin { color: var(--fin); } .comp { color: var(--comp); } .cmd { color: var(--cmd); }
.ic.it { background: rgba(103,232,249,.12); } .ic.fin { background: rgba(252,211,77,.12); } .ic.comp { background: rgba(196,181,253,.12); } .ic.cmd { background: rgba(253,164,175,.12); }
.card.cmd-card { border-color: rgba(253,164,175,.45); background: linear-gradient(180deg, rgba(253,164,175,.07), var(--panel)); }
.ask { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 18px; }
@media (max-width: 760px) { .ask { grid-template-columns: 1fr; } }
.ask .card { border-color: rgba(248,113,113,.35); }
.ask .n { font-family: var(--mono); color: var(--red); font-weight: 800; font-size: 13px; letter-spacing: .1em; }
.note { margin-top: 18px; color: var(--fg-3); font-size: clamp(13px, 1.1vw, 15px); display: flex; gap: 8px; align-items: flex-start; }
.note i { color: var(--green); margin-top: 3px; }
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 26px; margin: 8px 0 4px; list-style: none; padding: 0; }
.flow li { position: relative; background: var(--panel); border: 1px solid var(--c, var(--line-2)); border-radius: 16px; padding: 16px; min-height: 132px; }
.flow li + li::before { content: ""; position: absolute; left: -22px; top: 50%; width: 18px; height: 2px; background: var(--green); }
.flow li + li::after { content: ""; position: absolute; left: -10px; top: calc(50% - 5px); border: 6px solid transparent; border-left-color: var(--green); }
.flow .no { font-family: var(--mono); color: var(--fg-3); font-size: 13px; font-weight: 800; }
.flow .i { color: var(--c); font-size: 18px; float: right; }
.flow b { display: block; font-size: clamp(16px, 1.45vw, 20px); margin: 10px 0 4px; line-height: 1.25; }
.flow span.s { color: var(--fg-2); font-size: clamp(13px, 1.1vw, 15px); }
@media (max-width: 900px) { .flow { grid-template-columns: 1fr; gap: 12px; } .flow li { min-height: 0; } .flow li + li::before, .flow li + li::after { display: none; } }
.freeze { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 0; }
.freeze span { font-family: var(--mono); font-weight: 800; font-size: clamp(14px, 1.4vw, 19px); padding: 8px 12px; border-radius: 12px; background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.35); color: #FCA5A5; }
.freeze em { font-style: normal; color: var(--fg-3); font-weight: 600; font-size: 12px; margin-right: 6px; }
.split { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.split b { font-family: var(--mono); padding: 6px 12px; border-radius: 999px; border: 1px solid currentColor; font-size: clamp(13px, 1.2vw, 16px); }
.check { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.check li { display: flex; gap: 10px; align-items: flex-start; color: var(--fg-2); font-size: clamp(14px, 1.25vw, 17px); }
.check li i { color: var(--green); margin-top: 4px; flex: none; }
.check b { color: var(--fg); }
footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px clamp(16px, 4vw, 40px) calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.nav { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 12px; padding: 10px 18px; font-weight: 800; display: inline-flex; gap: 8px; align-items: center; }
.nav.primary { background: var(--green); color: #0b1018; border-color: var(--green); }
.nav:disabled { opacity: .35; cursor: default; }
.count { font-family: var(--mono); color: var(--fg-3); font-size: 13px; }
.lang[hidden] { display: none; }
.lang { display: flex; border: 1px solid var(--line-2); border-radius: 10px; padding: 2px; }
.lang button { border: 0; background: transparent; color: var(--fg-3); padding: 4px 9px; border-radius: 8px; font-size: 12px; font-weight: 800; }
.lang button[aria-pressed="true"] { background: rgba(255,255,255,.12); color: var(--fg); }
@media (max-width: 640px) { .steps { display: none; } }
</style>

    },
    function () {
      var steps = [15, 30, 60, 120, 300].map(function (s, i) { return '<span><em>' + esc(t('fzN')[i]) + '</em>' + (s < 60 ? s + ' s' : (s / 60) + ' min') + '</span>'; }).join('');
      return '<p class="kicker">' + esc(t('s4k')) + '</p><h2>' + esc(t('s4h')) + '</h2>' +
        '<div class="ask">' + [['h1', 'h1p'], ['h2', 'h2p'], ['h3', 'h3p']].map(function (a, i) {
          return '<div class="card"><div class="n">' + esc(t(a[0])) + (i ? ' <i class="fa-solid fa-lock" style="color:#6B7480;margin-left:6px"></i>' : '') + '</div><p style="margin-top:6px;color:#F3F5F7;font-weight:700">' + esc(t(a[1])) + '</p></div>';
        }).join('') + '</div>' +
        '<p class="lead" style="margin-bottom:8px">' + esc(t('fz')) + '</p><div class="freeze">' + steps + '</div>' +
        '<p class="note"><i class="fa-solid fa-lightbulb"></i><span>' + esc(t('s4n')) + '</span></p>';
    },
    function () {
      return '<p class="kicker">' + esc(t('s5k')) + '</p><h2>' + esc(t('s5h')) + '</h2><div class="grid g2">' +
        [['w1', 'w1p', 'fa-flag-checkered'], ['w2', 'w2p', 'fa-stopwatch'], ['w3', 'w3p', 'fa-trophy'], ['w4', 'w4p', 'fa-hourglass-half']].map(function (w) {
          return '<div class="card"><h3><span class="ic" style="background:rgba(134,188,37,.12);color:#86BC25"><i class="fa-solid ' + w[2] + '"></i></span>' + esc(t(w[0])) + '</h3><p>' + esc(t(w[1])) + '</p></div>';
        }).join('') + '</div>';
    },
    function () {
      var col = function (h, keys, icon) { return '<div class="card"><h3><span class="ic" style="background:rgba(134,188,37,.12);color:#86BC25"><i class="fa-solid ' + icon + '"></i></span>' + esc(t(h)) + '</h3><ul class="check">' + keys.map(function (k) { return '<li><i class="fa-solid fa-check"></i><span>' + t(k) + '</span></li>'; }).join('') + '</ul></div>'; };
      return '<p class="kicker">' + esc(t('s6k')) + '</p><h2>' + esc(t('s6h')) + '</h2><div class="grid g3">' +
        col('before', ['b1', 'b2', 'b3'], 'fa-list-check') + col('during', ['d1', 'd2', 'd3'], 'fa-person-running') + col('after', ['e1', 'e2'], 'fa-comments') + '</div>';
    }
  ];
  var i = 0;
  try { var saved = +sessionStorage.getItem('sunrise_guide_step'); if (saved >= 0 && saved < SLIDES.length) i = saved; } catch (e) {}
  function render() {
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    $('stage').innerHTML = '<section class="slide" aria-roledescription="slide">' + SLIDES[i]() + '</section>';
    $('steps').innerHTML = t('steps').map(function (s, k) { return '<button type="button" data-i="' + k + '"' + (k === i ? ' aria-current="step"' : '') + (k < i ? ' class="done"' : '') + '>' + (k + 1) + ' · ' + esc(s) + '</button>'; }).join('');
    $('prev').disabled = i === 0; $('prev').lastChild.textContent = t('prev');
    $('next').firstChild.textContent = i === SLIDES.length - 1 ? t('restart') : t('next');
    $('count').textContent = (i + 1) + ' / ' + SLIDES.length;
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === lang)); });
    try { sessionStorage.setItem('sunrise_guide_step', String(i)); } catch (e) {}
  }
  function go(n) { i = (n + SLIDES.length) % SLIDES.length; render(); }
  $('prev').onclick = function () { if (i > 0) go(i - 1); };
  $('next').onclick = function () { go(i + 1); };
  $('steps').onclick = function (e) { var b = e.target.closest('button[data-i]'); if (b) go(+b.getAttribute('data-i')); };
  document.querySelector('.lang').onclick = function (e) {
    var b = e.target.closest('button[data-l]'); if (!b) return;
    lang = b.getAttribute('data-l');
    try { if (window.DLH && DLH.setLang) DLH.setLang(lang === 'en' ? 'en' : (DLH.lastZh ? DLH.lastZh() : 'zh-Hans'), window); else localStorage.setItem('dl_lang', lang === 'en' ? 'en' : 'zh-Hans'); } catch (err) {}
    render();
  };
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(i + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); if (i > 0) go(i - 1); }
  });
  try { if (window.DLH && DLH.onLang) DLH.onLang(function () { var l = DLH.lang() === 'en' ? 'en' : 'zh'; if (l !== lang) { lang = l; render(); } }, window); } catch (e) {}
  if (window.DLH && DLH.lang) document.querySelector('.lang').hidden = true; // the suite's EN / 简 / 繁 switch drives this page
  render();
})();
</script>
</body>
</html>
