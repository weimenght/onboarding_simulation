  <script>
    /* ==========================================================
       0. SUPABASE AUTHENTICATION
       ========================================================== */
    const SUPABASE_URL = "https://pwnvkrrnxbpxignynvuh.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3bnZrcnJueGJweGlnbnludnVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODU4OTIsImV4cCI6MjEwNzQ2MTg5Mn0.ArJ6pQkZu81lO0iWGC94xVMDcYgarzDBk00zqBmfMrQ";
    let supabaseClient = null;

    if (window.supabase && typeof window.supabase.createClient === 'function') {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    async function initAuth() {
      if (!supabaseClient) {
        showAuthError("Supabase 脚本加载失败，请检查网络");
        return;
      }
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          renderAuthorized();
        } else {
          document.getElementById('emailInput').focus();
        }
        supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' && session) renderAuthorized();
          else if (event === 'SIGNED_OUT') renderLocked();
        });
      } catch (err) {
        console.error("Auth init error:", err);
      }
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');

      if (!supabaseClient) {
        showAuthError("无法连接到认证服务");
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = "验证中 · Verifying...";
      submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          showAuthError(error.message);
        } else if (data?.user) {
          document.getElementById('errorMessage').classList.add('hidden');
          renderAuthorized();
        }
      } catch (err) {
        showAuthError("请求异常: " + (err.message || "Network Error"));
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = "验证并登录 · Sign In";
        submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
      }
    }

    function showAuthError(message) {
      const errorEl = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const gateCard = document.getElementById('gateCard');
      errorText.textContent = message;
      errorEl.classList.remove('hidden');
      gateCard.classList.remove('shake-error');
      void gateCard.offsetWidth;
      gateCard.classList.add('shake-error');
    }

    async function handleLogout() {
      closeQrModal();
      if (supabaseClient) await supabaseClient.auth.signOut();
    }

    function renderAuthorized() {
      if (window.DLGuard && !DLGuard(typeof supabaseClient !== 'undefined' ? supabaseClient : null, showAuthError)) return;
      document.getElementById('passwordGate').classList.add('hidden');
    }

    function renderLocked() {
      document.getElementById("qrModal").classList.add("hidden");
      document.getElementById('passwordGate').classList.remove('hidden');
      const passwordInput = document.getElementById('passwordInput');
      if (passwordInput) passwordInput.value = '';
      document.getElementById('errorMessage').classList.add('hidden');
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('toggleEyeIcon');
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      icon.className = visible ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    }

    /* ==========================================================
       1. STATIONS METADATA (Synchronized with FastPass)
       ========================================================== */
    const STATIONS = [
      {
        id: 1,
        zh: '一起拼未来',
        en: 'Piece by piece, we change',
        icon: 'fa-puzzle-piece',
        image: DLA('assets/qr1.png')
      },
      {
        id: 2,
        zh: '培育您的职业道德之树',
        en: 'Plant Your Ethical Tree',
        icon: 'fa-tree',
        image: DLA('assets/qr2.png')
      },
      {
        id: 3,
        zh: '信号解密',
        en: 'D.Signal',
        icon: 'fa-tower-broadcast',
        image: DLA('assets/qr3.png')
      },
      {
        id: 4,
        zh: '勤业智库',
        en: 'Knowledge Clash',
        icon: 'fa-brain',
        image: DLA('assets/qr4.png')
      },
      {
        id: 5,
        zh: '情商罗盘',
        en: 'EQ Matrix',
        icon: 'fa-compass',
        image: DLA('assets/qr5.png')
      },
      {
        id: 6,
        zh: 'AI纪元',
        en: 'The AI Era',
        icon: 'fa-microchip',
        image: DLA('assets/qr6.png')
      }
    ];

    /* ==========================================================
       2. SOUND ENGINE (Tone.js Synthesis)
       ========================================================== */
    let audioEnabled = true;
    let audioReady = false;
    let openSynth = null;
    let closeSynth = null;

    async function initAudioEngine() {
      if (audioReady) return;
      try {
        await DLTone();

        openSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: "triangle" },
          envelope: { attack: 0.005, decay: 0.15, sustain: 0.05, release: 0.4 }
        }).toDestination();
        openSynth.volume.value = -6;

        closeSynth = new Tone.MembraneSynth({
          pitchDecay: 0.01,
          octaves: 1.5,
          envelope: { attack: 0.001, decay: 0.06, sustain: 0.01, release: 0.05 }
        }).toDestination();
        closeSynth.volume.value = -10;

        audioReady = true;
      } catch (err) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const icon = document.getElementById("audioIcon");
      const text = document.getElementById("audioText");
      if (audioEnabled) {
        if (icon) icon.className = "fa-solid fa-volume-high text-deloitte-green";
        if (text) text.className = "text-gray-300";
        initAudioEngine();
      } else {
        if (icon) icon.className = "fa-solid fa-volume-xmark text-deloitte-gray";
        if (text) text.className = "text-deloitte-gray";
      }
    }

    function playSound(type) {
      if (!audioEnabled) return;
      initAudioEngine();
      const now = (window.Tone ? Tone.now() : 0);
      try {
        if (type === 'open' && openSynth) {
          openSynth.triggerAttackRelease(["E5", "B5"], "16n", now);
        } else if (type === 'close' && closeSynth) {
          closeSynth.triggerAttackRelease("C3", "32n", now);
        }
      } catch (e) {}
    }

    /* ==========================================================
       3. MODAL LOGIC & QR CODE FALLBACK
       ========================================================== */
    function openQrModal(index) {
      playSound('open');
      const station = STATIONS[index];

      document.getElementById("modalStationBadge").textContent = `Station ${station.id}`;
      document.getElementById("modalStationIcon").className = `fa-solid ${station.icon} text-xs`;
      document.getElementById("modalTitleZh").textContent = station.zh;
      document.getElementById("modalTitleEn").textContent = station.en;

      const img = document.getElementById("modalQrImg");
      const fallback = document.getElementById("modalQrFallback");

      img.classList.remove("hidden");
      fallback.classList.add("hidden");
      fallback.innerHTML = "";

      img.onerror = function() {
        img.classList.add("hidden");
        fallback.classList.remove("hidden");
        fallback.innerHTML = "";
        new QRCode(fallback, {
          text: `https://projectsunrise.win/qr/station${station.id}`,
          width: 216,
          height: 216,
          colorDark: "#090c12",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      };

      img.src = station.image;
      document.getElementById("qrModal").classList.remove("hidden");
    }

    function closeQrModal() {
      playSound('close');
      document.getElementById("qrModal").classList.add("hidden");
    }

    function handleBackdropClick(e) {
      if (e.target.id === "qrModal") {
        closeQrModal();
      }
    }

    /* Keyboard Shortcuts: 1-6 open stations, ESC closes modal */
    window.addEventListener("keydown", (e) => {
      const gate = document.getElementById("passwordGate");
      if (gate && !gate.classList.contains("hidden")) return;
      if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;

      const modal = document.getElementById("qrModal");
      if (e.key === "Escape") {
        if (!modal.classList.contains("hidden")) {
          closeQrModal();
        }
      } else if (["1", "2", "3", "4", "5", "6"].includes(e.key)) {
        const index = parseInt(e.key, 10) - 1;
        openQrModal(index);
      }
    });

    window.addEventListener("load", () => {
      initAuth();
    });

    document.addEventListener("click", () => {
      if (!audioReady && audioEnabled) initAudioEngine();
    }, { once: true });
  </script>
</body>
</html>
