<style>
/* Layout: projector stage (question + A-D grid) beside a live team column; host controls dock at the bottom. */
:root {
  --green: #86BC25; --green-dk: #568819; --teal: #004F59; --navy: #002776;
  --ink: #070a10; --panel: #0f141d; --panel-2: #151b26; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16);

  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);

  background: radial-gradient(1100px 600px at 105% -10%, rgba(0,79,89,.55), transparent 60%), radial-gradient(900px 520px at -10% 110%, rgba(0,39,118,.42), transparent 60%); }

.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding: max(14px, var(--safe-t)) max(18px, var(--safe-r)) max(12px, var(--safe-b)) max(18px, var(--safe-l)); gap: 14px; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 16px; min-width: 0; }

.icon-btn:hover { color: var(--fg); border-color: rgba(255,255,255,.3); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(280px, 24vw, 380px); gap: 14px; min-height: 0; }
.stage { position: relative; display: flex; flex-direction: column; gap: clamp(12px, 1.6vh, 22px); min-height: 0; padding: clamp(16px, 2vw, 30px);

.mark.okm { background: var(--green); color: #0b0f06; border-color: var(--green); }

.timer { height: 10px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }

.timer.low i { background: linear-gradient(90deg, var(--bad), #fb7185); }
.timer-row { display: flex; align-items: center; gap: 12px; }
.timer-row .timer { flex: 1; }
.timer-row b { font-family: var(--mono); font-size: 20px; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,10,16,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 5; text-align: center; }
.count { font-family: var(--mono); font-weight: 800; font-size: clamp(140px, 22vw, 340px); line-height: 1; color: var(--green); text-shadow: 0 0 60px rgba(134,188,37,.45); }
.count.go { font-size: clamp(110px, 16vw, 260px); }
.count-sub { font-size: clamp(16px, 1.6vw, 24px); color: var(--fg-2); font-weight: 800; margin-top: 10px; }

.pop { animation: pop .35s cubic-bezier(.16,1,.3,1); }
.banner { display: flex; align-items: center; gap: 16px; padding: clamp(10px, 1.6vh, 14px) 18px; border-radius: 18px; font-weight: 900; font-size: clamp(17px, min(1.8vw, 3.2vh), 28px); }
.banner.win { background: rgba(134,188,37,.16); border: 1.5px solid rgba(134,188,37,.6); color: #d9f99d; }

.banner small { display: block; font-size: 13px; font-weight: 700; color: var(--fg-2); }

/* ---------- team column ---------- */
.side { display: flex; flex-direction: column; gap: 10px; min-height: 0; padding: 16px; border-radius: 24px; background: rgba(15,20,29,.86); border: 1px solid var(--line); }

.team .rel { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg-3); font-size: 11px; display: inline-grid; place-items: center; }

/* ---------- settings drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; }

  display: flex; flex-direction: column; padding: max(18px, var(--safe-t)) max(20px, var(--safe-r)) max(18px, var(--safe-b)) 20px; gap: 16px; overflow: auto; }

.rounds { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }

<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="ic"><i class="fa-solid fa-brain"></i></span><span><b data-t="title"></b><small>Knowledge Clash Live</small></span></div>
    <span class="pill" id="roundPill"></span>
    <span class="pill dim" id="qPill"></span>
    <span class="spacer"></span>

    var b = e.target.closest && e.target.closest('[data-mode]'); if (!b) return;
    var bs = $('modeSeg').querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', String(bs[i] === b));
  };
  $('reboundTgl').onclick = function () { this.setAttribute('aria-checked', String(this.getAttribute('aria-checked') !== 'true')); };
  function clampInt(v, lo, hi, d) { v = parseInt(v, 10); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); }
  $('saveRules').onclick = function () {
    var modeBtn = $('modeSeg').querySelector('[aria-pressed="true"]');
    var row = {
      team_mode: modeBtn ? modeBtn.getAttribute('data-mode') : 'team',
      points_correct: clampInt($('ptsOk').value, 0, 1000, 10), points_wrong: clampInt($('ptsBad').value, 0, 1000, 5),
      answer_seconds: clampInt($('ansSec').value, 3, 300, 15), countdown_seconds: clampInt($('cdSec').value, 1, 10, 3),
      allow_rebound: $('reboundTgl').getAttribute('aria-checked') === 'true', updated_at: new Date().toISOString()
    };
    sb.from('kc_settings').update(row).eq('id', 1).select('*').then(function (res) {
      if (res.error || !res.data || !res.data.length) { secMsg('rulesMsg', res.error && isMissing(res.error) ? t('errSetup') : t('errGeneric', { m: (res.error && res.error.message) || 'no permission' }), true); return; }
      S.settings = res.data[0]; secMsg('rulesMsg', t('saved')); fillRules(); render();
    });
  };
  $('newSess').onclick = function () {
    if (!armed.sess) { armed.sess = true; setTimeout(function () { armed.sess = false; renderDrawer(); }, 4000); renderDrawer(); return; }
    armed.sess = false;
    rpc('kc_admin_new_session', { p_session: null }).then(function (d) {
      setDock(t('newSessDone', { s: d.session })); return Promise.all([loadSettings(), loadLive()]);
    }).then(function () { renderDrawer(); }, fail);
  };

  // ---------- boot ----------
  var gateShown = false;
  function gate(text) { gateShown = true; $('gate').hidden = false; $('gateText').textContent = text; paintStatic(); }
  function boot() {
    paintStatic();
    if (!sb) { gate(t('gateNoSb')); return; }
    sb.auth.getSession().then(function (res) {
      var u = res && res.data && res.data.session && res.data.session.user;
      var role = u && window.DLH && DLH.roleOf ? DLH.roleOf(u.email) : (u ? 'host' : null);
      if (!u || !role) { gate(t('gateNoAuth')); return; }
      syncClock(); setInterval(syncClock, 60000);
      Promise.all([loadSettings(), loadBank(), loadFastPass()]).then(loadLive);
      // Live updates only while Knowledge Clash is switched on; the polling below keeps the screen current either way.
      sb.from('portal_visibility').select('settings').eq('id', 1).maybeSingle().then(function (res) {
        var on = !!(res && res.data && res.data.settings && res.data.settings.kc === true);
        if (!on) { setDock(t('kcOff'), true); return; }
      try {
        sb.channel('kc-live-host')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'kc_live' }, function () { loadLive(); })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'kc_answers' }, function () { loadRoundData(); })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'kc_joins' }, function () { loadRoundData(); })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'knowledge_config' }, function () { loadBank(); })
          .subscribe();
      } catch (e) {}
      }, function () {});
      // Safety net if realtime is slow: quick while answering, relaxed otherwise.
      var lastPoll = 0;
      setInterval(function () {
        if (document.hidden || gateShown) return;
        var st = S.live ? S.live.state : 'idle', gap = st === 'live' ? 900 : 3000;
        if (Date.now() - lastPoll < gap) return;
        lastPoll = Date.now(); loadLive(); if (S.live && S.live.round_no) loadRoundData();
      }, 300);
      var lastDock = 0;
      (function frame() {
        if (S.live && S.live.state === 'live') tick();
        if (Date.now() - lastDock > 500) { lastDock = Date.now(); renderDock(); }
        requestAnimationFrame(frame);
      })();
    });
  }
  boot();
})();
</script>
</body>
</html>
